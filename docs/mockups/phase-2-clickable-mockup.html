<title>MT Group Quote Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground: #FAFAF8;
    --surface: #FFFFFF;
    --surface-sunk: #F3F4F2;
    --ink: #16211F;
    --ink-soft: #5F6E6B;
    --ink-faint: #8D9995;
    --rule: #E2E6E3;
    --rule-strong: #CBD2CF;
    --accent: #0E5B57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EFEC;

    --st-draft-fg: #5F6E6B;   --st-draft-bg: #ECEEEC;
    --st-review-fg: #8A5606;  --st-review-bg: #FBF0DC;
    --st-sent-fg: #1B4F8C;    --st-sent-bg: #E4EDF8;
    --st-won-fg: #16613B;     --st-won-bg: #E0F0E7;
    --st-lost-fg: #8E3039;    --st-lost-bg: #FAE6E7;

    --danger: #A33A44;
    --needed: #9A6B10;
    --needed-bg: #FBF2DF;
    --danger-bg: #FBEBEC;

    --shadow: 0 1px 2px rgba(22, 33, 31, .05), 0 6px 20px -12px rgba(22, 33, 31, .18);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1312;
      --surface: #151B1A;
      --surface-sunk: #1B2322;
      --ink: #E9EEEC;
      --ink-soft: #97A5A1;
      --ink-faint: #6E7C79;
      --rule: #25302E;
      --rule-strong: #35423F;
      --accent: #57BAAE;
      --accent-ink: #06201E;
      --accent-soft: #14302D;

      --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
      --st-review-fg: #E0B366;  --st-review-bg: #332915;
      --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
      --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
      --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

      --danger: #E0949B;
      --needed: #D9A85A;
      --needed-bg: #2B2114;
      --danger-bg: #2A1A1C;

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1312;
    --surface: #151B1A;
    --surface-sunk: #1B2322;
    --ink: #E9EEEC;
    --ink-soft: #97A5A1;
    --ink-faint: #6E7C79;
    --rule: #25302E;
    --rule-strong: #35423F;
    --accent: #57BAAE;
    --accent-ink: #06201E;
    --accent-soft: #14302D;

    --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
    --st-review-fg: #E0B366;  --st-review-bg: #332915;
    --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
    --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
    --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

    --danger: #E0949B;
    --danger-bg: #2A1A1C;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- shell ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }

  .mark {
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.15;
  }

  .brand-org {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .13em;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  .nav { display: flex; gap: 4px; }

  .nav button {
    font: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav button:hover { background: var(--surface-sunk); color: var(--ink); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .banner {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 28px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    border-bottom: 1px solid var(--rule);
  }
  .banner strong { font-weight: 600; }
  .banner span { color: var(--ink-soft); }

  main { padding: 34px 28px 90px; max-width: 1120px; margin: 0 auto; }

  /* ---------- page heading ---------- */

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-soft); font-size: 14px; margin: 5px 0 0; }

  /* ---------- buttons ---------- */

  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }

  .btn-danger {
    border-color: transparent;
    background: none;
    color: var(--danger);
    padding-inline: 6px;
  }
  .btn-danger:hover { background: var(--danger-bg); border-color: transparent; }

  /* ---------- register table ---------- */

  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 11px;
    box-shadow: var(--shadow);
  }

  table { width: 100%; min-width: 860px; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .11em;
    color: var(--ink-faint);
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  th.num { text-align: right; }

  td {
    padding: 15px 18px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-sunk); }

  .q-name {
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  .q-name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .q-number {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 4px;
    word-break: break-word;
  }

  .q-specimens { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  .nowrap { white-space: nowrap; }

  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .chip-draft { background: var(--st-draft-bg); color: var(--st-draft-fg); }
  .chip-internal_reviewed { background: var(--st-review-bg); color: var(--st-review-fg); }
  .chip-sent { background: var(--st-sent-bg); color: var(--st-sent-fg); }
  .chip-won { background: var(--st-won-bg); color: var(--st-won-fg); }
  .chip-lost { background: var(--st-lost-bg); color: var(--st-lost-fg); }

  .tag-ext {
    display: inline-block;
    margin-left: 7px;
    padding: 1px 7px;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .03em;
    vertical-align: 1px;
  }

  .table-foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: 11px;
    padding: 62px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .link-btn {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: inherit;
    color: var(--accent); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---------- form ---------- */

  .form-wrap { max-width: 760px; }

  .back {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: 13.5px;
    color: var(--ink-soft); cursor: pointer;
    margin-bottom: 18px;
  }
  .back:hover { color: var(--accent); }

  .quote-no-preview {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 26px;
  }
  .quote-no-preview .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--ink-faint); display: block; margin-bottom: 4px;
  }
  .quote-no-input {
    font-family: var(--mono) !important; font-size: 13.5px !important;
    background: var(--surface) !important;
  }
  .quote-no-foot {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-top: 6px;
  }
  .quote-no-foot .link-btn { font-size: 12px; }

  section.sec { margin-bottom: 24px; }

  .sec-head {
    display: flex; align-items: baseline; gap: 11px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 13px;
  }
  .sec-num {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); font-weight: 500;
  }
  .sec-title { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .sec-note { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

  .sec-pending {
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--rule);
    color: var(--ink-faint);
    font-size: 13.5px;
  }
  .sec-pending .sec-num { color: var(--ink-faint); }
  .sec-pending .phase {
    margin-left: auto; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .grid .full { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; }
  .fld > label {
    font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--ink);
  }
  .req { color: var(--needed); font-weight: 600; }
  .req-fld.is-empty > label { color: var(--needed); }
  .req-fld.is-empty input,
  .req-fld.is-empty select,
  .req-fld.is-empty textarea {
    border-color: var(--needed);
    background: var(--needed-bg);
  }

  .needed-key {
    font-size: 12.5px; color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .needed-key .req { margin-right: 4px; }

  .export { margin-top: 18px; }
  .export-note {
    font-size: 12.5px; color: var(--ink-soft);
    margin: 10px 0; max-width: 62ch; line-height: 1.55;
  }
  .export-csv {
    width: 100%; font-family: var(--mono); font-size: 11.5px;
    line-height: 1.5; white-space: pre; overflow-x: auto;
  }
  .export-actions { display: flex; align-items: center; gap: 14px; margin-top: 10px; }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    font: inherit; font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  ::placeholder { color: var(--ink-faint); opacity: 1; }

  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 3px; line-height: 1.45; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
  .check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }

  .check-row { display: flex; flex-wrap: wrap; gap: 7px 22px; }

  .specimen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 10px 18px;
  }

  .toggle-box {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 13px 14px;
    margin-bottom: 12px;
  }

  fieldset { border: 0; padding: 0; margin: 12px 0 0; }
  legend { font-size: 13px; font-weight: 500; margin-bottom: 6px; padding: 0; }

  /* ---------- empty-state note ---------- */

  .empty-note {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    background: var(--surface-sunk);
    border-left: 3px solid var(--rule-strong);
    border-radius: 0 7px 7px 0;
    padding: 8px 12px;
    margin-bottom: 11px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  /* ---------- lookup / carried-over detail ---------- */

  .carried {
    background: var(--accent-soft);
    border-radius: 9px;
    padding: 15px 17px;
    margin-bottom: 18px;
  }
  .carried-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); font-weight: 600; margin-bottom: 11px;
  }
  .carried-list {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
    margin: 0 0 10px;
  }
  .carried-list dt { font-size: 12.5px; color: var(--ink-soft); }
  .carried-list dd { margin: 0; font-size: 13.5px; }
  .carried .hint { margin-top: 0; }

  .lookup-idle {
    border: 1px dashed var(--rule-strong);
    border-radius: 9px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .autofilled {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 7px;
    vertical-align: 1px;
  }

  /* ---------- cohort rows ---------- */

  .cohorts { display: flex; flex-direction: column; }

  .cohort-row {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-row.full   { grid-template-columns: 1fr 120px 40px; }
  .cohort-row.ext    { grid-template-columns: 1fr 110px 110px 80px 40px; }

  .cohort-row .ca { text-align: right; font-variant-numeric: tabular-nums; }
  .cohort-row input[type="text"] { padding: 7px 9px; }
  .cohort-row .ca input { text-align: right; }

  .cohort-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); padding-bottom: 7px;
  }
  .cohort-row .dim { color: var(--ink-soft); }
  .cohort-total { border-bottom: 0; font-weight: 600; padding-top: 12px; }
  .cohort-total .strong { font-size: 15px; }

  .row-x {
    background: none; border: 0; cursor: pointer;
    color: var(--ink-faint); font-size: 17px; line-height: 1;
    padding: 4px 6px; border-radius: 6px;
  }
  .row-x:hover { color: var(--danger); background: var(--danger-bg); }

  .add-row {
    align-self: flex-start;
    margin-top: 12px;
    font: inherit; font-size: 13px;
    background: none; border: 1px dashed var(--rule-strong);
    border-radius: 7px; padding: 7px 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  .add-row:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 620px) {
    .cohort-row.ext  { grid-template-columns: 1fr 64px 78px 60px 32px; gap: 6px; font-size: 12.5px; }
    .cohort-row.full { grid-template-columns: 1fr 84px 32px; }
  }

  .cohort-card-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 7px; margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-card-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600;
    margin-right: auto;
  }
  .sub-label {
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }

  .ie-note {
    background: var(--surface-sunk);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    padding: 11px 14px;
    margin: 22px 0 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .ie-note strong { color: var(--ink); font-weight: 600; }

  /* ---------- biospecimen columns ---------- */

  .cohort-row.ship {
    grid-template-columns: 1.4fr 1.4fr 90px 110px 100px 34px;
    align-items: center;
  }
  .ship-intl {
    margin: -4px 0 12px;
    padding-left: 2px;
  }
  .ship-intl span { font-size: 12.5px; color: var(--ink-soft); }
  .ship-intl input:disabled + span { color: var(--ink-faint); }

  .cohort-row.sub-ext {
    grid-template-columns: 26px 1fr 84px 32px;
    align-items: center;
    padding-left: 14px;
  }
  .cohort-row.sub-add { grid-template-columns: 1fr; padding-left: 14px; }
  .data-rows { display: flex; flex-direction: column; }
  .data-row {
    display: grid; grid-template-columns: 1fr 92px 92px 96px;
    align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid var(--rule);
  }
  .data-row.head {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-faint);
    border-bottom-color: var(--rule-strong); padding-bottom: 6px;
  }
  .data-row.head span { text-align: center; }
  .data-row.head span:first-child { text-align: left; }
  .data-row .lbl { font-size: 14px; }
  .data-opt {
    display: flex; justify-content: center; cursor: pointer; padding: 3px 0;
  }
  .data-opt input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  @media (max-width: 560px) {
    .data-row { grid-template-columns: 1fr 56px 56px 60px; }
    .data-row .lbl { font-size: 13px; }
  }

  .cond { margin-bottom: 9px; }
  .cond-text {
    margin: 6px 0 4px 24px;
    width: calc(100% - 24px);
    font-size: 13.5px;
  }

  .cohort-row.cost {
    grid-template-columns: 1.5fr 90px 62px 1fr 96px 32px;
    align-items: center;
  }
  @media (max-width: 760px) { .cohort-row.cost { grid-template-columns: 1fr; gap: 6px; } }
  .cohort-row.unit {
    grid-template-columns: 1fr 64px 130px 78px 32px;
    align-items: center; padding: 0 0 8px;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-row.unit .hint { margin: 0; text-align: right; }

  .says {
    margin-left: auto;

  /**

   */
  function findStudyByQuoteRef(ref, quotesList) {
    var t = String(ref || '').trim();
    if (t.length < 4) return null;

    var low = t.toLowerCase();

    var exact = (quotesList || []).filter(function (q) {
      return q.quoteNumber && q.quoteNumber.toLowerCase() === low;

    if (exact) return { quote: exact, via: 'quote reference' };

  }

  /** Subjects in a cohort. Subcohorts win when present. Module scope because
   *  §03 counts them, §11 prices them and the export reads them. */
  function cohortSubjects(c) {
    if (c.subcohorts && c.subcohorts.length) {
      return c.subcohorts.reduce(function (s, sc) { return s + num(sc.subjects); }, 0);
    }
    return num(c.subjects);
  }

  /** A specimen with no explicit list is collected at every timepoint — the
   *  common case, and the one a rep should not have to tick. */
  function collectedAt(detail, name, tps) {
    if (!detail || !detail.atTimepoints) return true;
    return detail.atTimepoints.indexOf(name) > -1;
  }

  /** Collections per subject for one specimen. Never below 1: a single
   *  collection study still collects it once. */
  function collectionCount(detail, tps) {
    if (!tps || tps.length < 2) return 1;
    if (!detail || !detail.atTimepoints) return tps.length;
    return tps.filter(function (name) {
      return detail.atTimepoints.indexOf(name) > -1;
    }).length;
  }

  /** Study summary drafts in the real quotes' phrasing (spec §06). */
  function draftSummary(d) {
    var specs = orderedSpecimens(d).map(function (s) { return s.toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' and ' + specs[specs.length - 1]
      : specs.join(' and ');
    var pop = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean).join(', ');

    if (d.isExtension && d.header.designChanged === false) {
      var q = d.header.originalStudyQuote || 'the original quote';
      var po = d.header.originalStudyPo;
      return 'This study is an extension to that quoted under "' + q + '"' +
        (po ? ' and ordered under "' + po + '."' : '.') +
        ' All study design elements remain the same except as noted below ' +
        '(pricing repeated for clarity).';
    }
    if (!specPart && !pop) return '';
    var out = 'The goal of this study is to collect and evaluate ' +
      (specPart || 'biospecimens') + ' from ' + (pop || 'study') + ' subjects.';

    // A processing protocol decides whether a site can take part at all, so it
    // is carried into the summary rather than left in §05 for someone to find.
    var detail = d.specimenDetail || {};
    var protocols = orderedSpecimens(d).map(function (t) {
      var note = String((detail[t] || {}).processing || '').trim();
      return note ? t.toLowerCase() + ' requires ' + note.replace(/\.$/, '') : '';
    }).filter(Boolean);
    if (protocols.length) {
      out += ' Processing is not standard: ' + protocols.join('; ') + '.';
    }
    return out;
  }

  // ---------------------------------------------------------------- export
  // A register extract fit to hand to an analyst — or to Claude — without
  // handing over who the sponsors are or what we said about them internally.
  //
  // Removed outright: sponsor and contact names, contact emails, HubSpot deal
  // names, PO numbers, ship-to addresses, sponsor-selected case lists, and the
  // internal pricing notes, which exist precisely because they must not travel.
  //
  // Pseudonymised, not removed: each sponsor becomes a stable code (S01, S02)
  // so "the same sponsor" is still analysable, and each study becomes a code so
  // extensions still group with their parent. The mapping stays here, in the
  // tool. Nothing in the file resolves back to a name.
  //
  // Kept in full: dates, status, study shape and every number. Stripping the
  // economics would leave nothing worth analysing.

  function csvCell(v) {
    var t = v == null ? '' : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  /** The sponsor acronym is the one thing that leaks identity out of an
   *  otherwise useful label: "QTE NTA20260826 Pan-cancer - blood" and
   *  "NTA: 500 healthies - blood" both name Natera to anyone with the key.
   *  Strip the acronym, keep the description, which is the analysable half. */
  function stripAcronym(text, acronym) {
    var t = String(text || '');
    var ac = String(acronym || '').trim();
    if (ac) {
      t = t.replace(new RegExp('\\b' + ac + '\\b', 'gi'), '');
    }
    return t.replace(/^\s*QTE\s*/i, '')
            .replace(/^[\s:–—-]+/, '')
            .replace(/\s{2,}/g, ' ')
            .trim();
  }

  function analysisRows(list, opts) {
    opts = opts || {};
    // Stable codes, assigned in first-seen order over a sorted key so the same
    // register always produces the same codes.
    var sponsors = {}, studies = {}, sN = 0, tN = 0;
    function sponsorCode(name) {
      var k = String(name || '').trim().toLowerCase() || '(none)';
      if (!sponsors[k]) sponsors[k] = 'S' + String(++sN).padStart(2, '0');
      return sponsors[k];
    }
    function studyCode(q) {
      // Keyed on sponsor as well as MT number. MT9920 is one number across 43
      // sponsors, so keying on the number alone would merge unrelated studies
      // into one code and quietly corrupt any grouping done downstream.
      var mt = String(q.mtNumber || (q.header || {}).parentMtNumber || q.id).toUpperCase();
      var k = String(q.client || '').trim().toLowerCase() + '|' + mt;
      if (!studies[k]) studies[k] = 'ST' + String(++tN).padStart(3, '0');
      return studies[k];
    }

    var sorted = (list || []).slice().sort(function (a, b) {
      return String(a.quoteDate).localeCompare(String(b.quoteDate));
    });

    return sorted.map(function (q) {
      var h = q.header || {}, pr = q.pricing || {}, sh = q.shipping || {};
      var cohorts = q.cohorts || [];
      var specimens = orderedSpecimens(q);
      var detail = q.specimenDetail || {};
      var tpNames = timepointNamesFor(q);
      var ac = q.sponsorAcronym;

      var subjects = cohorts.reduce(function (t, c) {
        if (c.subcohorts && c.subcohorts.length) {
          return t + c.subcohorts.reduce(function (u, sc) {
            return u + num(q.isExtension ? sc.additionalSubjects : sc.subjects); }, 0);
        }
        return t + num(q.isExtension ? c.additionalSubjects : c.subjects);
      }, 0);

      var prices = specimens.map(function (t) {
        return num((pr.specimenPrices || {})[t] && pr.specimenPrices[t].price);
      }).filter(function (n) { return n > 0; });

      var legCost = (sh.legs || []).reduce(function (t, leg) {
        return t + num(leg.count) * num(String(leg.rate || '').trim() !== '' ? leg.rate
          : (leg.intl ? sh.intlRate : sh.usRate)); }, 0);

      function join(list) { return list.filter(Boolean).join(' | ').replace(/\s*\n\s*/g, ' / '); }

      var row = {
        document_type: q.isFeasibility ? 'feasibility' : 'quote',
        study_code: studyCode(q),
        sponsor_code: sponsorCode(q.client),
        mt_number: q.mtNumber || h.parentMtNumber || '',
        po_number: h.originalStudyPo || '',
        study_label: stripAcronym(q.quoteName, ac),
        deal_label: stripAcronym(q.hubspotDealName, ac),
        quote_date: q.quoteDate || '',
        status: q.status || '',
        validity: h.validity || '',
        is_extension: q.isExtension ? 'yes' : 'no',
        extension_number: q.isExtension ? (h.extensionNumber || '') : '',
        design_changed: q.isExtension ? (h.designChanged === false ? 'no' : 'yes') : '',
        service_type: (h.serviceTypes || []).join('; '),
        sponsor_selected_cases: h.sponsorSelected ? 'yes' : 'no',
        cohort_count: cohorts.length,
        subcohort_count: cohorts.reduce(function (t, c) {
          return t + ((c.subcohorts || []).length); }, 0),
        cohort_descriptions: cohorts.map(function (c) { return c.name; }).filter(Boolean).join(' | '),
        subject_count: subjects || '',
        units: cohorts.map(function (c) { return c.units; }).filter(Boolean).join(' | '),
        specimen_types: specimens.join('; '),
        specimen_type_count: specimens.length,
        timepoint_count: tpNames.length,
        timepoints: tpNames.join(' | '),
        max_collections_per_subject: specimens.reduce(function (m, t) {
          return Math.max(m, collectionCount(detail[t], tpNames)); }, 1),
        price_per_collection_min: prices.length ? Math.min.apply(null, prices) : '',
        price_per_collection_max: prices.length ? Math.max.apply(null, prices) : '',
        screenfail_rate: (pr.screenfail || {}).enabled ? (pr.screenfail.rate || '') : '',
        shipping_legs: (sh.legs || []).length,
        shipping_destinations: (sh.legs || []).map(function (l) {
          return l.dest; }).filter(Boolean).join(' | '),
        shipping_internal_cost: legCost || '',
        shipping_markup: sh.markup || '',
        shipping_quoted_as: sh.mode === 'perSubject' ? 'per subject' : 'lump sum',
        us_destination_stated: sh.usDestination ? 'yes' : 'no',
        total_cost: num(q.totalCost) || ''
      };

      // Free text is where a human may have typed a name we cannot predict, so
      // it travels only when the export is set to include it.
      if (opts.freeText) {
        row.inclusion_criteria = join(cohorts.map(function (c) { return c.inclusion; }));
        row.exclusion_criteria = join(cohorts.map(function (c) { return c.exclusion; }));
        row.processing_requirements = join(specimens.map(function (t) {
          return (detail[t] || {}).processing; }));
        row.pricing_notes = join(specimens.map(function (t) {
          return ((pr.specimenPrices || {})[t] || {}).notes; }));
        row.study_summary = stripAcronym(q.summary, ac);
        row.additional_notes = stripAcronym(q.notes, ac);
      }
      return row;
    });
  }

  /** Timepoint names for an arbitrary quote, not just the one being edited. */
  function timepointNamesFor(q) {
    if (q.multipleTimepoints !== true) return [];
    return (q.timepoints || []).map(function (t, i) {
      return String(t.label || '').trim() || ('Timepoint ' + (i + 1));
    });
  }

  function analysisCsv(list, opts) {
    var rows = analysisRows(list, opts);
    if (!rows.length) return '';
    var cols = Object.keys(rows[0]);
    return [cols.join(',')].concat(rows.map(function (r) {
      return cols.map(function (c) { return csvCell(r[c]); }).join(',');
    })).join('\n');
  }

  function footRow() {
    var total = quotes.reduce(function (sum, q) { return sum + num(q.totalCost); }, 0);
    return el('div', { class: 'table-foot' }, [
      el('span', { text: quotes.length + (quotes.length === 1 ? ' quote' : ' quotes') +
        (quotes.length ? ' · ' + money(total) + ' quoted' : '') }),
      el('button', {
        class: 'link-btn', type: 'button',
        onclick: function () {
          if (!confirm('Reset the mockup back to its sample quotes? Any quotes '
                       + 'you have created will be discarded.')) return;
          resetSamples(); go('register'); toast('Sample quotes restored');
        }
      }, ['Reset sample data'])
    ]);
  }

  function exportPanel() {
    var box = el('div', { class: 'export' });
    var body = el('div');
    var open = false;

    var freeText = true;

    function paint() {
      body.replaceChildren();
      if (!open) return;

      var opts = { freeText: freeText };
      var csv = analysisCsv(quotes, opts);
      var rows = analysisRows(quotes, opts);

      body.appendChild(el('p', { class: 'export-note', text:
        'Three things are held back: the company name, the contact name and '
        + 'the contact email. Each sponsor becomes a stable code (S01) so '
        + 'patterns by sponsor still read. Everything else goes — MT and PO '
        + 'numbers, study and deal labels, dates, study design, destinations '
        + 'and every figure.' }));

      body.appendChild(el('p', { class: 'export-note', text:
        'The sponsor acronym is stripped out of the study and deal labels, '
        + 'because "QTE NTA20260826 Pan-cancer - blood" names Natera to anyone '
        + 'holding the key. The description survives; the initials do not.' }));

      var ftInput = el('input', { type: 'checkbox', onchange: function () {
        freeText = ftInput.checked; paint();
      } });
      ftInput.checked = freeText;
      body.appendChild(el('label', { class: 'check' }, [ftInput,
        el('span', { text: 'Include free text \u2014 criteria, processing, '
          + 'pricing notes, summary' })]));
      body.appendChild(el('p', { class: 'export-note', text: freeText
        ? 'Free text is in. Worth a skim before sending: a rep may have typed a '
          + 'company or a person into a notes box, and no rule can catch that.'
        : 'Free text is out. Numbers, dates and structure only.' }));

      var ta = el('textarea', { class: 'export-csv', rows: 10, readonly: 'readonly',
        'aria-label': 'Register extract, comma separated' });
      ta.value = csv || 'No quotes to export yet.';
      body.appendChild(ta);

      var actions = el('div', { class: 'export-actions' });
      actions.appendChild(el('button', { class: 'btn', type: 'button', onclick: function () {
        ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (e) { done = false; }
        toast(done ? 'Copied — paste it into Claude' : 'Press Ctrl+C to copy');
      } }, ['Copy']));

      // A download works in the real app and when this file is opened locally.
      // Inside the published preview the sandbox blocks it, which is why the
      // text above it is the thing that always works.
      actions.appendChild(el('button', { class: 'link-btn', type: 'button', onclick: function () {
        try {
          var a = el('a', {
            href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })),
            download: 'mtg-register-extract.csv' });
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) {
          toast('Download blocked here — copy the text instead');
        }
      } }, ['Download .csv']));
      body.appendChild(actions);

      body.appendChild(el('p', { class: 'export-note', text:
        rows.length + (rows.length === 1 ? ' row' : ' rows') + ', one per document. '
        + 'Feasibilities will appear here alongside quotes once that builder '
        + 'exists — the document_type column is already there.' }));
    }

    box.appendChild(el('button', { class: 'link-btn', type: 'button', onclick: function () {
      open = !open; paint();
    } }, ['Export for analysis']));
    box.appendChild(body);
    return box;
  }

  // ---------------------------------------------------------------- form

  function blank() {
    return {
      id: null, client: '', sponsorAcronym: '', quoteName: '', preparedBy: CURRENT_REP,
      quoteDate: new Date().toISOString().slice(0, 10), status: 'draft', totalCost: '',
      specimenTypes: [], isExtension: false, hubspotDealName: '',
      cohorts: [{ name: '', subjects: '' }], notes: '', summary: '',
      nameEdited: false, summaryEdited: false,
      header: { validity: VALIDITY[0], serviceTypes: [] }
    };
  }

  function renderForm(id) {
    var existing = id ? quotes.filter(function (q) { return q.id === id; })[0] : null;
    var draft = existing ? JSON.parse(JSON.stringify(existing)) : blank();
    draft.header = draft.header || {};
    draft.header.serviceTypes = draft.header.serviceTypes || [];
    draft.specimenTypes = draft.specimenTypes || [];
    draft.cohorts = draft.cohorts || [];
    if (existing) { draft.nameEdited = true; draft.summaryEdited = true; }

    var frag = document.createDocumentFragment();
    var wrap = el('div', { class: 'form-wrap' });
    frag.appendChild(wrap);

    wrap.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { go('register'); } },
      ['← Quote register']));

    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: existing ? (existing.quoteName || 'Quote') : 'New quote' }),
        el('p', { class: 'sub', text: existing
          ? 'Change anything and save. Deleting cannot be undone.'
          : 'Fill in what you know — you can save a draft and come back.' })
      ])
    ]));

    wrap.appendChild(el('p', { class: 'needed-key' }, [
      el('span', { class: 'req', text: '*' }),
      el('span', { text: 'Needed before the quote can be created. Everything else '
        + 'can wait — a draft saves either way.' })
    ]));

    var errorBox = el('div');
    wrap.appendChild(errorBox);

    // Quote name and quote number are the same thing — there is only one, and it
    // lives at the very end of the form. Nothing to refresh separately.
    function refreshNumber() {}

    // ---- field helper -------------------------------------------------
    var idc = 0;
    function field(label, opts) {
      opts = opts || {};
      var fid = 'f' + (++idc);
      var input;

      if (opts.type === 'select') {
        input = el('select', { id: fid, onchange: function () { opts.set(input.value); after(); } });
        opts.options.forEach(function (o) {
          var v = typeof o === 'string' ? o : o.value;
          var l = typeof o === 'string' ? o : o.label;
          input.appendChild(el('option', { value: v, text: l }));
        });
        input.value = opts.get();
      } else if (opts.type === 'textarea') {
        input = el('textarea', { id: fid, rows: opts.rows || 3, placeholder: opts.placeholder || '',
          oninput: function () { opts.set(input.value); after(); } });
        input.value = opts.get() || '';
      } else {
        input = el('input', { id: fid, type: opts.type || 'text', placeholder: opts.placeholder || '',
          inputmode: opts.inputmode || false,
          oninput: function () { opts.set(input.value); after(); },
          onblur: opts.onblur || null });
        input.value = opts.get() || '';
      }

      function after() { refreshNumber(); if (opts.then) opts.then(); }

      var lbl = el('label', { for: fid }, [label]);
      if (opts.required) lbl.appendChild(el('span', { class: 'req', text: ' *' }));
      if (opts.autofilled) lbl.appendChild(el('span', { class: 'autofilled', text: 'auto' }));

      var kids = [lbl, input];
      var hintEl = opts.hint ? el('div', { class: 'hint', text: opts.hint }) : null;
      if (hintEl) kids.push(hintEl);
      var box = el('div', { class: 'fld' + (opts.full ? ' full' : '')
                                 + (opts.required ? ' req-fld' : '') }, kids);
      box._input = input;
      box._hint = hintEl;

      // A required field says so while it is empty and stops once it is filled,
      // rather than shouting at a rep who has already answered it.
      if (opts.required) {
        var mark = function () {
          box.classList.toggle('is-empty', !String(input.value || '').trim());
        };
        input.addEventListener('input', mark);
        input.addEventListener('change', mark);
        mark();
      }
      return box;
    }

    function checkbox(label, get, set, onToggle) {
      var box = el('input', { type: 'checkbox', onchange: function () {
        set(box.checked); if (onToggle) onToggle();
      } });
      box.checked = !!get();
      return el('label', { class: 'check' }, [box, el('span', {}, [label])]);
    }

    // ---- section 01 ---------------------------------------------------
    var sec01 = el('section', { class: 'sec' });
    sec01.appendChild(secHead('01', 'Quote header'));

    var extBox = el('div');

    function applyStudy(study, via) {
      draft.client = study.client;
      draft.sponsorAcronym = study.acronym;
      // Deliberately not carried over — this quote is being written by whoever
      // is signed in now, not by the original study's author.
      draft.specimenTypes = (study.specimens || []).slice();
      draft.header.parentMtNumber = study.mt;
      draft.header.originalStudyQuote = draft.header.originalStudyQuote || study.quote;
      draft.header.originalStudyPo = draft.header.originalStudyPo || study.po;
      draft.header.sponsorContactName = study.contactName || '';
      draft.header.sponsorContactEmail = study.contactEmail || '';
      draft.header.perSubject = draft.header.perSubject || study.perSubject;
      draft.hubspotDealName = draft.hubspotDealName || study.dealName || '';
      draft.cohorts = (study.cohorts || []).map(function (c) {
        return { name: c.name, subjects: c.subjects, additionalSubjects: '' };
      });
      draft.header.matchedVia = via;
      draft.header.matchedStudy = study.quote || study.dealName;
      draft.header.fromHubspot = !!study.fromHubspot;

      // Extension number continues this sponsor's own thread, never the
      // umbrella's — MT9920 alone carries 37 separate threads.
      var next = 1;
      quotes.forEach(function (q) {
        if (!q.isExtension) return;
        var h = q.header || {};
        if (h.parentMtNumber === study.mt && q.client === study.client) {
          var n = parseInt(h.extensionNumber, 10);
          if (!isNaN(n) && n >= next) next = n + 1;
        }
      });
      // A HubSpot hit knows how many extensions already carry this number, and
      // the register does not — nothing in this tool quoted them.
      if (study.fromHubspot && study.priorExtensions >= next) next = study.priorExtensions + 1;
      draft.header.extensionNumber = draft.header.extensionNumber || String(next);
    }

    // Waiting for blur meant a rep who typed all three fields and stopped saw
    // nothing happen. Run shortly after typing stops instead.
    var lookupTimer = null;
    function queueLookup() {
      clearTimeout(lookupTimer);
      lookupTimer = setTimeout(runLookup, 400);
    }

    function runLookup() {
      // The typed quote reference is tried first — it is the most specific thing
      // the rep has, and it is what they actually have to hand.
      var byRef = findStudyByQuoteRef(draft.header.originalStudyQuote, quotes);
      if (byRef) {
        if (byRef.quote) { applyParentQuote(byRef.quote, byRef.via); afterLookup(); return; }
        if (byRef.study) { applyStudy(byRef.study, byRef.via); draft.header.ambiguous = null; afterLookup(); return; }
        if (byRef.acronymOnly) {
          // Only the sponsor is recoverable — fill that and leave the rest alone.
          draft.client = draft.client || byRef.client;
          draft.sponsorAcronym = draft.sponsorAcronym || byRef.acronymOnly;
          draft.header.matchedVia = byRef.via + ' (sponsor only)';
          draft.header.matchedStudy = null;
          draft.header.ambiguous = null;
          draft.header.sponsorOnly = byRef.client;
          renderLookupResult(); renderBody(); refreshNumber();
          return;
        }
      }
      draft.header.sponsorOnly = null;

      var hit = findStudy(draft.header.originalStudyPo, draft.header.parentMtNumber);
      if (hit && hit.registerQuote) { applyParentQuote(hit.registerQuote, hit.via); afterLookup(); return; }
      if (hit && hit.study) {
        applyStudy(hit.study, hit.via);
        draft.header.ambiguous = null;
        if (extFields) {
          extFields.mt._input.value = draft.header.parentMtNumber || '';
          extFields.extNo._input.value = draft.header.extensionNumber || '';
          extFields.quote._input.value = draft.header.originalStudyQuote || '';
          extFields.po._input.value = draft.header.originalStudyPo || '';
        }
      } else {
        draft.header.matchedVia = null;
        draft.header.matchedStudy = null;
        draft.header.ambiguous = (hit && hit.ambiguous) ? hit : null;
        draft.header.umbrella = (hit && hit.umbrella) ? hit : null;
      }
      afterLookup();
    }

    function afterLookup() {
      if (extFields) {
        extFields.mt._input.value = draft.header.parentMtNumber || '';
        extFields.extNo._input.value = draft.header.extensionNumber || '';
        extFields.po._input.value = draft.header.originalStudyPo || '';
      }
      renderLookupResult();
      renderBody();
      refreshNumber();
    }

    /** A parent already in the register carries everything we need. */
    function applyParentQuote(q, via) {
      applyStudy({
        client: q.client, acronym: q.sponsorAcronym, preparedBy: q.preparedBy,
        specimens: q.specimenTypes || [], mt: q.mtNumber || (q.header || {}).parentMtNumber || '',
        quote: q.quoteNumber, po: (q.header || {}).originalStudyPo || '',
        contactName: (q.header || {}).sponsorContactName || '',
        contactEmail: (q.header || {}).sponsorContactEmail || '',
        perSubject: parentPerSubject(q),
        dealName: q.hubspotDealName || '',
        cohorts: q.cohorts || []
      }, via);
      draft.header.ambiguous = null;
    }

    // The extension fields are built once and kept. A lookup updates their
    // values and swaps only the result banner — rebuilding the whole block on
    // blur destroyed the input the rep was typing into, which lost keystrokes
    // and left stale results on screen.
    var extFields = null;
    var lookupBox = el('div');

    function buildExtFields() {
      var quoteFld = field('Original study quote', { full: true,
        placeholder: 'QTE NTA20260826 Pan-cancer - blood',
        hint: 'Any one of these three finds the study.',
        get: function () { return draft.header.originalStudyQuote; },
        set: function (v) { draft.header.originalStudyQuote = v; },
        then: queueLookup, onblur: runLookup });

      var poFld = field('Original study PO #', {
        placeholder: 'PO-88214',
        get: function () { return draft.header.originalStudyPo; },
        set: function (v) { draft.header.originalStudyPo = v; },
        then: queueLookup, onblur: runLookup });

      var mtFld = field('Parent MT number', { placeholder: 'MT2291',
        get: function () { return draft.header.parentMtNumber; },
        set: function (v) { draft.header.parentMtNumber = v.toUpperCase(); },
        then: queueLookup, onblur: runLookup });

      var extNoFld = field('Extension #', { placeholder: '1',
        get: function () { return draft.header.extensionNumber; },
        set: function (v) { draft.header.extensionNumber = v; } });

      var changed = checkbox('The study design has changed',
        function () { return draft.header.designChanged !== false; },
        function (v) { draft.header.designChanged = v; },
        function () { renderBody(); renderHelp(); });
      changed.style.marginTop = '15px';

      var help = el('div', { class: 'hint' });
      function renderHelp() {
        help.textContent = draft.header.designChanged === false
          ? 'Design unchanged — the form collapses to what actually differs, and the quote generates in the short extension format.'
          : 'Uncheck this when the study design is unchanged and only the subject count grows.';
      }
      renderHelp();

      extFields = {
        quote: quoteFld, po: poFld, mt: mtFld, extNo: extNoFld,
        box: el('div', { class: 'toggle-box' }, [
          el('div', { class: 'grid' }, [quoteFld, poFld, mtFld, extNoFld]),
          changed, help
        ])
      };
    }

    function renderExtBox() {
      extBox.replaceChildren();
      if (!draft.isExtension) { extFields = null; return; }
      if (!extFields) buildExtFields();
      extBox.appendChild(extFields.box);
      extBox.appendChild(lookupBox);
      renderLookupResult();
    }

    function renderLookupResult() {
      lookupBox.replaceChildren();

      if (draft.header.matchedStudy) {
        lookupBox.appendChild(el('div', { class: 'carried' }, [
          el('div', { class: 'carried-head' }, [
            'Found via ' + draft.header.matchedVia,
            el('span', { class: 'autofilled', text: 'auto-filled' })
          ]),
          el('dl', { class: 'carried-list' }, [
            el('dt', { text: 'Study' }), el('dd', { text: draft.header.matchedStudy }),
            el('dt', { text: 'Client' }), el('dd', { text: draft.client || '—' }),
            el('dt', { text: 'Specimens' }),
            el('dd', { text: (draft.specimenTypes || []).join(', ') || '—' })
          ]),
          el('div', { class: 'hint', text: draft.header.fromHubspot
            ? 'From the HubSpot deal, which holds the sponsor and the deal name and '
              + 'nothing else — cohorts, specimens and pricing are not stored there, so '
              + 'those are yours to fill in.'
            : 'Everything it filled in stays editable below.' })
        ]));
        return;
      }

      var u = draft.header.umbrella;
      if (u) {
        lookupBox.appendChild(el('div', { class: 'lookup-idle' }, [
          el('strong', { text: u.umbrella + ' is an umbrella number. ' }),
          el('span', { text: 'It covers ' + u.count + ' deals in HubSpot, so it cannot '
            + 'identify one study. Enter the original quote reference or the PO number '
            + 'instead, or fill the details in by hand.' })
        ]));
        return;
      }

      var a = draft.header.ambiguous;
      if (a) {
        lookupBox.appendChild(el('div', { class: 'lookup-idle' }, [
          el('strong', { text: a.mt + ' matches ' + a.ambiguous + ' studies. ' }),
          el('span', { text: 'That number is shared across sponsors, so it cannot identify one study on its own — add the PO number, or fill the details in by hand.' })
        ]));
      } else if (draft.header.originalStudyPo || draft.header.parentMtNumber) {
        lookupBox.appendChild(el('div', { class: 'lookup-idle' }, [
          el('span', { text: 'No match for that PO or MT number. Fill the details in by hand — nothing below is blocked.' })
        ]));

          el('span', { text: 'Enter the PO number or the parent MT number and the study details fill themselves in.' })

    var extCheck = checkbox('This is a study extension',
      function () { return draft.isExtension; },

      },
      function () { renderExtBox(); renderBody(); });
    extCheck.style.marginBottom = '15px';
    sec01.appendChild(extCheck);
    sec01.appendChild(extBox);

    var headerBody = el('div');
    sec01.appendChild(headerBody);
    wrap.appendChild(sec01);

    function renderBody() {
      headerBody.replaceChildren();

      if (isMinimal()) renderMinimalHeader(); else renderFullHeader();

      if (isMinimal()) {

      } else {
        restBox.appendChild(sectionApproach());
        restBox.appendChild(sectionPopulation());
        restBox.appendChild(sectionTimepoints());
        restBox.appendChild(sectionSpecimens());
        restBox.appendChild(sectionClinicalData());

        restBox.appendChild(sectionTimeline());
      }

      restBox.appendChild(sectionPricing());

    // ---- header variants ---------------------------------------------

    /** Fills the sponsor contact from the HubSpot deal a rep has just named.
     *  Only ever fills blanks: a rep who has typed a contact keeps it. */
    function lookupByDealName() {
      var hit = findStudyByDealName(draft.hubspotDealName);
      if (!hit || !hdrFields) return;
      var st = hit.study;

      // Fill the inputs in place. Rebuilding the form here would take the focus
      // out of the field the rep is still typing into, and swallow the rest of
      // what they type — the same trap the extension lookup hit in §9.
      function fill(fld, current, value, assign) {
        if (String(current || '').trim() || !value) return;
        assign(value);
        if (fld && fld._input && document.activeElement !== fld._input) {
          fld._input.value = value;
        }
      }
      fill(hdrFields.client, draft.client, st.client, function (v) { draft.client = v; });
      fill(hdrFields.acronym, draft.sponsorAcronym, st.acronym,
           function (v) { draft.sponsorAcronym = v; });
      fill(hdrFields.contact, draft.header.sponsorContactName, st.contactName,
           function (v) { draft.header.sponsorContactName = v; });
      fill(hdrFields.email, draft.header.sponsorContactEmail, st.contactEmail,
           function (v) { draft.header.sponsorContactEmail = v; });
      refreshNumber();
      if (shippingRefresh) shippingRefresh();
    }

    function sponsorFields() {
      var acronymFld, emailFld;

      var clientFld = field('Client / sponsor', { required: true, placeholder: 'Natera',
        get: function () { return draft.client; },
        set: function (v) { draft.client = v; },
        then: function () {
          var a = acronymFor(draft.client);
          if (a && !draft.header.acronymEdited) {
            draft.sponsorAcronym = a;
            acronymFld._input.value = a;
          }
          // The sponsor's name appears in §10's prompt and in the US-destination
          // sentence, so both follow it as it is typed.
          if (shippingRefresh) shippingRefresh();
        } });

      acronymFld = field('Sponsor acronym', { placeholder: 'NTA', autofilled: true,
        get: function () { return draft.sponsorAcronym; },
        set: function (v) {
          draft.sponsorAcronym = v.toUpperCase();
          draft.header.acronymEdited = true;
        } });

      var contactFld = field('Sponsor contact name', {
        get: function () { return draft.header.sponsorContactName; },
        set: function (v) { draft.header.sponsorContactName = v; },
        then: function () {
          var e = emailFor(draft.header.sponsorContactName, draft.client);
          if (e && !draft.header.emailEdited) {
            draft.header.sponsorContactEmail = e;
            emailFld._input.value = e;
          }
        } });

      emailFld = field('Sponsor contact email', { type: 'email', autofilled: true,
        get: function () { return draft.header.sponsorContactEmail; },
        set: function (v) {
          draft.header.sponsorContactEmail = v;
          draft.header.emailEdited = true;
        } });

      hdrFields = { client: clientFld, acronym: acronymFld,
                    contact: contactFld, email: emailFld };
      return hdrFields;
    }

    function dealNameField(placeholder) {
      return field('HubSpot deal name', { full: true, placeholder: placeholder,
        hint: 'Start here — the sponsor and their contact fill in from the deal.',
        get: function () { return draft.hubspotDealName; },
        set: function (v) { draft.hubspotDealName = v; },
        then: queueDealLookup, onblur: lookupByDealName });
    }

    function renderFullHeader() {
      var f = sponsorFields();
      headerBody.appendChild(el('div', { class: 'grid' }, [
        dealNameField('NTA: 500 healthies - blood'),
        f.client, f.acronym,
        f.contact, f.email,
        field('Quote date', { type: 'date', required: true, autofilled: true,
          get: function () { return draft.quoteDate; }, set: function (v) { draft.quoteDate = v; } }),
        field('Validity', { type: 'select', options: VALIDITY,
          get: function () { return draft.header.validity || VALIDITY[0]; },
          set: function (v) { draft.header.validity = v; } })
      ]));

      var svc = el('fieldset', {}, [el('legend', { text: 'Service type' })]);
      svc.appendChild(el('div', { class: 'check-row' }, SERVICE_TYPES.map(function (t) {
        return checkbox(t,
          function () { return draft.header.serviceTypes.indexOf(t) > -1; },
          function (on) {
            var i = draft.header.serviceTypes.indexOf(t);
            if (on && i === -1) draft.header.serviceTypes.push(t);
            if (!on && i > -1) draft.header.serviceTypes.splice(i, 1);
          }, function () { if (casesRefresh) casesRefresh(); });
      })));
      headerBody.appendChild(svc);
    }

    function renderMinimalHeader() {
      var f = sponsorFields();
      headerBody.appendChild(el('div', { class: 'grid' }, [
        dealNameField('NTA: Multi-cancer - blood (MT2291 extension #1)'),
        f.client, f.acronym,
        field('Validity', { type: 'select', options: VALIDITY,
          get: function () { return draft.header.validity || VALIDITY[0]; },
          set: function (v) { draft.header.validity = v; } }),

        field('Quote date', { type: 'date', required: true, autofilled: true,
          get: function () { return draft.quoteDate; }, set: function (v) { draft.quoteDate = v; } })
      ]));

    // ---- 03 cohorts ---------------------------------------------------

    // Extension-only. Just the cohort and how many subjects are being added —
    // the already-quoted and new-total columns read as confusing rather than
    // helpful, so they are gone.
    function sectionExtensionCohorts() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('03', 'Additional subjects'));

      draft.cohorts = draft.cohorts || [];
      var rows = el('div', { class: 'cohorts' });
      var totalEl = el('span', { class: 'ca strong' });

      function recompute() {
        totalEl.textContent = String(draft.cohorts.reduce(function (s, c) {
          return s + extAdditional(c); }, 0));
        if (pricingRefresh) pricingRefresh();
      }

      function paint() {
        rows.replaceChildren();
        rows.appendChild(el('div', { class: 'cohort-row full cohort-head' }, [
          el('span', { text: 'Cohort' }),
          el('span', { class: 'ca', text: 'Additional subjects' }),
          el('span', {})]));

        draft.cohorts.forEach(function (c, i) {
          var nameIn = el('input', { type: 'text',
            'aria-label': 'Cohort ' + (i + 1) + ' name',
            placeholder: 'Colorectal cancer',
            oninput: function () {
              draft.cohorts[i].name = cleanCohortName(nameIn.value);
              if (pricingRefresh) pricingRefresh();
              refreshDrafts();
            },
            onblur: function () { nameIn.value = draft.cohorts[i].name || ''; } });
          nameIn.value = c.name || '';

          c.subcohorts = c.subcohorts || [];
          var hasSub = c.subcohorts.length > 0;

          var addIn = el('input', { type: 'text', inputmode: 'numeric',
            placeholder: '0',
            'aria-label': 'Additional subjects for ' + (c.name || 'cohort ' + (i + 1)),
            oninput: function () { draft.cohorts[i].additionalSubjects = addIn.value; recompute(); } });
          addIn.disabled = hasSub;
          addIn.value = hasSub ? String(extAdditional(c))
                               : (c.additionalSubjects == null ? '' : String(c.additionalSubjects));

          var x = el('button', { class: 'row-x', type: 'button',
            'aria-label': 'Remove ' + (c.name || 'cohort ' + (i + 1)),
            onclick: function () { draft.cohorts.splice(i, 1); paint(); recompute(); } }, ['×']);

          rows.appendChild(el('div', { class: 'cohort-row full' },
            [nameIn, el('span', { class: 'ca' }, [addIn]), x]));

          // Subcohorts split a cohort's extra subjects. The full quote has had
          // them since the third review; the extension track had not, so a rep
          // extending a study with subcohorts had nowhere to put them.
          c.subcohorts.forEach(function (sc, j) {
            var label = (i + 1) + String.fromCharCode(97 + j);
            var noteIn = el('input', { type: 'text',
              'aria-label': 'Subcohort ' + label + ' description',
              placeholder: 'What distinguishes this subcohort',
              oninput: function () { sc.note = noteIn.value; } });
            noteIn.value = sc.note || '';
            var nIn = el('input', { type: 'text', inputmode: 'numeric', placeholder: '0',
              'aria-label': 'Additional subjects for subcohort ' + label,
              oninput: function () { sc.additionalSubjects = nIn.value; paint(); } });
            nIn.value = sc.additionalSubjects == null ? '' : String(sc.additionalSubjects);
            var sx = el('button', { class: 'row-x', type: 'button',
              'aria-label': 'Remove subcohort ' + label,
              onclick: function () { c.subcohorts.splice(j, 1); paint(); } }, ['×']);
            rows.appendChild(el('div', { class: 'cohort-row sub-ext' }, [
              el('span', { class: 'sub-label', text: label }), noteIn,
              el('span', { class: 'ca' }, [nIn]), sx]));
            rows.appendChild(subcohortCriteria(sc, label));
          });

          rows.appendChild(el('div', { class: 'cohort-row sub-add' }, [
            el('button', { class: 'add-row', type: 'button', onclick: function () {
              c.subcohorts.push({ note: '', additionalSubjects: '' }); paint();
            } }, ['+ Add subcohort'])
          ]));
        });

        rows.appendChild(el('div', { class: 'cohort-row full cohort-total' }, [
          el('span', { text: 'Total additional subjects' }), totalEl, el('span', {})]));
        recompute();
      }
      paint();
      sec.appendChild(rows);
      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.cohorts.push({ name: '', additionalSubjects: '', subcohorts: [] }); paint();
      } }, ['+ Add cohort']));
      sec.appendChild(el('div', { class: 'hint',
        text: 'Filled from the original study when the lookup finds it — otherwise type them in. Just the description; the numbering is added for you.' }));
      return sec;
    }

    // Declared up here because §03 and §05 call it as their values change.
    var dealTimer = null;

      clearTimeout(dealTimer);
      dealTimer = setTimeout(lookupByDealName, 400);

    var hdrFields = null;
    var casesRefresh = null;

    // ---- 02 quote approach ---------------------------------------------

    function sectionApproach() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('02', 'Quote approach'));

      var body = el('div');
      function paint() {
        body.replaceChildren();
        var byDollar = draft.approach === 'dollar';

        var radios = el('div', { class: 'check-row' }, [
          radio('approach', 'Defined subject count', !byDollar, function () {
            draft.approach = 'subjects'; paint(); }),
          radio('approach', 'Defined dollar amount', byDollar, function () {
            draft.approach = 'dollar'; paint(); })
        ]);
        body.appendChild(radios);
        if (!byDollar) {
          body.appendChild(el('div', { class: 'hint',
            text: 'Subject counts come from the cohorts below.' }));
          return;
        }

        draft.caseTypes = draft.caseTypes || [{ label: '', price: '' }];
        body.appendChild(el('div', { class: 'grid' }, [
          field('PO total', { placeholder: '500000.00', inputmode: 'decimal',

        ]));

        var rows = el('div', { class: 'cohorts' });
        var estimate = el('div', { class: 'calc' });

        function recalcEstimate() {
          var po = num(draft.poTotal);
          var highest = draft.caseTypes.reduce(function (m, c) {
            return Math.max(m, num(c.price)); }, 0);
          estimate.replaceChildren();
          estimate.appendChild(el('div', { class: 'calc-row' }, [
            el('span', { text: 'PO total' }),
            el('span', { class: 'v', text: money(po) })]));
          estimate.appendChild(el('div', { class: 'calc-row' }, [
            el('span', { text: 'Highest case price' }),
            el('span', { class: 'v', text: highest ? money(highest) : '—' })]));
          estimate.appendChild(el('div', { class: 'calc-row calc-total' }, [
            el('span', { text: 'Estimated subjects' }),
            el('span', { class: 'v', text: highest ? String(Math.floor(po / highest)) : '—' })]));
        }

        function paintRows() {
          rows.replaceChildren();
          rows.appendChild(el('div', { class: 'cohort-row full cohort-head' }, [
            el('span', { text: 'Tumor / case type' }),
            el('span', { class: 'ca', text: '$ per case' }), el('span', {})]));
          draft.caseTypes.forEach(function (c, i) {
            var lab = el('input', { type: 'text', value: c.label || '',
              'aria-label': 'Case type ' + (i + 1),
              placeholder: 'e.g. NSCLC resection',
              oninput: function () { draft.caseTypes[i].label = lab.value; } });
            lab.value = c.label || '';
            var pr = el('input', { type: 'text', inputmode: 'decimal',
              'aria-label': 'Price per case for ' + (c.label || 'case type ' + (i + 1)),
              oninput: function () { draft.caseTypes[i].price = pr.value; recalcEstimate(); } });
            pr.value = c.price || '';
            var x = el('button', { class: 'row-x', type: 'button',
              'aria-label': 'Remove case type ' + (i + 1),
              onclick: function () { draft.caseTypes.splice(i, 1); paintRows(); recalcEstimate(); } }, ['×']);
            rows.appendChild(el('div', { class: 'cohort-row full' },
              [lab, el('span', { class: 'ca' }, [pr]), x]));
          });
        }
        paintRows();
        body.appendChild(rows);
        body.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
          draft.caseTypes.push({ label: '', price: '' }); paintRows();
        } }, ['+ Add case type']));

        body.appendChild(checkbox('Matched blood add-on',
          function () { return draft.matchedBlood; },
          function (v) { draft.matchedBlood = v; }));

        body.appendChild(estimate);
        recalcEstimate();
        body.appendChild(el('div', { class: 'hint',
          text: 'Estimate uses the highest case price, not an average — the mix is unknown, so this stays conservative. Do not attribute counts to specific types here.' }));
      }
      paint();
      sec.appendChild(body);
      return sec;
    }

    function radio(name, label, checked, onPick) {
      var r = el('input', { type: 'radio', name: name, onchange: function () {
        if (r.checked) onPick();
      } });
      r.checked = checked;
      return el('label', { class: 'check' }, [r, el('span', {}, [label])]);
    }

    // ---- 04 collection timepoints ---------------------------------------

    /** Labelled timepoints, in order. An unlabelled row still counts as a
     *  collection — reps fill the labels in last — so it gets a placeholder
     *  name rather than being dropped. */
    function timepointNames() {
      if (draft.multipleTimepoints !== true) return [];
      return (draft.timepoints || []).map(function (t, i) {

    // ---- 07 clinical data -----------------------------------------------

    function sectionClinicalData() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('07', 'Clinical data'));

      draft.clinicalData = draft.clinicalData || { required: [], ifAvailable: [] };
      var cd = draft.clinicalData;

      // One row per category with three states, rather than the same eight
      // categories listed twice as sixteen checkboxes — which took twice the
      // space and let a rep tick "required" and "if available" at once.
      var grid = el('div', { class: 'data-rows' });
      function inList(list, item) { return list.indexOf(item) > -1; }
      function setState(item, state) {
        [cd.required, cd.ifAvailable].forEach(function (l) {
          var i = l.indexOf(item);
          if (i > -1) l.splice(i, 1);
        });
        if (state === 'required') cd.required.push(item);
        if (state === 'ifAvailable') cd.ifAvailable.push(item);
      }

      function paint() {
        grid.replaceChildren();
        grid.appendChild(el('div', { class: 'data-row head' }, [
          el('span', {}),
          el('span', { text: 'Not needed' }),
          el('span', { text: 'Required' }),
          el('span', { text: 'If available' })
        ]));
        CLINICAL_DATA_CATEGORIES.forEach(function (c, i) {
          var state = inList(cd.required, c) ? 'required'
                    : inList(cd.ifAvailable, c) ? 'ifAvailable' : 'no';
          var row = el('div', { class: 'data-row' }, [el('span', { class: 'lbl', text: c })]);
          [['no', 'Not needed'], ['required', 'Required'], ['ifAvailable', 'If available']]
            .forEach(function (opt) {
              var id = 'cd' + i + opt[0];
              var r = el('input', { type: 'radio', id: id, name: 'cd' + i,
                onchange: function () { setState(c, opt[0]); paint(); } });
              r.checked = state === opt[0];
              row.appendChild(el('label', { class: 'data-opt', for: id }, [
                r, el('span', { class: 'sr', text: c + ' — ' + opt[1] })]));
            });
          grid.appendChild(row);
        });
      }
      paint();
      sec.appendChild(grid);

      if (inList(cd.required, 'Other') || inList(cd.ifAvailable, 'Other')) {
        sec.appendChild(field('Other data — what exactly', { full: true,
          get: function () { return cd.otherDetail; },
          set: function (v) { cd.otherDetail = v; } }));
      }

      if ((draft.cohorts || []).length > 1) {
        sec.appendChild(field('Where this differs by cohort', { type: 'textarea', rows: 2, full: true,
          placeholder: 'e.g. Cohort 1 only: stage, grade, TNM, date of colonoscopy, date of surgery.',
          hint: 'Leave blank when every cohort provides the same data.',
          get: function () { return draft.clinicalData.byCohort; },
          set: function (v) { draft.clinicalData.byCohort = v; } }));
      }

      sec.appendChild(field('Additional data detail', { type: 'textarea', rows: 2, full: true,
        placeholder: 'e.g. EASI score collected on day of biopsy',
        get: function () { return cd.detail; }, set: function (v) { cd.detail = v; } }));

      sec.appendChild(el('div', { class: 'grid' }, [
        field('Delivery method', { type: 'select', options: DELIVERY_METHODS,
          hint: 'EDC entry is real site burden — some sites decline over it, and it gets priced.',
          get: function () { return cd.deliveryMethod || DELIVERY_METHODS[0]; },
          set: function (v) { cd.deliveryMethod = v; } }),
        field('Delivery detail', { placeholder: 'e.g. Example AA data needed_21Jul2026.xls',
          hint: 'Name the format or example file if one exists.',
          get: function () { return cd.deliveryDetail; },
          set: function (v) { cd.deliveryDetail = v; } })
      ]));

      var outBox = el('div');
      function paintOutcome() {
        outBox.replaceChildren();
        if (!cd.outcomeData) return;
        outBox.appendChild(field('Outcome / follow-up description', { type: 'textarea', rows: 2, full: true,
          hint: 'Description lives here; the fee for it lives in §11.',
          get: function () { return cd.outcomeDetail; },
          set: function (v) { cd.outcomeDetail = v; } }));
      }
      var oc = checkbox('Outcome / follow-up data required',
        function () { return cd.outcomeData; },
        function (v) { cd.outcomeData = v; }, paintOutcome);
      oc.style.marginTop = '16px';
      sec.appendChild(oc);
      sec.appendChild(outBox);
      paintOutcome();
      return sec;
    }

    // ---- 08 reports ------------------------------------------------------

    // ---- 09 timeline & logistics ----------------------------------------

    function sectionTimeline() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('09', 'Timeline & logistics'));

      draft.timeline = draft.timeline || {};
      var tl = draft.timeline;

      var kickBox = el('div');
      function paintKick() {
        kickBox.replaceChildren();
        if (!tl.kickoffCall) return;
        kickBox.appendChild(field('Kickoff call trigger', { full: true,
          placeholder: 'What has to happen before the call is scheduled',
          get: function () { return tl.kickoffTrigger; },
          set: function (v) { tl.kickoffTrigger = v; } }));
      }

      sec.appendChild(checkbox('Kickoff call required',

        var canSplit = !isNaN(months) && months >= 3;
