<title>MT Group Quote Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground: #FAFAF8;
    --surface: #FFFFFF;
    --surface-sunk: #F3F4F2;
    --ink: #16211F;
    --ink-soft: #5F6E6B;
    --ink-faint: #8D9995;
    --rule: #E2E6E3;
    --rule-strong: #CBD2CF;
    --accent: #0E5B57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EFEC;

    --st-draft-fg: #5F6E6B;   --st-draft-bg: #ECEEEC;
    --st-review-fg: #8A5606;  --st-review-bg: #FBF0DC;
    --st-sent-fg: #1B4F8C;    --st-sent-bg: #E4EDF8;
    --st-won-fg: #16613B;     --st-won-bg: #E0F0E7;
    --st-lost-fg: #8E3039;    --st-lost-bg: #FAE6E7;

    --danger: #A33A44;
    --danger-bg: #FBEBEC;

    --shadow: 0 1px 2px rgba(22, 33, 31, .05), 0 6px 20px -12px rgba(22, 33, 31, .18);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1312;
      --surface: #151B1A;
      --surface-sunk: #1B2322;
      --ink: #E9EEEC;
      --ink-soft: #97A5A1;
      --ink-faint: #6E7C79;
      --rule: #25302E;
      --rule-strong: #35423F;
      --accent: #57BAAE;
      --accent-ink: #06201E;
      --accent-soft: #14302D;

      --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
      --st-review-fg: #E0B366;  --st-review-bg: #332915;
      --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
      --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
      --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

      --danger: #E0949B;
      --danger-bg: #2A1A1C;

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1312;
    --surface: #151B1A;
    --surface-sunk: #1B2322;
    --ink: #E9EEEC;
    --ink-soft: #97A5A1;
    --ink-faint: #6E7C79;
    --rule: #25302E;
    --rule-strong: #35423F;
    --accent: #57BAAE;
    --accent-ink: #06201E;
    --accent-soft: #14302D;

    --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
    --st-review-fg: #E0B366;  --st-review-bg: #332915;
    --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
    --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
    --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

    --danger: #E0949B;
    --danger-bg: #2A1A1C;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- shell ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }

  .mark {
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.15;
  }

  .brand-org {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .13em;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  .nav { display: flex; gap: 4px; }

  .nav button {
    font: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav button:hover { background: var(--surface-sunk); color: var(--ink); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .banner {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 28px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    border-bottom: 1px solid var(--rule);
  }
  .banner strong { font-weight: 600; }
  .banner span { color: var(--ink-soft); }

  main { padding: 34px 28px 90px; max-width: 1120px; margin: 0 auto; }

  /* ---------- page heading ---------- */

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-soft); font-size: 14px; margin: 5px 0 0; }

  /* ---------- buttons ---------- */

  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }

  .btn-danger {
    border-color: transparent;
    background: none;
    color: var(--danger);
    padding-inline: 6px;
  }
  .btn-danger:hover { background: var(--danger-bg); border-color: transparent; }

  /* ---------- register table ---------- */

  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 11px;
    box-shadow: var(--shadow);
  }

  table { width: 100%; min-width: 860px; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .11em;
    color: var(--ink-faint);
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  th.num { text-align: right; }

  td {
    padding: 15px 18px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-sunk); }

  .q-name {
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  .q-name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .q-number {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 4px;
    word-break: break-word;
  }

  .q-specimens { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  .nowrap { white-space: nowrap; }

  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .chip-draft { background: var(--st-draft-bg); color: var(--st-draft-fg); }
  .chip-internal_reviewed { background: var(--st-review-bg); color: var(--st-review-fg); }
  .chip-sent { background: var(--st-sent-bg); color: var(--st-sent-fg); }
  .chip-won { background: var(--st-won-bg); color: var(--st-won-fg); }
  .chip-lost { background: var(--st-lost-bg); color: var(--st-lost-fg); }

  .tag-ext {
    display: inline-block;
    margin-left: 7px;
    padding: 1px 7px;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .03em;
    vertical-align: 1px;
  }

  .table-foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: 11px;
    padding: 62px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .link-btn {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: inherit;
    color: var(--accent); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---------- form ---------- */

  .form-wrap { max-width: 760px; }

  .back {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: 13.5px;
    color: var(--ink-soft); cursor: pointer;
    margin-bottom: 18px;
  }
  .back:hover { color: var(--accent); }

  .quote-no-preview {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 26px;
  }
  .quote-no-preview .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--ink-faint); display: block; margin-bottom: 4px;
  }
  .quote-no-preview .val {
    font-family: var(--mono); font-size: 13.5px; color: var(--ink);
    word-break: break-word;
  }

  section.sec { margin-bottom: 34px; }

  .sec-head {
    display: flex; align-items: baseline; gap: 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 18px;
  }
  .sec-num {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); font-weight: 500;
  }
  .sec-title { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .sec-note { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

  .sec-pending {
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--rule);
    color: var(--ink-faint);
    font-size: 13.5px;
  }
  .sec-pending .sec-num { color: var(--ink-faint); }
  .sec-pending .phase {
    margin-left: auto; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .grid .full { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; }
  .fld > label {
    font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ink);
  }
  .req { color: var(--danger); }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    font: inherit; font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 62px; }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  ::placeholder { color: var(--ink-faint); opacity: 1; }

  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
  .check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }

  .check-row { display: flex; flex-wrap: wrap; gap: 10px 24px; }

  .specimen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 10px 18px;
  }

  .toggle-box {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 18px;
  }

  fieldset { border: 0; padding: 0; margin: 18px 0 0; }
  legend { font-size: 13px; font-weight: 500; margin-bottom: 8px; padding: 0; }

  /* ---------- partial-section marker ---------- */

  .partial-note {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    background: var(--surface-sunk);
    border-left: 3px solid var(--rule-strong);
    border-radius: 0 7px 7px 0;
    padding: 10px 13px;
    margin-bottom: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .partial-tag {
    flex: none;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 1px 6px;
  }

  /* ---------- lookup / carried-over detail ---------- */

  .carried {
    background: var(--accent-soft);
    border-radius: 9px;
    padding: 15px 17px;
    margin-bottom: 18px;
  }
  .carried-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); font-weight: 600; margin-bottom: 11px;
  }
  .carried-list {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
    margin: 0 0 10px;
  }
  .carried-list dt { font-size: 12.5px; color: var(--ink-soft); }
  .carried-list dd { margin: 0; font-size: 13.5px; }
  .carried .hint { margin-top: 0; }

  .lookup-idle {
    border: 1px dashed var(--rule-strong);
    border-radius: 9px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .autofilled {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 7px;
    vertical-align: 1px;
  }

  /* ---------- cohort rows ---------- */

  .cohorts { display: flex; flex-direction: column; }

  .cohort-row {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-row.full   { grid-template-columns: 1fr 120px 40px; }
  .cohort-row.ext    { grid-template-columns: 1fr 110px 110px 80px 40px; }

  .cohort-row .ca { text-align: right; font-variant-numeric: tabular-nums; }
  .cohort-row input[type="text"] { padding: 7px 9px; }
  .cohort-row .ca input { text-align: right; }

  .cohort-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); padding-bottom: 7px;
  }
  .cohort-row .dim { color: var(--ink-soft); }
  .cohort-total { border-bottom: 0; font-weight: 600; padding-top: 12px; }
  .cohort-total .strong { font-size: 15px; }

  .row-x {
    background: none; border: 0; cursor: pointer;
    color: var(--ink-faint); font-size: 17px; line-height: 1;
    padding: 4px 6px; border-radius: 6px;
  }
  .row-x:hover { color: var(--danger); background: var(--danger-bg); }

  .add-row {
    align-self: flex-start;
    margin-top: 12px;
    font: inherit; font-size: 13px;
    background: none; border: 1px dashed var(--rule-strong);
    border-radius: 7px; padding: 7px 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  .add-row:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 620px) {
    .cohort-row.ext  { grid-template-columns: 1fr 64px 78px 60px 32px; gap: 6px; font-size: 12.5px; }
    .cohort-row.full { grid-template-columns: 1fr 84px 32px; }
  }

  /* ---------- biospecimen columns ---------- */

  .spec-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 760px) { .spec-cols { grid-template-columns: 1fr; gap: 18px; } }

  .spec-col-title {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
    padding-bottom: 7px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .spec-col .check { margin-bottom: 8px; }

  /* ---------- computed pricing ---------- */

  .calc {
    background: var(--surface-sunk);
    border-radius: 9px;
    padding: 14px 16px;
    margin-top: 16px;
  }
  .calc-row {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 5px 0; font-size: 13.5px;
  }
  .calc-row .v { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }
  .calc-total {
    border-top: 1px solid var(--rule-strong);
    margin-top: 7px; padding-top: 10px;
    font-weight: 600; font-size: 15px;
  }
  .calc-total .v { font-size: 15px; font-weight: 600; }

  /* ---------- register filter ---------- */

  .filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .filters .flabel {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
  }
  .pill {
    font: inherit; font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .pill:hover { border-color: var(--ink-faint); color: var(--ink); }
  .pill[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 500;
  }

  .warn {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .warn strong { color: var(--danger); }

  .errors {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 9px;
    padding: 14px 17px;
    margin-bottom: 26px;
    font-size: 13.5px;
  }
  .errors p { margin: 0 0 7px; font-weight: 600; color: var(--danger); }
  .errors ul { margin: 0; padding-left: 19px; color: var(--ink); }
  .errors li { margin-bottom: 3px; }

  .actions {
    display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
  }
  .actions .spacer { margin-left: auto; }

  .toast {
    position: fixed;
    left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--ground);
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  @media (max-width: 640px) {
    main { padding: 26px 18px 80px; }
    .topbar, .banner { padding-inline: 18px; }
    h1 { font-size: 25px; }
  }
</style>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">MT</span>
    <div>
      <span class="brand-name">Quote Builder</span>
      <span class="brand-org">The MT Group</span>
    </div>
  </div>
  <nav class="nav">
    <button type="button" data-nav="register">Register</button>
    <button type="button" data-nav="new">New quote</button>
  </nav>
</header>

<div class="banner">
  <strong>Mockup</strong>
  <span>Everything works, but it saves only in this browser — nothing here reaches the real system.</span>
</div>

<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- vocabulary

  var REPS = ['John Kibler', 'Heather Shahzade', 'Joshua Taylor', 'Karen Krantz'];
  var VALIDITY = ['30 Day Quote', '60 Day Quote'];
  var SERVICE_TYPES = ['Retrospective', 'Prospective'];

  var STATUSES = [
    { value: 'draft', label: 'Draft' },
    { value: 'internal_reviewed', label: 'Internally reviewed' },

  // Sponsor → acronym. In the real app this comes from the quote register plus

    'astrazeneca': 'AZA', 'genentech': 'GNT', 'takeda': 'TKD', 'novartis': 'NVT',
    'abbvie': 'ABV', 'elsevier biobank': 'ELS', 'iovance': 'IOV', 'qiagen': 'QIA',
    'illumina': 'ILM', 'roche': 'RCH', 'kite pharma': 'KTE', 'kite': 'KTE'

  // Stand-in for the HubSpot contact lookup (needs crm.objects.contacts.read).

    { name: 'Dana Whitfield', email: 'dwhitfield@guardanthealth.com', client: 'Guardant Health' },
    { name: 'Marcus Reyes', email: 'mreyes@natera.com', client: 'Natera' },
    { name: 'Priya Raman', email: 'praman@merck.com', client: 'Merck' },
    { name: 'Tom Alderton', email: 'talderton@exactsciences.com', client: 'Exact Sciences' },
    { name: 'Sofia Lindqvist', email: 'slindqvist@regeneron.com', client: 'Regeneron' }
  ];

  // Stand-in for the PO# / MT# lookup. Real sources, in order of preference:

  // Measured caveat: po_number is filled on ~20% of deals and
  // mt_study_id_number on none — the MT number lives in the deal title.
  var STUDY_INDEX = [
    { po: 'PO-88214', mt: 'MT2291', quote: 'QTE NTA20260826 Pan-cancer - blood',
      client: 'Natera', acronym: 'NTA', preparedBy: 'John Kibler',
      contactName: 'Marcus Reyes', contactEmail: 'mreyes@natera.com',
      dealName: 'NTA: 500 healthies - blood',
      specimens: ['Whole blood', 'Plasma', 'Buffy coat'], perSubject: '1225.00',
      cohorts: [{ name: 'Colorectal cancer', subjects: 200 },
                { name: 'Pancreatic cancer', subjects: 150 },
                { name: 'Healthy controls', subjects: 150 }] },
    { po: 'PO15216', mt: 'MT9920', quote: 'QTE ELS20260814 NSCLC - fresh tissue',
      client: 'Elsevier Biobank', acronym: 'ELS', preparedBy: 'Heather Shahzade',
      contactName: '', contactEmail: '',
      dealName: 'ELS: NSCLC - Fresh Tissue (MT9920)',
      specimens: ['Fresh tissue'], perSubject: '3400.00',
      cohorts: [{ name: 'NSCLC', subjects: 60 }] },
    { po: 'EM1706', mt: 'MT9920', quote: 'QTE EMC20260813 PDAC - fresh tissue',
      client: 'EMC Biosciences', acronym: 'EMC', preparedBy: 'Joshua Taylor',
      contactName: '', contactEmail: '',
      dealName: 'EMC: PDAC - Fresh Tissue (MT9920)',
      specimens: ['Fresh tissue'], perSubject: '3650.00',
      cohorts: [{ name: 'PDAC', subjects: 40 }] }
  ];

  // ---------------------------------------------------------------- samples

  var SAMPLES = [
    { client: 'Guardant Health', sponsorAcronym: 'GHI', quoteName: 'NSCLC - FFPE & plasma',
      preparedBy: 'Joshua Taylor', quoteDate: '2026-08-27', status: 'draft', totalCost: '342750.00',
      specimenTypes: ['FFPE', 'Plasma'], isExtension: false,
      hubspotDealName: 'GHI: NSCLC tissue + plasma',
      cohorts: [{ name: 'NSCLC, stage III-IV', subjects: 90 }, { name: 'Normal adjacent', subjects: 52 }],
      header: { validity: '60 Day Quote', serviceTypes: ['Retrospective', 'Prospective'],
        sponsorContactName: 'Dana Whitfield', sponsorContactEmail: 'dwhitfield@guardanthealth.com',
        sponsorSelectedCases: 'Case list GHI-2026-08 (142 cases)' } },
    { client: 'Natera', sponsorAcronym: 'NTA', quoteName: 'Pan-cancer - blood',
      preparedBy: 'John Kibler', quoteDate: '2026-08-26', status: 'sent', totalCost: '612500.00',
      specimenTypes: ['Whole blood', 'Plasma', 'Buffy coat'], isExtension: false,
      hubspotDealName: 'NTA: 500 healthies - blood', mtNumber: 'MT2291',
      cohorts: [{ name: 'Colorectal cancer', subjects: 200 },
                { name: 'Pancreatic cancer', subjects: 150 },
                { name: 'Healthy controls', subjects: 150 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Prospective'],
        sponsorContactName: 'Marcus Reyes', sponsorContactEmail: 'mreyes@natera.com' } },
    { client: 'Natera', sponsorAcronym: 'NTA', quoteName: 'Pan-cancer - blood (MT2291 extension #1)',
      preparedBy: 'John Kibler', quoteDate: '2026-08-25', status: 'draft', totalCost: '122500.00',
      specimenTypes: ['Whole blood'], isExtension: true,
      hubspotDealName: 'NTA: Multi-cancer - blood (MT2291 extension #1)',
      cohorts: [{ name: 'Colorectal cancer', subjects: 200, additionalSubjects: 60 },
                { name: 'Pancreatic cancer', subjects: 150, additionalSubjects: 40 },
                { name: 'Healthy controls', subjects: 150, additionalSubjects: 0 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Prospective'],
        originalStudyQuote: 'QTE NTA20260826 Pan-cancer - blood',
        originalStudyPo: 'PO-88214', parentMtNumber: 'MT2291', extensionNumber: '1',
        designChanged: false, perSubject: '1225.00' } },
    { client: 'Elsevier Biobank', sponsorAcronym: 'ELS', quoteName: 'NSCLC - fresh tissue',
      preparedBy: 'Heather Shahzade', quoteDate: '2026-08-14', status: 'won', totalCost: '204000.00',
      specimenTypes: ['Fresh tissue'], isExtension: false,
      hubspotDealName: 'ELS: NSCLC - Fresh Tissue (MT9920)', mtNumber: 'MT9920',
      cohorts: [{ name: 'NSCLC', subjects: 60 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Prospective'] } },
    { client: 'Elsevier Biobank', sponsorAcronym: 'ELS', quoteName: 'NSCLC - fresh tissue (MT9920 extension #2)',
      preparedBy: 'Heather Shahzade', quoteDate: '2026-08-18', status: 'sent', totalCost: '68000.00',
      specimenTypes: ['Fresh tissue'], isExtension: true,
      hubspotDealName: 'ELS: NSCLC - Fresh Tissue (MT9920 extension #2)',
      cohorts: [{ name: 'NSCLC', subjects: 60, additionalSubjects: 20 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Prospective'],
        parentMtNumber: 'MT9920', extensionNumber: '2', designChanged: false,
        perSubject: '3400.00' } },
    { client: 'Exact Sciences', sponsorAcronym: 'EXS', quoteName: 'CRC - plasma & buffy',
      preparedBy: 'Heather Shahzade', quoteDate: '2026-08-19', status: 'internal_reviewed',
      totalCost: '288400.00', specimenTypes: ['Plasma', 'Buffy coat'], isExtension: false,
      hubspotDealName: '', cohorts: [{ name: 'Colorectal cancer', subjects: 260 }],
      header: { validity: '60 Day Quote', serviceTypes: ['Prospective'] } },
    { client: 'Merck', sponsorAcronym: 'MRK', quoteName: 'Multi-tumor fresh tissue',
      preparedBy: 'John Kibler', quoteDate: '2026-08-12', status: 'won', totalCost: '1140000.00',
      specimenTypes: ['Fresh tissue', 'Whole blood'], isExtension: false, hubspotDealName: '',
      mtNumber: 'MT9920', cohorts: [{ name: 'Multi-tumor, mixed', subjects: 400 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Prospective'] } },
    { client: 'Regeneron', sponsorAcronym: 'RGN', quoteName: 'Atopic dermatitis - biopsy & serum',
      preparedBy: 'Karen Krantz', quoteDate: '2026-07-30', status: 'lost', totalCost: '175000.00',
      specimenTypes: ['Flash frozen tissue', 'Serum'], isExtension: false, hubspotDealName: '',
      cohorts: [{ name: 'Atopic dermatitis', subjects: 70 }],
      header: { validity: '30 Day Quote', serviceTypes: ['Retrospective'],
        sponsorSelectedCases: 'RGN AD cohort, 60 archived biopsies' } }
  ];

  // ---------------------------------------------------------------- storage

  var KEY = 'mtg-quote-builder-mockup-v2';
  var quotes = [];
  var storageWorks = true;

  function load() {
    try {
      window.localStorage.setItem(KEY + '-probe', '1');
      window.localStorage.removeItem(KEY + '-probe');
      var raw = window.localStorage.getItem(KEY);
      if (raw) { quotes = JSON.parse(raw); return; }
    } catch (e) {
      storageWorks = false;
    }
    quotes = SAMPLES.map(function (s) { return finalize(Object.assign({ id: uid() }, s)); });
    save();
  }

  function save() {
    if (!storageWorks) return;
    try { window.localStorage.setItem(KEY, JSON.stringify(quotes)); }
    catch (e) { storageWorks = false; }
  }

  function uid() { return 'q' + Math.random().toString(36).slice(2, 10); }

  // ---------------------------------------------------------------- helpers

  function quoteNumber(q) {
    var prefix = String(q.sponsorAcronym || q.client || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    var d = String(q.quoteDate || '').replace(/-/g, '');
    if (!prefix && !d && !q.quoteName) return '';
    return ('QTE ' + prefix + d + ' ' + (q.quoteName || '')).trim();
  }

  function finalize(q) { q.quoteNumber = quoteNumber(q); return q; }

  function num(v) {
    var n = Number(String(v == null ? '' : v).replace(/[$,\s]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function money(v) {
    if (v === '' || v === null || v === undefined) return '—';
    var n = Number(String(v).replace(/[$,]/g, ''));
    if (isNaN(n)) return '—';
    return n.toLocaleString('en-US', { style: 'currency', currency: 'USD',
      minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function prettyDate(iso) {
    if (!iso) return '—';
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function statusLabel(v) {
    for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].value === v) return STATUSES[i].label;
    return v;
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, '');
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (k) { if (k) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
    return n;
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  // ---------------------------------------------------------------- auto-fill

  /** Sponsor name → acronym, for the cases we already know. */
  function acronymFor(client) {
    var k = String(client || '').trim().toLowerCase();
    if (!k) return '';
    if (ACRONYMS[k]) return ACRONYMS[k];
    for (var name in ACRONYMS) {
      if (k.indexOf(name) === 0 || name.indexOf(k) === 0) return ACRONYMS[name];
    }
    return '';
  }

  /** Contact name → email, scoped to the sponsor when we know it. */
  function emailFor(contactName, client) {
    var k = String(contactName || '').trim().toLowerCase();
    if (!k) return '';
    var hit = CONTACTS.filter(function (c) {
      return c.name.toLowerCase() === k && (!client || c.client === client);
    })[0] || CONTACTS.filter(function (c) { return c.name.toLowerCase() === k; })[0];
    return hit ? hit.email : '';
  }

  /**
   * Finds the parent study from a PO number and/or MT number.
   * Looks at quotes already in the register first, then the stand-in index.
   * An MT number alone can be ambiguous under an umbrella number like MT9920,
   * so a PO number wins and a bare MT match only counts when it is unique.
   */
  function findStudy(po, mt) {
    po = String(po || '').trim().toLowerCase();
    mt = String(mt || '').trim().toUpperCase();

    if (po) {
      var byPo = STUDY_INDEX.filter(function (s) { return s.po.toLowerCase() === po; });
      if (byPo.length === 1) return { study: byPo[0], via: 'PO number' };
      if (byPo.length > 1) return { ambiguous: byPo.length, via: 'PO number' };
    }
    if (mt) {
      var byMt = STUDY_INDEX.filter(function (s) { return s.mt.toUpperCase() === mt; });
      if (byMt.length === 1) return { study: byMt[0], via: 'MT number' };
      if (byMt.length > 1) return { ambiguous: byMt.length, via: 'MT number', mt: mt };
    }
    return null;
  }

  /** Quote name drafts from the cohorts and specimens (spec §06). */
  function draftQuoteName(d) {
    var indication = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean)[0] || '';
    var specs = (d.specimenTypes || []).map(function (s) { return s.toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' & ' + specs[specs.length - 1]
      : specs.join(' & ');
    var base = [indication, specPart].filter(Boolean).join(' - ');
    if (!base) return '';
    if (d.isExtension && d.header.parentMtNumber) {
      base += ' (' + d.header.parentMtNumber + ' extension #' +
        (d.header.extensionNumber || '?') + ')';
    }
    return base;
  }

  /** Study summary drafts in the real quotes' phrasing (spec §06). */
  function draftSummary(d) {
    var specs = (d.specimenTypes || []).map(function (s) { return s.toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' and ' + specs[specs.length - 1]
      : specs.join(' and ');
    var pop = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean).join(', ');

    if (d.isExtension && d.header.designChanged === false) {
      var q = d.header.originalStudyQuote || 'the original quote';
      var po = d.header.originalStudyPo;
      return 'This study is an extension to that quoted under "' + q + '"' +
        (po ? ' and ordered under "' + po + '."' : '.') +
        ' All study design elements remain the same except as noted below ' +
        '(pricing repeated for clarity).';
    }
    if (!specPart && !pop) return '';
    return 'The goal of this study is to collect and evaluate ' +
      (specPart || 'biospecimens') + ' from ' + (pop || 'study') + ' subjects.';
  }

  // ---------------------------------------------------------------- routing

  var view = document.getElementById('view');
  var route = { name: 'register', id: null };
  var statusFilter = 'all';

  function go(name, id) {
    route = { name: name, id: id || null };
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      var current = (b.dataset.nav === 'register' && name === 'register') ||
                    (b.dataset.nav === 'new' && name === 'new');
      if (current) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  document.querySelectorAll('[data-nav]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.nav); });
  });

  function render() {
    view.replaceChildren();
    view.appendChild(route.name === 'register' ? renderRegister() : renderForm(route.id));
  }

  // ---------------------------------------------------------------- register

  function sorted() {
    return quotes.slice()
      .filter(function (q) { return statusFilter === 'all' || q.status === statusFilter; })
      .sort(function (a, b) { return String(b.quoteDate).localeCompare(String(a.quoteDate)); });
  }

  function filterBar() {
    var bar = el('div', { class: 'filters' }, [el('span', { class: 'flabel', text: 'Show' })]);
    var opts = [{ value: 'all', label: 'All' }].concat(STATUSES);
    opts.forEach(function (o) {
      var n = o.value === 'all' ? quotes.length
        : quotes.filter(function (q) { return q.status === o.value; }).length;
      bar.appendChild(el('button', {
        class: 'pill', type: 'button',
        'aria-pressed': statusFilter === o.value ? 'true' : 'false',
        onclick: function () { statusFilter = o.value; render(); }
      }, [o.label + ' (' + n + ')']));
    });
    return bar;
  }

  function renderRegister() {
    var frag = document.createDocumentFragment();

    if (!storageWorks) {
      frag.appendChild(el('div', { class: 'warn' }, [
        el('strong', { text: 'This browser is not saving your changes. ' }),
        el('span', { text: 'Quotes you create work now but disappear when you reload — site data is ' +
          'blocked, usually a private window or a browser privacy setting.' })
      ]));
    }

    frag.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: 'Quote register' }),
        el('p', { class: 'sub', text: 'Every quote the team has drafted, newest first.' })
      ]),
      el('button', { class: 'btn btn-primary', type: 'button', onclick: function () { go('new'); } }, ['New quote'])
    ]));

    frag.appendChild(filterBar());

    var visible = sorted();
    if (!visible.length) {
      frag.appendChild(el('div', { class: 'empty' }, [
        el('p', { text: quotes.length ? 'No quotes with that status.' : 'No quotes yet.' }),
        quotes.length
          ? el('button', { class: 'link-btn', type: 'button',
              onclick: function () { statusFilter = 'all'; render(); } }, ['Show all quotes'])
          : el('button', { class: 'link-btn', type: 'button',
              onclick: function () { go('new'); } }, ['Create the first one'])
      ]));
      frag.appendChild(footRow());
      return frag;
    }

    var head = el('tr', {}, [
      el('th', { text: 'Quote' }), el('th', { text: 'Client' }), el('th', { text: 'Prepared by' }),
      el('th', { text: 'Date' }), el('th', { class: 'num', text: 'Total' }), el('th', { text: 'Status' })
    ]);

    var body = el('tbody', {}, visible.map(function (q) {
      return el('tr', {}, [
        el('td', {}, [
          el('button', { class: 'q-name', type: 'button', onclick: function () { go('edit', q.id); } },
            [q.quoteName || '(untitled)']),
          el('div', { class: 'q-number', text: q.quoteNumber || '—' }),
          (q.specimenTypes && q.specimenTypes.length)
            ? el('div', { class: 'q-specimens', text: q.specimenTypes.join(', ') }) : null
        ]),
        el('td', {}, [
          q.client || '—',
          q.isExtension ? el('span', { class: 'tag-ext', text: 'extension' }) : null
        ]),
        el('td', { text: q.preparedBy || '—' }),
        el('td', { class: 'nowrap', text: prettyDate(q.quoteDate) }),
        el('td', { class: 'money', text: money(q.totalCost) }),
        el('td', {}, [el('span', { class: 'chip chip-' + q.status, text: statusLabel(q.status) })])
      ]);
    }));

    frag.appendChild(el('div', { class: 'table-wrap' }, [
      el('table', {}, [el('thead', {}, [head]), body])
    ]));
    frag.appendChild(footRow());
    return frag;
  }

  function footRow() {
    var total = quotes.reduce(function (sum, q) { return sum + num(q.totalCost); }, 0);
    return el('div', { class: 'table-foot' }, [
      el('span', { text: quotes.length + (quotes.length === 1 ? ' quote' : ' quotes') +
        (quotes.length ? ' · ' + money(total) + ' quoted' : '') }),
      el('button', {
        class: 'link-btn', type: 'button',
        onclick: function () {
          if (!confirm('Reset the mockup back to its sample quotes?')) return;
          quotes = SAMPLES.map(function (s) { return finalize(Object.assign({ id: uid() }, s)); });
          save(); go('register'); toast('Sample quotes restored');
        }
      }, ['Reset sample data'])
    ]);
  }

  // ---------------------------------------------------------------- form

  function blank() {
    return {
      id: null, client: '', sponsorAcronym: '', quoteName: '', preparedBy: REPS[0],
      quoteDate: new Date().toISOString().slice(0, 10), status: 'draft', totalCost: '',
      specimenTypes: [], isExtension: false, hubspotDealName: '',
      cohorts: [{ name: '', subjects: '' }], notes: '', summary: '',
      nameEdited: false, summaryEdited: false,
      header: { validity: VALIDITY[0], serviceTypes: [] }
    };
  }

  function renderForm(id) {
    var existing = id ? quotes.filter(function (q) { return q.id === id; })[0] : null;
    var draft = existing ? JSON.parse(JSON.stringify(existing)) : blank();
    draft.header = draft.header || {};
    draft.header.serviceTypes = draft.header.serviceTypes || [];
    draft.specimenTypes = draft.specimenTypes || [];
    draft.cohorts = draft.cohorts || [];
    if (existing) { draft.nameEdited = true; draft.summaryEdited = true; }

    var frag = document.createDocumentFragment();
    var wrap = el('div', { class: 'form-wrap' });
    frag.appendChild(wrap);

    wrap.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { go('register'); } },
      ['← Quote register']));

    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: existing ? (existing.quoteName || 'Quote') : 'New quote' }),
        el('p', { class: 'sub', text: existing
          ? 'Change anything and save. Deleting cannot be undone.'
          : 'Fill in what you know — you can save a draft and come back.' })
      ])
    ]));

    var numVal = el('div', { class: 'val', text: quoteNumber(draft) || 'Fills in as you type' });
    wrap.appendChild(el('div', { class: 'quote-no-preview' }, [
      el('span', { class: 'lbl', text: 'Quote number' }), numVal
    ]));

    var errorBox = el('div');
    wrap.appendChild(errorBox);

    function refreshNumber() { numVal.textContent = quoteNumber(draft) || 'Fills in as you type'; }

    // ---- field helper -------------------------------------------------
    var idc = 0;
    function field(label, opts) {
      opts = opts || {};
      var fid = 'f' + (++idc);
      var input;

      if (opts.type === 'select') {
        input = el('select', { id: fid, onchange: function () { opts.set(input.value); after(); } });
        opts.options.forEach(function (o) {
          var v = typeof o === 'string' ? o : o.value;
          var l = typeof o === 'string' ? o : o.label;
          input.appendChild(el('option', { value: v, text: l }));
        });
        input.value = opts.get();
      } else if (opts.type === 'textarea') {
        input = el('textarea', { id: fid, rows: opts.rows || 3, placeholder: opts.placeholder || '',
          oninput: function () { opts.set(input.value); after(); } });
        input.value = opts.get() || '';
      } else {
        input = el('input', { id: fid, type: opts.type || 'text', placeholder: opts.placeholder || '',
          inputmode: opts.inputmode || false,
          oninput: function () { opts.set(input.value); after(); },
          onblur: opts.onblur || null });
        input.value = opts.get() || '';
      }

      function after() { refreshNumber(); if (opts.then) opts.then(); }

      var lbl = el('label', { for: fid }, [label]);
      if (opts.required) lbl.appendChild(el('span', { class: 'req', text: ' *' }));
      if (opts.autofilled) lbl.appendChild(el('span', { class: 'autofilled', text: 'auto' }));

      var kids = [lbl, input];
      if (opts.hint) kids.push(el('div', { class: 'hint', text: opts.hint }));
      var box = el('div', { class: 'fld' + (opts.full ? ' full' : '') }, kids);
      box._input = input;
      return box;
    }

    function checkbox(label, get, set, onToggle) {

      return el('label', { class: 'check' }, [box, el('span', {}, [label])]);
    }

    // ---- section 01 ---------------------------------------------------
    var sec01 = el('section', { class: 'sec' });

    var extBox = el('div');

    function applyStudy(study, via) {
      draft.client = study.client;
      draft.sponsorAcronym = study.acronym;
      draft.preparedBy = study.preparedBy || draft.preparedBy;
      draft.specimenTypes = (study.specimens || []).slice();
      draft.header.parentMtNumber = study.mt;
      draft.header.originalStudyQuote = draft.header.originalStudyQuote || study.quote;
      draft.header.originalStudyPo = draft.header.originalStudyPo || study.po;
      draft.header.sponsorContactName = study.contactName || '';
      draft.header.sponsorContactEmail = study.contactEmail || '';
      draft.header.perSubject = draft.header.perSubject || study.perSubject;
      draft.hubspotDealName = draft.hubspotDealName || study.dealName || '';
      draft.cohorts = (study.cohorts || []).map(function (c) {
        return { name: c.name, subjects: c.subjects, additionalSubjects: 0 };
      });
      draft.header.matchedVia = via;
      draft.header.matchedStudy = study.quote;

      // Extension number continues this sponsor's own thread, never the
      // umbrella's — MT9920 alone carries 37 separate threads.
      var next = 1;
      quotes.forEach(function (q) {
        if (!q.isExtension) return;
        var h = q.header || {};
        if (h.parentMtNumber === study.mt && q.client === study.client) {
          var n = parseInt(h.extensionNumber, 10);
          if (!isNaN(n) && n >= next) next = n + 1;
        }
      });
      draft.header.extensionNumber = draft.header.extensionNumber || String(next);
    }

    function runLookup() {
      var hit = findStudy(draft.header.originalStudyPo, draft.header.parentMtNumber);
      if (hit && hit.study) {
        applyStudy(hit.study, hit.via);
        draft.header.ambiguous = null;
        if (extFields) {
          extFields.mt._input.value = draft.header.parentMtNumber || '';
          extFields.extNo._input.value = draft.header.extensionNumber || '';
          extFields.quote._input.value = draft.header.originalStudyQuote || '';
          extFields.po._input.value = draft.header.originalStudyPo || '';
        }
      } else {
        draft.header.matchedVia = null;
        draft.header.matchedStudy = null;
        draft.header.ambiguous = (hit && hit.ambiguous) ? hit : null;
      }
      renderLookupResult();
      renderBody();
      refreshNumber();
    }

    // The extension fields are built once and kept. A lookup updates their

        get: function () { return draft.header.originalStudyQuote; },

      var poFld = field('Original study PO #', {
        placeholder: 'PO-88214',
        hint: 'Blank if the sponsor has not issued one yet.',
        get: function () { return draft.header.originalStudyPo; },
        set: function (v) { draft.header.originalStudyPo = v; },
        onblur: runLookup });

      var mtFld = field('Parent MT number', { placeholder: 'MT2291',
        get: function () { return draft.header.parentMtNumber; },
        set: function (v) { draft.header.parentMtNumber = v.toUpperCase(); },
        onblur: runLookup });

      var extNoFld = field('Extension #', { placeholder: '1',

      var changed = checkbox('The study design has changed',

      extFields = {

    function renderExtBox() {
      extBox.replaceChildren();

    function renderLookupResult() {
      lookupBox.replaceChildren();

      if (draft.header.matchedStudy) {
        lookupBox.appendChild(el('div', { class: 'carried' }, [

            el('dt', { text: 'Specimens' }),
            el('dd', { text: (draft.specimenTypes || []).join(', ') || '—' })
          ]),
          el('div', { class: 'hint', text: 'Everything it filled in stays editable below.' })

      }

      var a = draft.header.ambiguous;

        ]));
      } else if (draft.header.originalStudyPo || draft.header.parentMtNumber) {

    var extCheck = checkbox('This is a study extension',

    // ---- header variants ---------------------------------------------

    function sponsorFields() {
      var acronymFld, emailFld;

    // ---- 03 cohorts ---------------------------------------------------

    function sectionCohorts() {
      var ext = isMinimal();
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('03', ext ? 'Cohorts & additional subjects' : 'Population & cohorts'));

      var rows = el('div', { class: 'cohorts' });
      var totalEl = el('span', { class: 'ca strong' });

      function recompute() {
        var was = 0, add = 0;
        draft.cohorts.forEach(function (c) { was += num(c.subjects); add += num(c.additionalSubjects); });
        totalEl.textContent = String(ext ? was + add : was);
        if (pricingRefresh) pricingRefresh();
      }

      function paint() {
        rows.replaceChildren();
        rows.appendChild(el('div', { class: 'cohort-row ' + (ext ? 'ext' : 'full') + ' cohort-head' },
          ext
            ? [el('span', { text: 'Cohort' }), el('span', { class: 'ca', text: 'Already quoted' }),
               el('span', { class: 'ca', text: 'Additional' }), el('span', { class: 'ca', text: 'New total' }),
               el('span', {})]
            : [el('span', { text: 'Cohort' }), el('span', { class: 'ca', text: '# subjects' }), el('span', {})]));

        draft.cohorts.forEach(function (c, i) {
          var nameIn = el('input', { type: 'text', value: c.name || '',
            'aria-label': 'Cohort ' + (i + 1) + ' name', placeholder: 'Colorectal cancer',
            oninput: function () { draft.cohorts[i].name = nameIn.value; if (!draft.nameEdited) refreshDrafts(); } });
          nameIn.value = c.name || '';

          var subIn = el('input', { type: 'text', inputmode: 'numeric',
            'aria-label': (ext ? 'Subjects already quoted for ' : 'Subjects for ') + (c.name || 'cohort ' + (i + 1)),
            oninput: function () { draft.cohorts[i].subjects = subIn.value; recompute(); newTotal && paint2(); } });
          subIn.value = c.subjects == null ? '' : String(c.subjects);

          var newTotal = null, addIn = null;
          if (ext) {
            newTotal = el('span', { class: 'ca', text: String(num(c.subjects) + num(c.additionalSubjects)) });
            addIn = el('input', { type: 'text', inputmode: 'numeric',
              'aria-label': 'Additional subjects for ' + (c.name || 'cohort ' + (i + 1)),
              oninput: function () {
                draft.cohorts[i].additionalSubjects = addIn.value;
                newTotal.textContent = String(num(subIn.value) + num(addIn.value));
                recompute();
              } });
            addIn.value = c.additionalSubjects == null ? '' : String(c.additionalSubjects);
          }
          function paint2() { if (newTotal) newTotal.textContent = String(num(subIn.value) + num(addIn ? addIn.value : 0)); }

          var x = el('button', { class: 'row-x', type: 'button', title: 'Remove cohort',
            'aria-label': 'Remove ' + (c.name || 'cohort ' + (i + 1)),
            onclick: function () { draft.cohorts.splice(i, 1); paint(); recompute(); } }, ['×']);

          rows.appendChild(el('div', { class: 'cohort-row ' + (ext ? 'ext' : 'full') },
            ext ? [nameIn, el('span', { class: 'ca' }, [subIn]), el('span', { class: 'ca' }, [addIn]), newTotal, x]
                : [nameIn, el('span', { class: 'ca' }, [subIn]), x]));
        });

        rows.appendChild(el('div', { class: 'cohort-row ' + (ext ? 'ext' : 'full') + ' cohort-total' },
          ext ? [el('span', { text: 'Total subjects' }), el('span', { class: 'ca' }),
                 el('span', { class: 'ca' }), totalEl, el('span', {})]
              : [el('span', { text: 'Total subjects' }), totalEl, el('span', {})]));
        recompute();
      }

      paint();
      sec.appendChild(rows);
      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.cohorts.push({ name: '', subjects: '', additionalSubjects: '' });
        paint();
      } }, ['+ Add cohort']));

      if (ext) {
        sec.appendChild(el('div', { class: 'hint',
          text: 'Filled from the original study when the lookup finds it — otherwise type them in.' }));
      }

    function submit() {
      var errs = [];
      if (!String(draft.client).trim()) errs.push('Client / sponsor is required (§01).');
      if (!String(draft.quoteName).trim()) errs.push('Quote name is required (§06).');
      if (!String(draft.quoteDate).trim()) errs.push('Quote date is required (§01).');
      if (String(draft.totalCost).trim() !== '' && isNaN(Number(String(draft.totalCost).replace(/[$,]/g, '')))) {
        errs.push('Total cost must be a number (§10).');
      } else if (num(draft.totalCost) < 0) {
        errs.push('Total cost cannot be negative (§10).');
      }

      errorBox.replaceChildren();
      if (errs.length) {
        errorBox.appendChild(el('div', { class: 'errors', role: 'alert' }, [
          el('p', { text: 'This quote can’t be saved yet:' }),
          el('ul', {}, errs.map(function (e) { return el('li', { text: e }); }))
        ]));
        errorBox.scrollIntoView({ block: 'nearest' });
        return;
      }

      finalize(draft);
      if (existing) {
        for (var i = 0; i < quotes.length; i++) if (quotes[i].id === existing.id) quotes[i] = draft;
        save(); go('edit', existing.id); toast('Changes saved');
      } else {
        draft.id = uid();
        quotes.push(draft);
        save(); go('edit', draft.id); toast('Quote created');
      }
    }

    return frag;
  }

  function partialNote(text) {
    return el('div', { class: 'partial-note' }, [
      el('span', { class: 'partial-tag', text: 'Partial' }),
      el('span', { text: text })
    ]);
  }

  function secHead(num, title, note) {
    return el('div', { class: 'sec-head' }, [
      el('span', { class: 'sec-num', text: num }),
      el('span', { class: 'sec-title', text: title }),
      note ? el('span', { class: 'sec-note', text: note }) : null
    ]);
  }

  // ---------------------------------------------------------------- boot

  load();
  go('register');
})();
</script>
