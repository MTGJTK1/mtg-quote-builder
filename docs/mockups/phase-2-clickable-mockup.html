<title>MT Group Quote Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground: #FAFAF8;
    --surface: #FFFFFF;
    --surface-sunk: #F3F4F2;
    --ink: #16211F;
    --ink-soft: #5F6E6B;
    --ink-faint: #8D9995;
    --rule: #E2E6E3;
    --rule-strong: #CBD2CF;
    --accent: #0E5B57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EFEC;

    --st-draft-fg: #5F6E6B;   --st-draft-bg: #ECEEEC;
    --st-review-fg: #8A5606;  --st-review-bg: #FBF0DC;
    --st-sent-fg: #1B4F8C;    --st-sent-bg: #E4EDF8;
    --st-won-fg: #16613B;     --st-won-bg: #E0F0E7;
    --st-lost-fg: #8E3039;    --st-lost-bg: #FAE6E7;

    --danger: #A33A44;
    --danger-bg: #FBEBEC;

    --shadow: 0 1px 2px rgba(22, 33, 31, .05), 0 6px 20px -12px rgba(22, 33, 31, .18);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1312;
      --surface: #151B1A;
      --surface-sunk: #1B2322;
      --ink: #E9EEEC;
      --ink-soft: #97A5A1;
      --ink-faint: #6E7C79;
      --rule: #25302E;
      --rule-strong: #35423F;
      --accent: #57BAAE;
      --accent-ink: #06201E;
      --accent-soft: #14302D;

      --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
      --st-review-fg: #E0B366;  --st-review-bg: #332915;
      --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
      --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
      --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

      --danger: #E0949B;
      --danger-bg: #2A1A1C;

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1312;
    --surface: #151B1A;
    --surface-sunk: #1B2322;
    --ink: #E9EEEC;
    --ink-soft: #97A5A1;
    --ink-faint: #6E7C79;
    --rule: #25302E;
    --rule-strong: #35423F;
    --accent: #57BAAE;
    --accent-ink: #06201E;
    --accent-soft: #14302D;

    --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
    --st-review-fg: #E0B366;  --st-review-bg: #332915;
    --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
    --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
    --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

    --danger: #E0949B;
    --danger-bg: #2A1A1C;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- shell ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }

  .mark {
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.15;
  }

  .brand-org {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .13em;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  .nav { display: flex; gap: 4px; }

  .nav button {
    font: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav button:hover { background: var(--surface-sunk); color: var(--ink); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .banner {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 28px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    border-bottom: 1px solid var(--rule);
  }
  .banner strong { font-weight: 600; }
  .banner span { color: var(--ink-soft); }

  main { padding: 34px 28px 90px; max-width: 1120px; margin: 0 auto; }

  /* ---------- page heading ---------- */

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-soft); font-size: 14px; margin: 5px 0 0; }

  /* ---------- buttons ---------- */

  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }

  .btn-danger {
    border-color: transparent;
    background: none;
    color: var(--danger);
    padding-inline: 6px;
  }
  .btn-danger:hover { background: var(--danger-bg); border-color: transparent; }

  /* ---------- register table ---------- */

  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 11px;
    box-shadow: var(--shadow);
  }

  table { width: 100%; min-width: 860px; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .11em;
    color: var(--ink-faint);
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  th.num { text-align: right; }

  td {
    padding: 15px 18px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-sunk); }

  .q-name {
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  .q-name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .q-number {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 4px;
    word-break: break-word;
  }

  .q-specimens { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  .nowrap { white-space: nowrap; }

  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .chip-draft { background: var(--st-draft-bg); color: var(--st-draft-fg); }
  .chip-internal_reviewed { background: var(--st-review-bg); color: var(--st-review-fg); }
  .chip-sent { background: var(--st-sent-bg); color: var(--st-sent-fg); }
  .chip-won { background: var(--st-won-bg); color: var(--st-won-fg); }
  .chip-lost { background: var(--st-lost-bg); color: var(--st-lost-fg); }

  .tag-ext {
    display: inline-block;
    margin-left: 7px;
    padding: 1px 7px;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .03em;
    vertical-align: 1px;
  }

  .table-foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: 11px;
    padding: 62px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .link-btn {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: inherit;
    color: var(--accent); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---------- form ---------- */

  .form-wrap { max-width: 760px; }

  .back {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: 13.5px;
    color: var(--ink-soft); cursor: pointer;
    margin-bottom: 18px;
  }
  .back:hover { color: var(--accent); }

  .quote-no-preview {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 26px;
  }
  .quote-no-preview .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--ink-faint); display: block; margin-bottom: 4px;
  }
  .quote-no-input {
    font-family: var(--mono) !important; font-size: 13.5px !important;
    background: var(--surface) !important;
  }
  .quote-no-foot {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-top: 6px;
  }
  .quote-no-foot .link-btn { font-size: 12px; }

  section.sec { margin-bottom: 34px; }

  .sec-head {
    display: flex; align-items: baseline; gap: 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 18px;
  }
  .sec-num {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); font-weight: 500;
  }
  .sec-title { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .sec-note { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

  .sec-pending {
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--rule);
    color: var(--ink-faint);
    font-size: 13.5px;
  }
  .sec-pending .sec-num { color: var(--ink-faint); }
  .sec-pending .phase {
    margin-left: auto; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .grid .full { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; }
  .fld > label {
    font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ink);
  }
  .req { color: var(--danger); }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    font: inherit; font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 62px; }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  ::placeholder { color: var(--ink-faint); opacity: 1; }

  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
  .check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }

  .check-row { display: flex; flex-wrap: wrap; gap: 10px 24px; }

  .specimen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 10px 18px;
  }

  .toggle-box {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 17px;
    margin-bottom: 18px;
  }

  fieldset { border: 0; padding: 0; margin: 18px 0 0; }
  legend { font-size: 13px; font-weight: 500; margin-bottom: 8px; padding: 0; }

  /* ---------- empty-state note ---------- */

  .empty-note {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    background: var(--surface-sunk);
    border-left: 3px solid var(--rule-strong);
    border-radius: 0 7px 7px 0;
    padding: 10px 13px;
    margin-bottom: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  /* ---------- lookup / carried-over detail ---------- */

  .carried {
    background: var(--accent-soft);
    border-radius: 9px;
    padding: 15px 17px;
    margin-bottom: 18px;
  }
  .carried-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); font-weight: 600; margin-bottom: 11px;
  }
  .carried-list {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
    margin: 0 0 10px;
  }
  .carried-list dt { font-size: 12.5px; color: var(--ink-soft); }
  .carried-list dd { margin: 0; font-size: 13.5px; }
  .carried .hint { margin-top: 0; }

  .lookup-idle {
    border: 1px dashed var(--rule-strong);
    border-radius: 9px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .autofilled {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 7px;
    vertical-align: 1px;
  }

  /* ---------- cohort rows ---------- */

  .cohorts { display: flex; flex-direction: column; }

  .cohort-row {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-row.full   { grid-template-columns: 1fr 120px 40px; }
  .cohort-row.ext    { grid-template-columns: 1fr 110px 110px 80px 40px; }

  .cohort-row .ca { text-align: right; font-variant-numeric: tabular-nums; }
  .cohort-row input[type="text"] { padding: 7px 9px; }
  .cohort-row .ca input { text-align: right; }

  .cohort-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); padding-bottom: 7px;
  }
  .cohort-row .dim { color: var(--ink-soft); }
  .cohort-total { border-bottom: 0; font-weight: 600; padding-top: 12px; }
  .cohort-total .strong { font-size: 15px; }

  .row-x {
    background: none; border: 0; cursor: pointer;
    color: var(--ink-faint); font-size: 17px; line-height: 1;
    padding: 4px 6px; border-radius: 6px;
  }
  .row-x:hover { color: var(--danger); background: var(--danger-bg); }

  .add-row {
    align-self: flex-start;
    margin-top: 12px;
    font: inherit; font-size: 13px;
    background: none; border: 1px dashed var(--rule-strong);
    border-radius: 7px; padding: 7px 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  .add-row:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 620px) {
    .cohort-row.ext  { grid-template-columns: 1fr 64px 78px 60px 32px; gap: 6px; font-size: 12.5px; }
    .cohort-row.full { grid-template-columns: 1fr 84px 32px; }
  }

  .cohort-card-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-card-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600;
    margin-right: auto;
  }
  .sub-label {
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }

  .ie-note {
    background: var(--surface-sunk);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    padding: 11px 14px;
    margin: 22px 0 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .ie-note strong { color: var(--ink); font-weight: 600; }

  /* ---------- biospecimen columns ---------- */

  .spec-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 760px) { .spec-cols { grid-template-columns: 1fr; gap: 18px; } }

  .spec-col-title {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
    padding-bottom: 7px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .spec-col .check { margin-bottom: 8px; }

  .sub-head {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
    margin: 26px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---------- computed pricing ---------- */

  .calc {
    background: var(--surface-sunk);
    border-radius: 9px;
    padding: 14px 16px;
    margin-top: 16px;
  }
  .calc-row {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 5px 0; font-size: 13.5px;
  }
  .calc-row .v { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }
  .calc-total {
    border-top: 1px solid var(--rule-strong);
    margin-top: 7px; padding-top: 10px;
    font-weight: 600; font-size: 15px;
  }
  .calc-total .v { font-size: 15px; font-weight: 600; }

  /* ---------- register filter ---------- */

  .filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .filters .flabel {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .11em;
    color: var(--ink-faint);
  }
  .pill {
    font: inherit; font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .pill:hover { border-color: var(--ink-faint); color: var(--ink); }
  .pill[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 500;
  }

  .warn {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .warn strong { color: var(--danger); }

  .errors {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 9px;
    padding: 14px 17px;
    margin-bottom: 26px;
    font-size: 13.5px;
  }
  .errors p { margin: 0 0 7px; font-weight: 600; color: var(--danger); }
  .errors ul { margin: 0; padding-left: 19px; color: var(--ink); }
  .errors li { margin-bottom: 3px; }

  .actions {
    display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
  }
  .actions .spacer { margin-left: auto; }

  .toast {
    position: fixed;
    left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--ground);
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 50;
  }

    var hit = CONTACTS.filter(function (c) {
      return c.name.toLowerCase() === k && (!client || c.client === client);
    })[0] || CONTACTS.filter(function (c) { return c.name.toLowerCase() === k; })[0];
    return hit ? hit.email : '';
  }

  /**
   * Finds the parent study from a PO number and/or MT number.
   * Looks at quotes already in the register first, then the stand-in index.
   * An MT number alone can be ambiguous under an umbrella number like MT9920,
   * so a PO number wins and a bare MT match only counts when it is unique.
   */
  /**
   * Match on the original-study-quote text a rep types. Quote numbers carry the
   * sponsor acronym and date — "QTE NTA20260826 Pan-cancer - blood" — so an
   * exact match works, and failing that the acronym alone identifies the client.
   * OneDrive becomes the real source for this; the register stands in for now.
   */
  function findStudyByQuoteRef(ref, quotesList) {
    var t = String(ref || '').trim();
    if (t.length < 4) return null;

    var low = t.toLowerCase();

    var exact = (quotesList || []).filter(function (q) {
      return q.quoteNumber && q.quoteNumber.toLowerCase() === low;
    })[0];
    if (exact) return { quote: exact, via: 'quote reference' };

    var idx = STUDY_INDEX.filter(function (st) { return st.quote.toLowerCase() === low; })[0];
    if (idx) return { study: idx, via: 'quote reference' };

    // Partial is enough — reps paste fragments, and a unique containment match
    // is far more useful than nothing.
    var partial = (quotesList || []).filter(function (q) {
      var n = (q.quoteNumber || '').toLowerCase();
      return n && (n.indexOf(low) > -1 || low.indexOf(n) > -1);
    });
    if (partial.length === 1) return { quote: partial[0], via: 'quote reference' };

    var partialIdx = STUDY_INDEX.filter(function (st) {
      var n = st.quote.toLowerCase();
      return n.indexOf(low) > -1 || low.indexOf(n) > -1;
    });
    if (partialIdx.length === 1) return { study: partialIdx[0], via: 'quote reference' };

    // Fall back to the acronym embedded in the number.
    var m = t.match(/QTE\s*([A-Z0-9]{2,6})\d{6,8}/i);
    if (m) {
      var ac = m[1].toUpperCase();
      var byAc = STUDY_INDEX.filter(function (st) { return st.acronym === ac; });
      if (byAc.length === 1) return { study: byAc[0], via: 'sponsor acronym in the quote number' };
      var q = (quotesList || []).filter(function (x) { return x.sponsorAcronym === ac; })[0];
      if (q) return { acronymOnly: ac, client: q.client, via: 'sponsor acronym in the quote number' };
      if (byAc.length > 1) return { acronymOnly: ac, client: byAc[0].client, via: 'sponsor acronym in the quote number' };
    }
    return null;
  }

  function findStudy(po, mt) {
    po = String(po || '').trim().toLowerCase();
    mt = String(mt || '').trim().toUpperCase();

    if (po) {
      var regPo = (quotes || []).filter(function (q) {
        return String((q.header || {}).originalStudyPo || '').toLowerCase() === po;
      });
      if (regPo.length === 1) return { registerQuote: regPo[0], via: 'PO number' };

      var byPo = STUDY_INDEX.filter(function (s) { return s.po.toLowerCase() === po; });
      if (byPo.length === 1) return { study: byPo[0], via: 'PO number' };
      if (byPo.length > 1) return { ambiguous: byPo.length, via: 'PO number' };
    }
    if (mt) {
      // The register is checked first — a study quoted in this tool is the best
      // answer available, and MT9920 aside an MT number identifies one study.
      var regMt = (quotes || []).filter(function (q) {
        return !q.isExtension && String(q.mtNumber || '').toUpperCase() === mt;
      });
      if (regMt.length === 1) return { registerQuote: regMt[0], via: 'MT number' };

      var byMt = STUDY_INDEX.filter(function (s) { return s.mt.toUpperCase() === mt; });
      if (byMt.length === 1) return { study: byMt[0], via: 'MT number' };
      if (byMt.length > 1) return { ambiguous: byMt.length, via: 'MT number', mt: mt };
    }
    return null;
  }

  /** Quote name drafts from the cohorts and specimens (spec §06). */
  function draftQuoteName(d) {
    var indication = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean)[0] || '';
    var specs = orderedSpecimens(d).map(function (s) { return s.toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' & ' + specs[specs.length - 1]
      : specs.join(' & ');
    var base = [indication, specPart].filter(Boolean).join(' - ');
    if (!base) return '';
    if (d.isExtension && d.header.parentMtNumber) {
      base += ' (' + d.header.parentMtNumber + ' extension #' +
        (d.header.extensionNumber || '?') + ')';
    }
    return base;
  }

  /** Section numbering is load-bearing: §10's pricing blocks are numbered to
   *  match §05's specimen order, and the drafted name and summary list them the
   *  same way. Everything reads this rather than the order they were ticked. */
  function orderedSpecimens(d) {
    return ALL_SPECIMENS.filter(function (t) {
      return (d.specimenTypes || []).indexOf(t) > -1;
    });
  }

  /** Study summary drafts in the real quotes' phrasing (spec §06). */
  function draftSummary(d) {
    var specs = orderedSpecimens(d).map(function (s) { return s.toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' and ' + specs[specs.length - 1]
      : specs.join(' and ');
    var pop = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean).join(', ');

    if (d.isExtension && d.header.designChanged === false) {
      var q = d.header.originalStudyQuote || 'the original quote';
      var po = d.header.originalStudyPo;
      return 'This study is an extension to that quoted under "' + q + '"' +
        (po ? ' and ordered under "' + po + '."' : '.') +
        ' All study design elements remain the same except as noted below ' +
        '(pricing repeated for clarity).';
    }
    if (!specPart && !pop) return '';
    var out = 'The goal of this study is to collect and evaluate ' +
      (specPart || 'biospecimens') + ' from ' + (pop || 'study') + ' subjects.';

    // A processing protocol decides whether a site can take part at all, so it
    // is carried into the summary rather than left in §05 for someone to find.
    var detail = d.specimenDetail || {};
    var protocols = orderedSpecimens(d).map(function (t) {
      var note = String((detail[t] || {}).processing || '').trim();
      return note ? t.toLowerCase() + ' requires ' + note.replace(/\.$/, '') : '';
    }).filter(Boolean);
    if (protocols.length) {
      out += ' Processing is not standard: ' + protocols.join('; ') + '.';
    }
    return out;
  }

  // ---------------------------------------------------------------- routing

  var view = document.getElementById('view');
  var route = { name: 'register', id: null };
  var statusFilter = 'all';

  function go(name, id) {
    route = { name: name, id: id || null };
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      var current = (b.dataset.nav === 'register' && name === 'register') ||
                    (b.dataset.nav === 'new' && name === 'new');
      if (current) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  document.querySelectorAll('[data-nav]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.nav); });
  });

  function render() {
    view.replaceChildren();
    view.appendChild(route.name === 'register' ? renderRegister() : renderForm(route.id));
  }

  // ---------------------------------------------------------------- register

  function sorted() {
    return quotes.slice()
      .filter(function (q) { return statusFilter === 'all' || q.status === statusFilter; })
      .sort(function (a, b) { return String(b.quoteDate).localeCompare(String(a.quoteDate)); });
  }

  function filterBar() {
    var bar = el('div', { class: 'filters' }, [el('span', { class: 'flabel', text: 'Show' })]);
    var opts = [{ value: 'all', label: 'All' }].concat(STATUSES);
    opts.forEach(function (o) {
      var n = o.value === 'all' ? quotes.length
        : quotes.filter(function (q) { return q.status === o.value; }).length;
      bar.appendChild(el('button', {
        class: 'pill', type: 'button',
        'aria-pressed': statusFilter === o.value ? 'true' : 'false',
        onclick: function () { statusFilter = o.value; render(); }
      }, [o.label + ' (' + n + ')']));
    });
    return bar;
  }

  function renderRegister() {
    var frag = document.createDocumentFragment();

    if (!storageWorks) {
      frag.appendChild(el('div', { class: 'warn' }, [
        el('strong', { text: 'This browser is not saving your changes. ' }),
        el('span', { text: 'Quotes you create work now but disappear when you reload — site data is ' +
          'blocked, usually a private window or a browser privacy setting.' })
      ]));
    }

    if (samplesStale) {
      frag.appendChild(el('div', { class: 'warn' }, [
        el('strong', { text: 'The sample quotes have been updated since you last opened this. ' }),
        el('span', { text: 'Your browser is still showing the older set. Reset the sample data at ' +
          'the foot of the table to pick up the new ones \u2014 any quotes you have created will be ' +
          'discarded, so save anything you want to keep first.' })
      ]));
    }

    frag.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: 'Quote register' }),
        el('p', { class: 'sub', text: 'Every quote the team has drafted, newest first.' })
      ]),
      el('button', { class: 'btn btn-primary', type: 'button', onclick: function () { go('new'); } }, ['New quote'])
    ]));

    frag.appendChild(filterBar());

    var visible = sorted();
    if (!visible.length) {
      frag.appendChild(el('div', { class: 'empty' }, [
        el('p', { text: quotes.length ? 'No quotes with that status.' : 'No quotes yet.' }),
        quotes.length
          ? el('button', { class: 'link-btn', type: 'button',
              onclick: function () { statusFilter = 'all'; render(); } }, ['Show all quotes'])
          : el('button', { class: 'link-btn', type: 'button',
              onclick: function () { go('new'); } }, ['Create the first one'])
      ]));
      frag.appendChild(footRow());
      return frag;
    }

    var head = el('tr', {}, [
      el('th', { text: 'Quote' }), el('th', { text: 'Client' }), el('th', { text: 'Rep' }),
      el('th', { text: 'Date' }), el('th', { class: 'num', text: 'Total' }), el('th', { text: 'Status' })
    ]);

    var body = el('tbody', {}, visible.map(function (q) {
      return el('tr', {}, [
        el('td', {}, [
          el('button', { class: 'q-name', type: 'button', onclick: function () { go('edit', q.id); } },
            [q.quoteName || '(untitled)']),
          el('div', { class: 'q-number', text: q.quoteNumber || '—' }),
          (q.specimenTypes && q.specimenTypes.length)
            ? el('div', { class: 'q-specimens', text: q.specimenTypes.join(', ') }) : null
        ]),
        el('td', {}, [
          q.client || '—',
          q.isExtension ? el('span', { class: 'tag-ext', text: 'extension' }) : null
        ]),
        el('td', { text: q.preparedBy || '—' }),
        el('td', { class: 'nowrap', text: prettyDate(q.quoteDate) }),
        el('td', { class: 'money', text: money(q.totalCost) }),
        el('td', {}, [el('span', { class: 'chip chip-' + q.status, text: statusLabel(q.status) })])
      ]);
    }));

    frag.appendChild(el('div', { class: 'table-wrap' }, [
      el('table', {}, [el('thead', {}, [head]), body])
    ]));
    frag.appendChild(footRow());
    return frag;
  }

  function footRow() {
    var total = quotes.reduce(function (sum, q) { return sum + num(q.totalCost); }, 0);
    return el('div', { class: 'table-foot' }, [
      el('span', { text: quotes.length + (quotes.length === 1 ? ' quote' : ' quotes') +
        (quotes.length ? ' · ' + money(total) + ' quoted' : '') }),
      el('button', {
        class: 'link-btn', type: 'button',
        onclick: function () {
          if (!confirm('Reset the mockup back to its sample quotes? Any quotes '
                       + 'you have created will be discarded.')) return;
          resetSamples(); go('register'); toast('Sample quotes restored');
        }
      }, ['Reset sample data'])
    ]);
  }

  // ---------------------------------------------------------------- form

  function blank() {
    return {
      id: null, client: '', sponsorAcronym: '', quoteName: '', preparedBy: CURRENT_REP,
      quoteDate: new Date().toISOString().slice(0, 10), status: 'draft', totalCost: '',
      specimenTypes: [], isExtension: false, hubspotDealName: '',
      cohorts: [{ name: '', subjects: '' }], notes: '', summary: '',
      nameEdited: false, summaryEdited: false,
      header: { validity: VALIDITY[0], serviceTypes: [] }
    };
  }

  function renderForm(id) {
    var existing = id ? quotes.filter(function (q) { return q.id === id; })[0] : null;
    var draft = existing ? JSON.parse(JSON.stringify(existing)) : blank();
    draft.header = draft.header || {};
    draft.header.serviceTypes = draft.header.serviceTypes || [];
    draft.specimenTypes = draft.specimenTypes || [];
    draft.cohorts = draft.cohorts || [];
    if (existing) { draft.nameEdited = true; draft.summaryEdited = true; }

    var frag = document.createDocumentFragment();
    var wrap = el('div', { class: 'form-wrap' });
    frag.appendChild(wrap);

    wrap.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { go('register'); } },
      ['← Quote register']));

    wrap.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { text: existing ? (existing.quoteName || 'Quote') : 'New quote' }),
        el('p', { class: 'sub', text: existing
          ? 'Change anything and save. Deleting cannot be undone.'
          : 'Fill in what you know — you can save a draft and come back.' })
      ])
    ]));

    var errorBox = el('div');
    wrap.appendChild(errorBox);

    // Quote name and quote number are the same thing — there is only one, and it
    // lives at the very end of the form. Nothing to refresh separately.
    function refreshNumber() {}

    // ---- field helper -------------------------------------------------
    var idc = 0;
    function field(label, opts) {
      opts = opts || {};
      var fid = 'f' + (++idc);
      var input;

      if (opts.type === 'select') {
        input = el('select', { id: fid, onchange: function () { opts.set(input.value); after(); } });
        opts.options.forEach(function (o) {
          var v = typeof o === 'string' ? o : o.value;
          var l = typeof o === 'string' ? o : o.label;
          input.appendChild(el('option', { value: v, text: l }));
        });
        input.value = opts.get();
      } else if (opts.type === 'textarea') {
        input = el('textarea', { id: fid, rows: opts.rows || 3, placeholder: opts.placeholder || '',
          oninput: function () { opts.set(input.value); after(); } });
        input.value = opts.get() || '';
      } else {
        input = el('input', { id: fid, type: opts.type || 'text', placeholder: opts.placeholder || '',
          inputmode: opts.inputmode || false,
          oninput: function () { opts.set(input.value); after(); },
          onblur: opts.onblur || null });
        input.value = opts.get() || '';
      }

      function after() { refreshNumber(); if (opts.then) opts.then(); }

      var lbl = el('label', { for: fid }, [label]);
      if (opts.required) lbl.appendChild(el('span', { class: 'req', text: ' *' }));
      if (opts.autofilled) lbl.appendChild(el('span', { class: 'autofilled', text: 'auto' }));

      var kids = [lbl, input];
      if (opts.hint) kids.push(el('div', { class: 'hint', text: opts.hint }));
      var box = el('div', { class: 'fld' + (opts.full ? ' full' : '') }, kids);
      box._input = input;
      return box;
    }

    function checkbox(label, get, set, onToggle) {
      var box = el('input', { type: 'checkbox', onchange: function () {
        set(box.checked); if (onToggle) onToggle();
      } });
      box.checked = !!get();
      return el('label', { class: 'check' }, [box, el('span', {}, [label])]);
    }

    // ---- section 01 ---------------------------------------------------
    var sec01 = el('section', { class: 'sec' });
    sec01.appendChild(secHead('01', 'Quote header'));

    var extBox = el('div');

    function applyStudy(study, via) {
      draft.client = study.client;
      draft.sponsorAcronym = study.acronym;
      // Deliberately not carried over — this quote is being written by whoever
      // is signed in now, not by the original study's author.
      draft.specimenTypes = (study.specimens || []).slice();
      draft.header.parentMtNumber = study.mt;
      draft.header.originalStudyQuote = draft.header.originalStudyQuote || study.quote;
      draft.header.originalStudyPo = draft.header.originalStudyPo || study.po;
      draft.header.sponsorContactName = study.contactName || '';
      draft.header.sponsorContactEmail = study.contactEmail || '';
      draft.header.perSubject = draft.header.perSubject || study.perSubject;
      draft.hubspotDealName = draft.hubspotDealName || study.dealName || '';
      draft.cohorts = (study.cohorts || []).map(function (c) {
        return { name: c.name, subjects: c.subjects, additionalSubjects: '' };
      });
      draft.header.matchedVia = via;
      draft.header.matchedStudy = study.quote;

      // Extension number continues this sponsor's own thread, never the
      // umbrella's — MT9920 alone carries 37 separate threads.
      var next = 1;
      quotes.forEach(function (q) {
        if (!q.isExtension) return;
        var h = q.header || {};
        if (h.parentMtNumber === study.mt && q.client === study.client) {
          var n = parseInt(h.extensionNumber, 10);
          if (!isNaN(n) && n >= next) next = n + 1;
        }
      });
      draft.header.extensionNumber = draft.header.extensionNumber || String(next);
    }

    // Waiting for blur meant a rep who typed all three fields and stopped saw
    // nothing happen. Run shortly after typing stops instead.
    var lookupTimer = null;
    function queueLookup() {
      clearTimeout(lookupTimer);
      lookupTimer = setTimeout(runLookup, 400);
    }

    function runLookup() {
      // The typed quote reference is tried first — it is the most specific thing
      // the rep has, and it is what they actually have to hand.
      var byRef = findStudyByQuoteRef(draft.header.originalStudyQuote, quotes);
      if (byRef) {
        if (byRef.quote) { applyParentQuote(byRef.quote, byRef.via); afterLookup(); return; }
        if (byRef.study) { applyStudy(byRef.study, byRef.via); draft.header.ambiguous = null; afterLookup(); return; }
        if (byRef.acronymOnly) {
          // Only the sponsor is recoverable — fill that and leave the rest alone.
          draft.client = draft.client || byRef.client;
          draft.sponsorAcronym = draft.sponsorAcronym || byRef.acronymOnly;
          draft.header.matchedVia = byRef.via + ' (sponsor only)';
          draft.header.matchedStudy = null;
          draft.header.ambiguous = null;
          draft.header.sponsorOnly = byRef.client;
          renderLookupResult(); renderBody(); refreshNumber();
          return;
        }
      }
      draft.header.sponsorOnly = null;

      var hit = findStudy(draft.header.originalStudyPo, draft.header.parentMtNumber);
      if (hit && hit.registerQuote) { applyParentQuote(hit.registerQuote, hit.via); afterLookup(); return; }
      if (hit && hit.study) {
        applyStudy(hit.study, hit.via);
        draft.header.ambiguous = null;
        if (extFields) {
          extFields.mt._input.value = draft.header.parentMtNumber || '';
          extFields.extNo._input.value = draft.header.extensionNumber || '';
          extFields.quote._input.value = draft.header.originalStudyQuote || '';
          extFields.po._input.value = draft.header.originalStudyPo || '';
        }
      } else {
        draft.header.matchedVia = null;
        draft.header.matchedStudy = null;
        draft.header.ambiguous = (hit && hit.ambiguous) ? hit : null;
      }
      afterLookup();
    }

    function afterLookup() {
      if (extFields) {
        extFields.mt._input.value = draft.header.parentMtNumber || '';
        extFields.extNo._input.value = draft.header.extensionNumber || '';
        extFields.po._input.value = draft.header.originalStudyPo || '';
      }
      renderLookupResult();
      renderBody();
      refreshNumber();
    }

    /** A parent already in the register carries everything we need. */
    function applyParentQuote(q, via) {
      applyStudy({
        client: q.client, acronym: q.sponsorAcronym, preparedBy: q.preparedBy,
        specimens: q.specimenTypes || [], mt: q.mtNumber || (q.header || {}).parentMtNumber || '',
        quote: q.quoteNumber, po: (q.header || {}).originalStudyPo || '',
        contactName: (q.header || {}).sponsorContactName || '',
        contactEmail: (q.header || {}).sponsorContactEmail || '',
        perSubject: parentPerSubject(q),
        dealName: q.hubspotDealName || '',
        cohorts: q.cohorts || []
      }, via);
      draft.header.ambiguous = null;
    }

    // The extension fields are built once and kept. A lookup updates their
    // values and swaps only the result banner — rebuilding the whole block on
    // blur destroyed the input the rep was typing into, which lost keystrokes
    // and left stale results on screen.
    var extFields = null;
    var lookupBox = el('div');

    function buildExtFields() {
      var quoteFld = field('Original study quote', { full: true,
        placeholder: 'QTE NTA20260826 Pan-cancer - blood',
        hint: 'Free text — type or paste the reference. It fills the study in on its own; the PO or MT number below does the same. OneDrive becomes the real source for this.',
        get: function () { return draft.header.originalStudyQuote; },
        set: function (v) { draft.header.originalStudyQuote = v; },
        then: queueLookup, onblur: runLookup });

      var poFld = field('Original study PO #', {
        placeholder: 'PO-88214',
        hint: 'Blank if the sponsor has not issued one yet.',
        get: function () { return draft.header.originalStudyPo; },
        set: function (v) { draft.header.originalStudyPo = v; },
        then: queueLookup, onblur: runLookup });

      var mtFld = field('Parent MT number', { placeholder: 'MT2291',
        get: function () { return draft.header.parentMtNumber; },
        set: function (v) { draft.header.parentMtNumber = v.toUpperCase(); },
        then: queueLookup, onblur: runLookup });

      var extNoFld = field('Extension #', { placeholder: '1',
        get: function () { return draft.header.extensionNumber; },
        set: function (v) { draft.header.extensionNumber = v; } });

      var changed = checkbox('The study design has changed',
        function () { return draft.header.designChanged !== false; },
        function (v) { draft.header.designChanged = v; },
        function () { renderBody(); renderHelp(); });
      changed.style.marginTop = '15px';

      var help = el('div', { class: 'hint' });
      function renderHelp() {
        help.textContent = draft.header.designChanged === false
          ? 'Design unchanged — the form collapses to what actually differs, and the quote generates in the short extension format.'
          : 'Uncheck this when the study design is unchanged and only the subject count grows.';
      }
      renderHelp();

      extFields = {
        quote: quoteFld, po: poFld, mt: mtFld, extNo: extNoFld,
        box: el('div', { class: 'toggle-box' }, [
          el('div', { class: 'grid' }, [quoteFld, poFld, mtFld, extNoFld]),
          changed, help
        ])
      };
    }

    function renderExtBox() {
      extBox.replaceChildren();
      if (!draft.isExtension) { extFields = null; return; }
      if (!extFields) buildExtFields();
      extBox.appendChild(extFields.box);
      extBox.appendChild(lookupBox);
      renderLookupResult();
    }

    function renderLookupResult() {
      lookupBox.replaceChildren();

      if (draft.header.matchedStudy) {
        lookupBox.appendChild(el('div', { class: 'carried' }, [
          el('div', { class: 'carried-head' }, [
            'Found via ' + draft.header.matchedVia,
            el('span', { class: 'autofilled', text: 'auto-filled' })
          ]),
          el('dl', { class: 'carried-list' }, [
            el('dt', { text: 'Study' }), el('dd', { text: draft.header.matchedStudy }),
            el('dt', { text: 'Client' }), el('dd', { text: draft.client || '—' }),
            el('dt', { text: 'Specimens' }),
            el('dd', { text: (draft.specimenTypes || []).join(', ') || '—' })
          ]),
          el('div', { class: 'hint', text: 'Everything it filled in stays editable below.' })
        ]));
        return;
      }

      var a = draft.header.ambiguous;
      if (a) {

            },

    function sectionApproach() {

        body.replaceChildren();

          radio('approach', 'Defined subject count', !byDollar, function () {

          radio('approach', 'Defined dollar amount', byDollar, function () {
            draft.approach = 'dollar'; paint(); })
        ]);
        body.appendChild(radios);
        if (!byDollar) {
          body.appendChild(el('div', { class: 'hint',
            text: 'Subject counts come from the cohorts below.' }));
          return;
        }

        draft.caseTypes = draft.caseTypes || [{ label: '', price: '' }];
        body.appendChild(el('div', { class: 'grid' }, [
          field('PO total', { placeholder: '500000.00', inputmode: 'decimal',

        ]));

        var rows = el('div', { class: 'cohorts' });
        var estimate = el('div', { class: 'calc' });

        function recalcEstimate() {
          var po = num(draft.poTotal);
          var highest = draft.caseTypes.reduce(function (m, c) {
            return Math.max(m, num(c.price)); }, 0);
          estimate.replaceChildren();
          estimate.appendChild(el('div', { class: 'calc-row' }, [
            el('span', { text: 'PO total' }),
            el('span', { class: 'v', text: money(po) })]));
          estimate.appendChild(el('div', { class: 'calc-row' }, [
            el('span', { text: 'Highest case price' }),
            el('span', { class: 'v', text: highest ? money(highest) : '—' })]));
          estimate.appendChild(el('div', { class: 'calc-row calc-total' }, [
            el('span', { text: 'Estimated subjects' }),
            el('span', { class: 'v', text: highest ? String(Math.floor(po / highest)) : '—' })]));
        }

        function paintRows() {
          rows.replaceChildren();
          rows.appendChild(el('div', { class: 'cohort-row full cohort-head' }, [
            el('span', { text: 'Tumor / case type' }),
            el('span', { class: 'ca', text: '$ per case' }), el('span', {})]));

            var lab = el('input', { type: 'text', value: c.label || '',
              'aria-label': 'Case type ' + (i + 1),

            lab.value = c.label || '';
            var pr = el('input', { type: 'text', inputmode: 'decimal',
              'aria-label': 'Price per case for ' + (c.label || 'case type ' + (i + 1)),
              oninput: function () { draft.caseTypes[i].price = pr.value; recalcEstimate(); } });
            pr.value = c.price || '';
            var x = el('button', { class: 'row-x', type: 'button',
              'aria-label': 'Remove case type ' + (i + 1),
              onclick: function () { draft.caseTypes.splice(i, 1); paintRows(); recalcEstimate(); } }, ['×']);
            rows.appendChild(el('div', { class: 'cohort-row full' },
              [lab, el('span', { class: 'ca' }, [pr]), x]));
          });
        }
        paintRows();
        body.appendChild(rows);
        body.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
          draft.caseTypes.push({ label: '', price: '' }); paintRows();
        } }, ['+ Add case type']));

        body.appendChild(checkbox('Matched blood add-on',
          function () { return draft.matchedBlood; },
          function (v) { draft.matchedBlood = v; }));

        body.appendChild(estimate);

        body.appendChild(el('div', { class: 'hint',
          text: 'Estimate uses the highest case price, not an average — the mix is unknown, so this stays conservative. Do not attribute counts to specific types here.' }));
      }
      paint();
      sec.appendChild(body);
      return sec;
    }

    // ---- 07 clinical data -----------------------------------------------

    function sectionClinicalData() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('07', 'Clinical data'));

      var cd = draft.clinicalData;

      var grid = el('div', { class: 'spec-cols', style: 'grid-template-columns:1fr 1fr' });
      function inList(list, item) { return list.indexOf(item) > -1; }
      function toggle(list, other, item, on) {
        var i = list.indexOf(item);
        if (on && i === -1) list.push(item);
        if (!on && i > -1) list.splice(i, 1);
        var j = other.indexOf(item);            // checking one clears the other
        if (on && j > -1) other.splice(j, 1);
      }

      function paint() {
        grid.replaceChildren();
        [['Required', cd.required, cd.ifAvailable], ['If available', cd.ifAvailable, cd.required]]

              el('div', { class: 'spec-col-title', text: col[0] })
            ].concat(CLINICAL_DATA_CATEGORIES.map(function (c) {
              return checkbox(c,
                function () { return inList(col[1], c); },
                function (on) { toggle(col[1], col[2], c, on); },
                paint);
            }))));
          });
      }
      paint();
      sec.appendChild(grid);

      ]));

      sec.appendChild(field('Timeframe blackouts', { full: true,
        placeholder: 'e.g. no subjects in January; lab closed 20 Dec – 2 Jan',
