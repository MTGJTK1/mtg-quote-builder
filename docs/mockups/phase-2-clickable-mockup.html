        batchBox.appendChild(field('Delivery batching', { type: 'select', options: opts,
          hint: canSplit
            ? 'Enrollment runs ' + months + ' months or more, so a midpoint batch is available.'
            : 'Under three months of enrollment, so a single end-of-study batch is the only option.',
          get: function () { return opts.indexOf(tl.batching) > -1 ? tl.batching : opts[0]; },
          set: function (v) { tl.batching = v; },
          then: function () {
            if (shippingRefresh) shippingRefresh();
            if (pricingRefresh) pricingRefresh();
          } }));
      }

      sec.appendChild(el('div', { class: 'grid' }, [
        field('Study initiation', { placeholder: 'e.g. 3-4 weeks from PO',
          get: function () { return tl.initiation; }, set: function (v) { tl.initiation = v; } }),
        field('Enrollment completion', { placeholder: 'e.g. 6-9 months',
          hint: 'Free text so ranges work. This range guides the batching plan below.',
          get: function () { return tl.enrollmentCompletion; },
          set: function (v) { tl.enrollmentCompletion = v; }, then: paintBatching }),
        field('Data / specimen delivery', { placeholder: 'e.g. within 30 days of collection',
          get: function () { return tl.delivery; }, set: function (v) { tl.delivery = v; } }),
        field('Maximum subjects delivered per day', { placeholder: 'e.g. 4, or leave blank for no cap',
          inputmode: 'numeric',
          hint: 'A site enrolling in bursts can overrun a downstream processing limit nobody stated.',
          get: function () { return tl.maxPerDay; }, set: function (v) { tl.maxPerDay = v; } }),
        field('Days fresh cases can be received', { placeholder: 'e.g. Mon-Fri, or any day incl. weekends',
          hint: 'Fresh collection is surgery-driven and surgery does not stop for weekends. A weekday-only receiver silently loses eligible cases.',
          get: function () { return tl.receivingDays; }, set: function (v) { tl.receivingDays = v; } })
      ]));

      sec.appendChild(field('Timeframe blackouts', { full: true,
        placeholder: 'e.g. no subjects in January; lab closed 20 Dec – 2 Jan',
        hint: 'An unstated blackout makes every enrollment projection wrong.',
        get: function () { return tl.blackouts; }, set: function (v) { tl.blackouts = v; } }));

      sec.appendChild(batchBox);
      paintBatching();
      return sec;
    }

    // ---- 03 population & cohorts (full quote) ---------------------------

    function sectionPopulation() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('03', 'Population & cohorts'));

      // Sponsor-selected cases belong with the population, not the header — the
      // sponsor has already decided who is in the study, and the cohorts below
      // describe what they picked.
      var h = draft.header;
      var casesBox = el('div');

      function paintCases() {
        casesBox.replaceChildren();
        casesToggle.style.display =
          h.serviceTypes.indexOf('Retrospective') > -1 ? '' : 'none';
        if (h.serviceTypes.indexOf('Retrospective') === -1 || !h.sponsorSelected) return;

        var byDoc = h.sponsorCasesMode === 'document';
        casesBox.appendChild(el('div', { class: 'check-row' }, [
          radio('cases', 'List the biospecimens here', !byDoc, function () {
            h.sponsorCasesMode = 'list'; paintCases(); }),
          radio('cases', 'Name the document that lists them', byDoc, function () {
            h.sponsorCasesMode = 'document'; paintCases(); })
        ]));

        if (byDoc) {
          casesBox.appendChild(field('Document name', { full: true,
            placeholder: 'e.g. Case list GHI-2026-08 (142 cases)',
            hint: 'Named in the quote so both sides agree which list was priced.',
            get: function () { return h.sponsorCasesDoc; },
            set: function (v) { h.sponsorCasesDoc = v; } }));
        } else {
          casesBox.appendChild(field('Case or biospecimen numbers', {
            type: 'textarea', rows: 3, full: true,
            placeholder: 'One per line',
            hint: CRITERIA_HINT,
            get: function () { return h.sponsorSelectedCases; },
            set: function (v) { h.sponsorSelectedCases = v; } }));
        }
      }

      sec.appendChild(field('Collection protocol document', { full: true,
        placeholder: 'e.g. CRC and healthy collections_ Kit insert',
        hint: 'Where the collection instructions live, if a document carries them.',
        get: function () { return draft.collectionDoc; },
        set: function (v) { draft.collectionDoc = v; } }));

      var casesToggle = checkbox('The sponsor has selected the cases',
        function () { return h.sponsorSelected; },
        function (on) { h.sponsorSelected = on; paintCards(); },
        function () { paintCases(); paintCards(); });
      sec.appendChild(casesToggle);
      sec.appendChild(casesBox);
      casesRefresh = paintCases;
      paintCases();

      draft.cohorts = draft.cohorts || [];
      var cards = el('div');
      // Declared before paintCards() runs — it calls paintAllocation().
      var allocBox = el('div');

      function paintCards() {
        cards.replaceChildren();
        draft.cohorts.forEach(function (c, i) { cards.appendChild(cohortCard(c, i)); });
        // Allocation note appears only once there is more than one cohort.
        paintAllocation();
        refreshDrafts();
      }

      /** With the cases already chosen, there is no population to describe and
       *  no subjects to count — there are units, and the criteria that make a
       *  unit acceptable. */
      function casesPicked() {
        return draft.header.serviceTypes.indexOf('Retrospective') > -1
            && !!draft.header.sponsorSelected;
      }

      function cohortCard(c, i) {
        c.subcohorts = c.subcohorts || [];

        var card = el('div', { class: 'toggle-box' });
        var head = el('div', { class: 'cohort-card-head' }, [
          el('span', { class: 'sec-num', text: String(i + 1) }),
          el('span', { class: 'cohort-card-title', text: c.name || 'Untitled cohort' })
        ]);
        if (draft.cohorts.length > 1) {
          head.appendChild(el('button', { class: 'row-x', type: 'button',
            'aria-label': 'Remove cohort ' + (i + 1),
            onclick: function () { draft.cohorts.splice(i, 1); paintCards(); } }, ['×']));
        }
        card.appendChild(head);

        var autoSummed = c.subcohorts.length > 0;

        function subjHint(summed) {
          return summed ? 'Summed from the subcohorts below \u2014 edit them instead.'
                        : 'Or add subcohorts below and this adds itself up.';
        }
        var subjFld = field('# subjects', {
          inputmode: 'numeric',
          hint: subjHint(autoSummed),
          get: function () { return autoSummed ? String(cohortSubjects(c)) : c.subjects; },
          set: function (v) { if (!autoSummed) c.subjects = v; },
          then: function () { refreshDrafts(); if (pricingRefresh) pricingRefresh(); } });
        if (autoSummed) {
          subjFld._input.disabled = true;
          subjFld._input.value = String(cohortSubjects(c));
        }

        // "Up to this number" and "this is an estimate" were two checkboxes
        // hedging one number, and nothing stopped a rep ticking both. One
        // control, three states, and it is the wording the quote prints — the
        // pan-cancer quote totals its negative-bladder cohort as
        // "estimating 7 cases".
        var countBasis = field('This count is', { type: 'select',
          options: ['exact', 'a maximum — up to this number', 'an estimate'],
          get: function () {
            if (c.upTo) return 'a maximum — up to this number';
            if (c.estimated) return 'an estimate';
            return 'exact';
          },
          set: function (v) {
            c.upTo = v.indexOf('maximum') > -1;
            c.estimated = v === 'an estimate';
          },
          then: function () { refreshDrafts(); if (pricingRefresh) pricingRefresh(); } });

        var top;
        if (casesPicked()) {
          top = el('div', { class: 'grid' }, [
            field('# units', { placeholder: 'e.g. 140 blocks, 300 mL, 60 slides',
              get: function () { return c.units; },
              set: function (v) { c.units = v; },
              then: function () { refreshDrafts(); if (pricingRefresh) pricingRefresh(); } })
          ]);
        } else {
          top = el('div', { class: 'grid' }, [
            field('Cohort description', { placeholder: 'e.g. Colorectal cancer',
              hint: 'Just the description — "Cohort 1" is added for you.',
              get: function () { return c.name; },
              set: function (v) {
                c.name = cleanCohortName(v);
                head.children[1].textContent = c.name || 'Untitled cohort';
              },
              then: function () { refreshDrafts();
                                  if (shippingRefresh) shippingRefresh();
                                  if (pricingRefresh) pricingRefresh(); } }),
            subjFld, countBasis
          ]);
        }
        card.appendChild(top);

        // "Up to this number" and "this is an estimate" were two checkboxes
        // hedging one number, and nothing stopped a rep ticking both. One
        // control, three states, and the wording the quote prints.
        // Population group, subpopulation and severity used to sit here, lifted
        // from HubSpot's `population_2` and `sub_population` enums. Removed on
        // rep review: a cohort is described in free text, and the I/E criteria
        // below already carry severity and stage with the precision a checkbox
        // list cannot. Same lesson as the feasibility form's naive/treated
        // dropdown — structure that captures a fraction while implying it
        // captured everything. If HubSpot's fields ever need writing back, that
        // is one dropdown on the quote, not five controls on every cohort.

        // Criteria belong to the cohort, not the study — a cancer cohort and its
        // healthy controls do not share them.
        card.appendChild(field('Inclusion criteria', { type: 'textarea', rows: 4, full: true,
          placeholder: casesPicked()
            ? 'Block age \u2264 5 years, fully consented, \u2026'
            : 'Where you are collecting, any lab-value gate (which assay, how recent a result counts), treatment status.',
          hint: CRITERIA_HINT,
          get: function () { return c.inclusion; }, set: function (v) { c.inclusion = v; } }));
        card.appendChild(field('Exclusion criteria', { type: 'textarea', rows: 4, full: true,
          placeholder: casesPicked()
            ? 'Decalcified blocks, prior neoadjuvant therapy, \u2026'
            : 'Name excluded therapies individually, and say whether any become acceptable after a washout — and how long.',
          hint: CRITERIA_HINT,
          get: function () { return c.exclusion; }, set: function (v) { c.exclusion = v; } }));

        // --- subcohorts
        var scBox = el('div');
        function paintSub() {
          scBox.replaceChildren();
          if (!c.subcohorts.length) return;
          var rows = el('div', { class: 'cohorts' });
          rows.appendChild(el('div', { class: 'cohort-row ext cohort-head' }, [
            el('span', { text: 'Subcohort' }),
            el('span', { class: 'ca', text: casesPicked() ? '# units' : '# subjects' }),
            el('span', {}), el('span', {}), el('span', {})]));
          c.subcohorts.forEach(function (sc, j) {
            var label = (i + 1) + String.fromCharCode(97 + j);
            var noteIn = el('input', { type: 'text',
              'aria-label': 'Subcohort ' + label + ' description',
              placeholder: 'What distinguishes this subcohort',
              oninput: function () { sc.note = noteIn.value; refreshDrafts(); } });
            noteIn.value = sc.note || '';
            var nIn = el('input', { type: 'text',
              inputmode: casesPicked() ? 'text' : 'numeric',
              placeholder: casesPicked() ? 'e.g. 60 blocks' : '',
              'aria-label': (casesPicked() ? 'Units' : 'Subjects') + ' for subcohort ' + label,
              oninput: function () {
                sc.subjects = nIn.value;
                subjFld._input.value = String(cohortSubjects(c));
                refreshDrafts();
                if (shippingRefresh) shippingRefresh();
                if (pricingRefresh) pricingRefresh();
              } });
            nIn.value = sc.subjects == null ? '' : String(sc.subjects);
            var x = el('button', { class: 'row-x', type: 'button',
              'aria-label': 'Remove subcohort ' + label,
              onclick: function () {
                c.subcohorts.splice(j, 1); paintSub();
                subjFld._input.disabled = c.subcohorts.length > 0;
                subjFld._input.value = c.subcohorts.length ? String(cohortSubjects(c)) : (c.subjects || '');
                if (subjFld._hint) subjFld._hint.textContent = subjHint(c.subcohorts.length > 0);
                refreshDrafts();
              } }, ['×']);
            rows.appendChild(el('div', { class: 'cohort-row ext' }, [
              el('span', { class: 'sub-label' }, [label]), el('span', { class: 'ca' }, [nIn]),
              noteIn, el('span', {}), x]));
            rows.appendChild(subcohortCriteria(sc, label));
          });
          scBox.appendChild(rows);
        }
        paintSub();
        card.appendChild(scBox);
        card.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
          c.subcohorts.push({ subjects: '', note: '' });
          paintSub();
          subjFld._input.disabled = true;
          subjFld._input.value = String(cohortSubjects(c));
          if (subjFld._hint) subjFld._hint.textContent = subjHint(true);
          refreshDrafts();
        } }, ['+ Add subcohort']));

        return card;
      }

      paintCards();
      sec.appendChild(cards);
      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.cohorts.push({ name: '', subjects: '', subcohorts: [] });
        paintCards();
      } }, ['+ Add cohort']));

      function paintAllocation() {
        allocBox.replaceChildren();
        if (draft.cohorts.length <= 1) return;
        allocBox.appendChild(field('Allocation note', { type: 'textarea', rows: 2, full: true,
          placeholder: 'e.g. MT Group and the sponsor will mutually agree in writing on enrollment allocations per cancer type',
          get: function () { return draft.allocationNote; },
          set: function (v) { draft.allocationNote = v; } }));
      }
      sec.appendChild(allocBox);
      paintAllocation();

      return sec;
    }

    function pickedSpecimens() { return orderedSpecimens(draft); }

    /** Criteria that belong to a subcohort rather than its parent. Only the
     *  differences go here — the cohort's own criteria still apply. */
    function subcohortCriteria(sc, label) {
      var box = el('div', { class: 'sub-criteria' });
      box.appendChild(field('Inclusion criteria \u2014 subcohort ' + label, {
        type: 'textarea', rows: 2, full: true,
        placeholder: 'Only what differs from the cohort above',
        hint: CRITERIA_HINT,
        get: function () { return sc.inclusion; },
        set: function (v) { sc.inclusion = v; } }));
      box.appendChild(field('Exclusion criteria \u2014 subcohort ' + label, {
        type: 'textarea', rows: 2, full: true,
        placeholder: 'Only what differs from the cohort above',
        hint: CRITERIA_HINT,
        get: function () { return sc.exclusion; },
        set: function (v) { sc.exclusion = v; } }));
      return box;
    }



    function chunk(arr, n) {
      var per = Math.ceil(arr.length / n), out = [];
      for (var i = 0; i < arr.length; i += per) out.push(arr.slice(i, i + per));
      return out;
    }

    // ---- 05 biospecimens ----------------------------------------------

    function sectionSpecimens() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('05', 'Biospecimens'));

      draft.specimenDetail = draft.specimenDetail || {};
      var detailBox = el('div');

      // Prefill from SPECIMEN_SPEC the first time a type is ticked, so the rep
      // confirms a standard rather than typing one out.
      function detailFor(t) {
        var spec = SPECIMEN_SPEC[t] || SPECIMEN_SPEC['Other'];
        var d = draft.specimenDetail[t];
        if (!d) {
          d = draft.specimenDetail[t] = {
            amount: '', aliquots: '', holder: spec.holder,
            store: spec.store, ship: spec.ship, processing: '',
            atTimepoints: null,  // null = every timepoint
            byTubes: !!spec.tubes, tubeCount: '', tubes: [],
            media: '', freeform: ''
          };
        }
        return d;
      }

      function paintDetail() {
        detailBox.replaceChildren();
        var picked = pickedSpecimens();
        if (!picked.length) {
          detailBox.appendChild(emptyNote(
            'Tick the specimens above and each one gets a block here for volume, '
            + 'container, storage and processing.'));
          return;
        }
        picked.forEach(function (t, i) {
          detailBox.appendChild(specimenCard(t, i));
        });
      }

      function specimenCard(t, i) {
        var spec = SPECIMEN_SPEC[t] || SPECIMEN_SPEC['Other'];
        var d = detailFor(t);
        var card = el('div', { class: 'toggle-box' });
        var head = el('div', { class: 'cohort-card-head' }, [
          el('span', { class: 'sec-num', text: String(i + 1) }),
          el('span', { class: 'cohort-card-title', text: t })
        ]);
        // What the quote will say about shipping this type. Fixed, so it is
        // shown rather than asked — the rep can see nothing has been lost.
        if (spec.says) {
          head.appendChild(el('span', { class: 'says', text: spec.says }));
        }
        card.appendChild(head);

        // --- one box, everything in it
        if (spec.freeform) {
          card.appendChild(field(spec.freeformLabel, { type: 'textarea', rows: 2, full: true,
            placeholder: spec.freeformHint,
            get: function () { return d.freeform; },
            set: function (v) { d.freeform = v; } }));
          card.appendChild(timepointPicker(d, t));
          return card;
        }

        var rows = [];

        // --- drawn into tubes: each tube is its own small block
        if (spec.tubes && d.byTubes) {
          rows.push(field('Tubes per subject', { placeholder: 'e.g. 3',
            inputmode: 'numeric',
            get: function () { return d.tubeCount; },
            set: function (v) { d.tubeCount = v; }, then: paintDetail }));
        } else if (spec.tubes) {
          rows.push(field('Volume per subject', { placeholder: 'e.g. 8-10 mL',
            hint: 'A range is fine \u2014 tubes do not always fill.',
            get: function () { return d.amount; },
            set: function (v) { d.amount = v; } }));
          // Whole blood is never aliquoted; the frozen products often are.
          if (spec.aliquoted) {
            rows.push(field('Aliquots per subject', { placeholder: 'Leave blank if not aliquoted',
              inputmode: 'numeric',
              get: function () { return d.aliquots; },
              set: function (v) { d.aliquots = v; } }));
          }
        } else if (spec.amount) {
          rows.push(field(spec.amount.label, { placeholder: spec.amount.hint,
            get: function () { return d.amount; },
            set: function (v) { d.amount = v; } }));
          if (spec.aliquoted) {
            rows.push(field('Aliquots per subject', { placeholder: 'Leave blank if not aliquoted',
              inputmode: 'numeric',
              get: function () { return d.aliquots; },
              set: function (v) { d.aliquots = v; } }));
          }
        }

        if (spec.media) {
          rows.push(field('Media', { placeholder: 'e.g. OCT, RNAlater, Hypothermosol',
            get: function () { return d.media; },
            set: function (v) { d.media = v; } }));
        }

        if (rows.length) card.appendChild(el('div', { class: 'grid' }, rows));

        if (spec.tubes) {
          card.appendChild(checkbox('Describe by tube count rather than volume',
            function () { return d.byTubes; },
            function (on) { d.byTubes = on; },
            paintDetail));
        }

        // --- one block per tube: type, size, and how it is handled
        if (spec.tubes && d.byTubes) {
          var n = Math.max(0, Math.min(12, parseInt(d.tubeCount, 10) || 0));
          d.tubes = d.tubes || [];
          while (d.tubes.length < n) d.tubes.push({ type: '', size: '', processing: '' });
          var tubeBox = el('div', { class: 'tubes' });
          for (var k = 0; k < n; k++) {
            (function (tube, k) {
              var row = el('div', { class: 'tube-row' });
              row.appendChild(el('span', { class: 'sub-label', text: 'Tube ' + (k + 1) }));
              row.appendChild(el('div', { class: 'grid' }, [
                field('Tube type', { placeholder: 'e.g. EDTA (K2)',
                  get: function () { return tube.type; },
                  set: function (v) { tube.type = v; } }),
                field('Tube size', { placeholder: 'e.g. 10 mL',
                  get: function () { return tube.size; },
                  set: function (v) { tube.size = v; } }),
                field('Processing instructions', { type: 'textarea', rows: 2, full: true,
                  placeholder: 'Double-spin, aliquoting, time to process\u2026',
                  hint: k === 0 ? 'Non-standard processing is one of the most common reasons '
                                + 'a site declines.' : '',
                  get: function () { return tube.processing; },
                  set: function (v) { tube.processing = v; }, then: refreshDrafts })
              ]));
              tubeBox.appendChild(row);
            })(d.tubes[k], k);
          }
          if (n) card.appendChild(tubeBox);
        }

        card.appendChild(timepointPicker(d, t));

        if (spec.process) {
          card.appendChild(field('Additional processing requirements', {
            type: 'textarea', rows: 2, full: true,
            placeholder: 'e.g. sterile collection, time-to-ship limit, on-site aliquoting',
            hint: 'Non-standard processing is one of the most common reasons a site '
                + 'declines. Say it here rather than assuming the site will ask.',
            get: function () { return d.processing; },
            set: function (v) { d.processing = v; },
            then: refreshDrafts }));
        }
        return card;
      }

      /** Which timepoints this specimen is collected at. Only worth asking once
       *  there is more than one. */
      function timepointPicker(d, t) {
        var box = el('div');
        var tps = timepointNames();
        if (tps.length < 2) return box;
        var fs = el('fieldset', {}, [el('legend', { text: 'Collected at' })]);
        fs.appendChild(el('div', { class: 'check-row' }, tps.map(function (name) {
          return checkbox(name,
            function () { return collectedAt(d, name, tps); },
            function (on) {
              var list = d.atTimepoints ? d.atTimepoints.slice() : tps.slice();
              var k = list.indexOf(name);
              if (on && k === -1) list.push(name);
              if (!on && k > -1) list.splice(k, 1);
              d.atTimepoints = list;
            },
            function () { paintDetail(); if (pricingRefresh) pricingRefresh(); });
        })));
        var n = collectionCount(d, tps);
        fs.appendChild(el('div', { class: 'hint', text: n === tps.length
          ? 'Every timepoint \u2014 ' + n + ' collections per subject.'
          : n + (n === 1 ? ' collection' : ' collections') + ' per subject, of ' + tps.length + '.' }));
        box.appendChild(fs);
        return box;
      }

      // Three parallel columns, unlabelled — the grouping is only there to keep
      // the list short, not to tell the rep anything.
      sec.appendChild(el('div', { class: 'spec-cols' }, SPECIMEN_GROUPS.map(function (g) {
        return el('div', { class: 'spec-col' }, [].concat(g.items.map(function (t) {
          return checkbox(t,
            function () { return draft.specimenTypes.indexOf(t) > -1; },
            function (on) {
              var i = draft.specimenTypes.indexOf(t);
              if (on && i === -1) draft.specimenTypes.push(t);
              if (!on && i > -1) draft.specimenTypes.splice(i, 1);
            },
            function () { refreshDrafts(); paintDetail();
                          if (pricingRefresh) pricingRefresh(); });
        })));
      })));

      if ((draft.cohorts || []).length > 1) {
        sec.appendChild(field('Where this differs by cohort', { type: 'textarea', rows: 2, full: true,
          placeholder: 'e.g. Cohort 1: one or two stools per subject. Cohort 2: two stools, '
                     + 'the second one to two days after the first.',
          hint: 'Leave blank when every cohort is collected the same way.',
          get: function () { return draft.specimensByCohort; },
          set: function (v) { draft.specimensByCohort = v; } }));
      }

      sec.appendChild(field('Provided by the sponsor', { full: true,
        placeholder: 'e.g. Streck tubes, collection kits, shipping boxes and labels',
        hint: 'Named in four of five real quotes, and it gates the timeline — '
            + 'one study starts only once the tubes arrive.',
        get: function () { return draft.sponsorProvides; },
        set: function (v) { draft.sponsorProvides = v; } }));

      sec.appendChild(field('Processing protocol document', { full: true,
        placeholder: 'e.g. Plasma Isolations for Vendor (5).doc',
        hint: 'Named in the quote, so both sides are working to the same file.',
        get: function () { return draft.processingDoc; },
        set: function (v) { draft.processingDoc = v; } }));

      sec.appendChild(detailBox);
      specimensRefresh = paintDetail;
      paintDetail();
      return sec;
    }

    // ---- 10 pricing ----------------------------------------------------
    // Numbering follows §05's specimen order (spec: "pricing blocks in §10 are
    // numbered to match the specimen order in §05").


    // ---- shipping ------------------------------------------------------
    // Its own section as of the fifth rep review: shipping is priced per leg,
    // and a leg's cost depends on where it is going. Rates prompt with MT
    // Group's own numbers and every one of them is editable.

    var DEFAULT_LEGS = [
      { label: 'Site(s) to MTG leg', dest: '', intl: false, count: '', rate: '' },
      { label: 'MTG to sponsor leg', dest: '', intl: false, count: '', rate: '',
        toSponsor: true }
    ];

    /** Batches out to the sponsor, as chosen in §09. The link existed before
     *  shipping became its own section and was lost in that move. */
    function batchCount() {
      return /2 batches/.test((draft.timeline || {}).batching || '') ? 2 : 1;
    }

    function shipState() {
      var sh = draft.shipping = draft.shipping || {};
      if (!sh.legs) {
        sh.legs = DEFAULT_LEGS.map(function (l) { return Object.assign({}, l); });
      }
      if (sh.usRate == null)   sh.usRate = '300';
      if (sh.intlRate == null) sh.intlRate = '3000';
      if (sh.markup == null)   sh.markup = '2';
      if (sh.mode == null)     sh.mode = 'lump';
      return sh;
    }

    /** A blank leg rate means "use the standard for that destination", so the
     *  rep types only the ones that differ. */
    /** A sponsor leg with no count typed follows §09's batching. */
    function legCount(sh, leg) {
      var typed = String(leg.count == null ? '' : leg.count).trim();
      if (typed !== '') return num(typed);
      return leg.toSponsor ? batchCount() : 0;
    }

    function legRate(sh, leg) {
      var typed = String(leg.rate == null ? '' : leg.rate).trim();
      if (typed !== '') return num(typed);
      return num(legIsIntl(sh, leg) ? sh.intlRate : sh.usRate);
    }

    /** The sponsor leg cannot be international once the quote undertakes that
     *  the destination is US-based — that is the whole point of the sentence. */
    function legIsIntl(sh, leg) {
      if (leg.toSponsor && sh.usDestination) return false;
      return !!leg.intl;
    }

    /** The sentence that goes in the quote. Named so there is no argument later
     *  about where the specimens were going. */
    function usDestinationSentence() {
      var who = String(draft.client || '').trim() || 'the sponsor';
      return 'Shipped to a US-based destination designated by ' + who + '.';
    }

    function shippingCost() {
      var sh = shipState();
      return sh.legs.reduce(function (t, leg) {
        return t + legCount(sh, leg) * legRate(sh, leg);
      }, 0);
    }

    function shippingCalculated() {
      var sh = shipState();
      return shippingCost() * (num(sh.markup) || 1);
    }

    /** Extra subjects on an extension cohort. Subcohorts win when present — the
     *  cohort row then shows their sum rather than a number of its own. */
    function extAdditional(c) {
      if (c.subcohorts && c.subcohorts.length) {
        return c.subcohorts.reduce(function (t, sc) {
          return t + num(sc.additionalSubjects); }, 0);
      }
      return num(c.additionalSubjects);
    }

    function quoteSubjects() {
      if (isMinimal()) {
        return (draft.cohorts || []).reduce(function (t, c) {
          return t + extAdditional(c); }, 0);
      }
      return (draft.cohorts || []).reduce(function (t, c) {
        if (c.subcohorts && c.subcohorts.length) {
          return t + c.subcohorts.reduce(function (u, sc) { return u + num(sc.subjects); }, 0);
        }
        return t + num(c.subjects);
      }, 0);
    }

    /** What the sponsor is charged for shipping, whichever way it is quoted.
     *  Per-subject quotes reconcile back to a total so the invoice adds up. */
    function shippingTotal() {
      var sh = shipState();
      var typed = String(sh.override == null ? '' : sh.override).trim();
      if (sh.mode === 'perSubject') {
        var per = typed !== '' ? num(typed) : shippingPerSubject();
        return per * quoteSubjects();
      }
      return typed !== '' ? num(typed) : shippingCalculated();
    }

    function shippingPerSubject() {
      var n = quoteSubjects();
      return n ? shippingCalculated() / n : 0;
    }


    function sectionShipping() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('10', 'Shipping'));

      var sh = shipState();
      var legsBox = el('div');
      var calcOut = el('div', { class: 'calc' });
      var modeBox = el('div');

      function refresh() {
        paintLegs(); paintCalc(); paintMode();
        if (pricingRefresh) pricingRefresh();
      }

      function paintLegs() {
        legsBox.replaceChildren();
        legsBox.appendChild(el('div', { class: 'cohort-row ship cohort-head' }, [
          el('span', { text: 'Shipping leg' }),
          el('span', { text: 'Going where' }),
          el('span', { class: 'ca', text: 'Shipments' }),
          el('span', { class: 'ca', text: '$ each' }),
          el('span', { class: 'ca', text: 'Our cost' }),
          el('span', {})
        ]));

        sh.legs.forEach(function (leg, i) {
          var nameIn = el('input', { type: 'text', 'aria-label': 'Leg ' + (i + 1) + ' description',
            placeholder: 'e.g. Sites to MT Group',
            oninput: function () { leg.label = nameIn.value; } });
          nameIn.value = leg.label || '';

          var destIn = el('input', { type: 'text',
            'aria-label': 'Destination for leg ' + (i + 1),
            placeholder: 'e.g. Boston, MA or Cambridge, UK',
            oninput: function () { leg.dest = destIn.value; } });
          destIn.value = leg.dest || '';

          var countIn = el('input', { type: 'text', inputmode: 'numeric',
            placeholder: leg.toSponsor ? String(batchCount()) : '0',
            'aria-label': 'Number of shipments for leg ' + (i + 1),
            oninput: function () { leg.count = countIn.value; refresh(); } });
          countIn.value = leg.count == null ? '' : String(leg.count);

          var rateIn = el('input', { type: 'text', inputmode: 'decimal',
            'aria-label': 'Cost per shipment for leg ' + (i + 1),
            placeholder: money(num(legIsIntl(sh, leg) ? sh.intlRate : sh.usRate)),
            oninput: function () { leg.rate = rateIn.value; refresh(); } });
          rateIn.value = leg.rate == null ? '' : String(leg.rate);

          var locked = !!(leg.toSponsor && sh.usDestination);
          var intl = el('input', { type: 'checkbox', 'aria-label': 'Leg ' + (i + 1) + ' is international',
            onchange: function () { leg.intl = intl.checked; refresh(); } });
          intl.checked = legIsIntl(sh, leg);
          intl.disabled = locked;

          var x = el('button', { class: 'row-x', type: 'button',
            'aria-label': 'Remove leg ' + (i + 1),
            onclick: function () { sh.legs.splice(i, 1); refresh(); } }, ['\u00d7']);

          legsBox.appendChild(el('div', { class: 'cohort-row ship' }, [
            nameIn, destIn,
            el('span', { class: 'ca' }, [countIn]),
            el('span', { class: 'ca' }, [rateIn]),
            el('span', { class: 'ca dim', text: money(legCount(sh, leg) * legRate(sh, leg)) }),
            x
          ]));
          legsBox.appendChild(el('label', { class: 'check ship-intl' }, [
            intl, el('span', { text: locked
              ? 'Domestic \u2014 the quote states a US destination'
              : 'International \u2014 uses the international rate' })
          ]));
        });
      }

      function paintCalc() {
        calcOut.replaceChildren();
        var cost = shippingCost();
        var markup = num(sh.markup) || 1;
        calcOut.appendChild(el('div', { class: 'calc-row' }, [
          el('span', { text: 'MT Group internal cost' }),
          el('span', { class: 'v', text: money(cost) })]));
        calcOut.appendChild(el('div', { class: 'calc-row calc-total' }, [
          el('span', { text: 'Charged at ' + markup + '\u00d7 cost' }),
          el('span', { class: 'v', text: money(shippingCalculated()) })]));
      }

      function paintMode() {
        modeBox.replaceChildren();
        var per = sh.mode === 'perSubject';
        modeBox.appendChild(el('div', { class: 'check-row' }, [
          radio('shipmode', 'Quote as a lump sum', !per, function () {
            sh.mode = 'lump'; sh.override = ''; refresh(); }),
          radio('shipmode', 'Quote per subject', per, function () {
            sh.mode = 'perSubject'; sh.override = ''; refresh(); })
        ]));

        var n = quoteSubjects();
        if (per) {
          modeBox.appendChild(el('div', { class: 'calc' }, [
            el('div', { class: 'calc-row calc-total' }, [
              el('span', { text: n
                ? money(shippingCalculated()) + ' \u00f7 ' + n + ' subjects'
                : 'Add subject counts in \u00a703 to work this out' }),
              el('span', { class: 'v', text: money(shippingPerSubject()) + ' per subject' })])
          ]));
        }

        modeBox.appendChild(field(per ? 'Override the per-subject charge'
                                     : 'Override the shipping price', {
          inputmode: 'decimal', full: true,
          placeholder: per ? 'Leave blank to quote ' + money(shippingPerSubject()) + ' per subject'
                           : 'Leave blank to quote ' + money(shippingCalculated()),
          hint: 'For when shipping is too expensive to show and the cost gets buried in '
              + 'the per-specimen figure \u2014 enter 0 here and raise the specimen prices.',
          get: function () { return sh.override; },
          set: function (v) { sh.override = v; },
          then: function () { paintMode(); if (pricingRefresh) pricingRefresh(); } }));

        modeBox.appendChild(el('div', { class: 'calc' }, [
          el('div', { class: 'calc-row calc-total' }, [
            el('span', { text: 'Shipping price for sponsor' }),
            el('span', { class: 'v', text: money(shippingTotal()) })])
        ]));
      }

      var addrFld = field('Ship-to address(es)', { type: 'textarea', rows: 2, full: true,
        placeholder: 'To a US location designated by '
                   + (String(draft.client || '').trim() || 'the sponsor'),
        hint: 'Where the specimens end up decides the rate — a frozen shipment to '
            + 'Cambridge costs several times one to Boston.',
        get: function () { return draft.shipping.addresses; },
        set: function (v) { draft.shipping.addresses = v; } });
      sec.appendChild(addrFld);

      var destBox = el('div');
      function paintDest() {
        destBox.replaceChildren();
        if (!sh.usDestination) return;
        destBox.appendChild(el('div', { class: 'quoted-line' }, [
          el('span', { class: 'quoted-tag', text: 'In the quote' }),
          el('span', { text: usDestinationSentence() })
        ]));
      }
      var destToggle = checkbox(
        'The sponsor\u2019s destination is US-based',
        function () { return sh.usDestination; },
        function (v) { sh.usDestination = v; },
        function () { paintDest(); refresh(); });
      destToggle.style.marginTop = '10px';
      sec.appendChild(destToggle);
      sec.appendChild(el('div', { class: 'hint',
        text: 'Puts a sentence in the quote naming the destination as US-based, so an '
            + 'international delivery address cannot appear later without a new quote. '
            + 'It also fixes the sponsor leg at the US rate.' }));
      sec.appendChild(destBox);
      paintDest();

      sec.appendChild(subHead('Shipping legs'));
      sec.appendChild(legsBox);
      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        sh.legs.push({ label: '', dest: '', intl: false, count: '', rate: '' }); refresh();
      } }, ['+ Add leg']));

      var ratesBox = el('div');
      function paintRates() {
        ratesBox.replaceChildren();
        if (!sh.showRates) return;
        ratesBox.appendChild(el('div', { class: 'grid' }, [
          field('Standard US frozen shipment', { inputmode: 'decimal',
            get: function () { return sh.usRate; },
            set: function (v) { sh.usRate = v; }, then: refresh }),
          field('Standard international frozen shipment', { inputmode: 'decimal',
            hint: 'Varies by country \u2014 typically $2,000\u20134,000. Set the ones that '
                + 'differ on the leg itself.',
            get: function () { return sh.intlRate; },
            set: function (v) { sh.intlRate = v; }, then: refresh }),
          field('Markup on cost', { inputmode: 'decimal',
            hint: 'The sponsor is normally charged twice cost.',
            get: function () { return sh.markup; },
            set: function (v) { sh.markup = v; }, then: refresh })
        ]));
      }
      var rateToggle = checkbox('Adjust the standard rates and markup',
        function () { return sh.showRates; },
        function (v) { sh.showRates = v; }, paintRates);
      rateToggle.style.marginTop = '12px';
      sec.appendChild(rateToggle);
      sec.appendChild(ratesBox);
      paintRates();

      sec.appendChild(calcOut);
      sec.appendChild(subHead('How it is quoted'));
      sec.appendChild(modeBox);

      sec.appendChild(field('Additional shipping detail', { type: 'textarea', rows: 2, full: true,
        placeholder: 'Courier, service level, TempTale\u2026',
        get: function () { return sh.detail; }, set: function (v) { sh.detail = v; } }));

      shippingRefresh = function () {
        addrFld._input.placeholder = 'To a US location designated by '
          + (String(draft.client || '').trim() || 'the sponsor');
        paintCalc(); paintMode(); paintDest();
      };
      paintLegs(); paintCalc(); paintMode();
      return sec;
    }

    function sectionPricing() {
      var ext = isMinimal();
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('11', 'Pricing'));

      draft.pricing = draft.pricing || {};
      var pr = draft.pricing;
      pr.otherCosts = pr.otherCosts || [];
      pr.shipping = pr.shipping || {};
      pr.screenfail = pr.screenfail || {};
      pr.cohortPrices = pr.cohortPrices || {};
      pr.specimenPrices = pr.specimenPrices || {};

      var totalsBox = el('div', { class: 'calc' });

      function subjectCount() {
        if (ext) {
          return draft.cohorts.reduce(function (s, c) { return s + extAdditional(c); }, 0);
        }
        return draft.cohorts.reduce(function (s, c) {
          if (c.subcohorts && c.subcohorts.length) {
            return s + c.subcohorts.reduce(function (t, sc) { return t + num(sc.subjects); }, 0);
          }
          return s + num(c.subjects);
        }, 0);
      }

      // ---- specimen / cohort pricing ------------------------------------
      var mainBox = el('div');

      function paintMain() {
        mainBox.replaceChildren();

        if (ext) {
          var perCohort = pr.extMode !== 'flat';
          mainBox.appendChild(el('div', { class: 'check-row' }, [
            radio('extprice', 'One price for every cohort', !perCohort, function () {
              pr.extMode = 'flat'; paintMain(); recalc(); }),
            radio('extprice', 'Price per cohort', perCohort, function () {
              pr.extMode = 'perCohort'; paintMain(); recalc(); })
          ]));

          if (!perCohort) {
            mainBox.appendChild(el('div', { class: 'grid' }, [
              field('Biospecimens & data ($ per subject)', { placeholder: '1225.00',
                inputmode: 'decimal',
                hint: 'Carried over from the original quote when the lookup finds it.',
                get: function () { return draft.header.perSubject; },
                set: function (v) { draft.header.perSubject = v; }, then: recalc })
            ]));
            return;
          }

          if (!draft.cohorts.length) {
            mainBox.appendChild(emptyNote('Add cohorts above and each one gets its own price here.'));
            return;
          }
          var rows = el('div', { class: 'cohorts' });
          rows.appendChild(el('div', { class: 'cohort-row ext cohort-head' }, [
            el('span', { text: 'Cohort' }), el('span', { class: 'ca', text: 'Subjects' }),
            el('span', { class: 'ca', text: '$ per subject' }),
            el('span', { class: 'ca', text: 'Subtotal' }), el('span', {})]));
          // An extension normally re-quotes the original study's rate, so each
          // cohort starts at the figure the lookup carried over. The rep
          // overrides the cohorts that differ instead of typing every one.
          var carried = draft.header.matchedStudy ? draft.header.perSubject : '';
          draft.cohorts.forEach(function (c, i) {
            var key = c.name || ('cohort-' + i);
            if (pr.cohortPrices[key] == null && carried) pr.cohortPrices[key] = carried;
            var subs = extAdditional(c);
            var sub = el('span', { class: 'ca' });
            var priceIn = el('input', { type: 'text', inputmode: 'decimal',
              'aria-label': '$ per subject for ' + (c.name || 'cohort ' + (i + 1)),
              oninput: function () {
                pr.cohortPrices[key] = priceIn.value;
                sub.textContent = money(subs * num(priceIn.value));
                recalc();
              } });
            priceIn.value = pr.cohortPrices[key] || '';
            sub.textContent = money(subs * num(priceIn.value));
            rows.appendChild(el('div', { class: 'cohort-row ext' }, [
              el('span', { text: c.name || 'Cohort ' + (i + 1) }),
              el('span', { class: 'ca dim', text: String(subs) }),
              el('span', { class: 'ca' }, [priceIn]), sub, el('span', {})]));
          });
          mainBox.appendChild(rows);
          if (carried) {
            mainBox.appendChild(el('div', { class: 'hint',
              text: 'Each cohort starts at ' + money(num(carried)) +
                    ', the rate carried over from the original quote. Change the '
                    + 'ones that differ.' }));
          }
          return;
        }

        // --- full quote. Priced per cohort by default: four of the five real
        // Natera quotes price that way and none price per specimen type, which
        // is what this section used to assume.
        var byCohort = pr.fullMode !== 'specimen';
        mainBox.appendChild(el('div', { class: 'check-row' }, [
          radio('fullprice', 'Price per cohort', byCohort, function () {
            pr.fullMode = 'cohort'; paintMain(); recalc(); }),
          radio('fullprice', 'Price per specimen type', !byCohort, function () {
            pr.fullMode = 'specimen'; paintMain(); recalc(); })
        ]));

        if (byCohort) {
          if (!draft.cohorts.length) {
            mainBox.appendChild(emptyNote('Add cohorts in §03 and each one gets its own price here.'));
            return;
          }
          var crows = el('div', { class: 'cohorts' });
          crows.appendChild(el('div', { class: 'cohort-row ext cohort-head' }, [
            el('span', { text: 'Cohort' }), el('span', { class: 'ca', text: 'Count' }),
            el('span', { class: 'ca', text: '$ per unit' }),
            el('span', { class: 'ca', text: 'Subtotal' }), el('span', {})]));

          draft.cohorts.forEach(function (c, i) {
            var key = c.name || ('cohort-' + i);
            pr.cohortUnits = pr.cohortUnits || {};
            var n = cohortSubjects(c);
            var sub = el('span', { class: 'ca' });

            var priceIn = el('input', { type: 'text', inputmode: 'decimal',
              'aria-label': '$ per unit for ' + (c.name || 'cohort ' + (i + 1)),
              oninput: function () {
                pr.cohortPrices[key] = priceIn.value; retotal();
              } });
            priceIn.value = pr.cohortPrices[key] || '';

            var unitSel = el('select', {
              'aria-label': 'Unit for ' + (c.name || 'cohort ' + (i + 1)),
              onchange: function () {
                pr.cohortUnits[key] = unitSel.value; retotal();
              } });
            PRICE_UNITS.forEach(function (u) {
              unitSel.appendChild(el('option', { value: u, text: u }));
            });
            unitSel.value = pr.cohortUnits[key] || 'subject';

            // A unit is not always one per subject. The stool quote collects 25
            // subjects but prices 50 stools, two from each; the adenoma quote is
            // one draw per subject. Blank means one.
            pr.cohortPer = pr.cohortPer || {};
            var perIn = el('input', { type: 'text', inputmode: 'numeric', placeholder: '1',
              'aria-label': 'Units per subject for ' + (c.name || 'cohort ' + (i + 1)),
              oninput: function () { pr.cohortPer[key] = perIn.value; retotal(); } });
            perIn.value = pr.cohortPer[key] == null ? '' : String(pr.cohortPer[key]);

            function retotal() {
              sub.textContent = money(cohortUnitCount(c, key, pr) * num(priceIn.value));
              recalc();
            }

            sub.textContent = money(cohortUnitCount(c, key, pr) * num(priceIn.value));
            crows.appendChild(el('div', { class: 'cohort-row ext' }, [
              el('span', { text: c.name || 'Cohort ' + (i + 1) }),
              el('span', { class: 'ca dim', text: String(cohortUnitCount(c, key, pr)) }),
              el('span', { class: 'ca' }, [priceIn]),
              sub, el('span', {})]));
            crows.appendChild(el('div', { class: 'cohort-row unit' }, [
              el('span', { class: 'hint', text: 'per subject' }),
              el('span', { class: 'ca' }, [perIn]),
              unitSel, el('span', {}), el('span', {})]));
          });
          mainBox.appendChild(crows);
          mainBox.appendChild(el('div', { class: 'hint',
            text: 'The unit is printed in the quote — "$1,250 / Cohort 1 draw" — and '
                + 'the count above comes from §03.' }));
          return;
        }

        var specs = pickedSpecimens();
        if (!specs.length) {
          mainBox.appendChild(emptyNote('Pick specimen types in §05 and each gets its own pricing block here, numbered to match.'));
          return;
        }
        specs.forEach(function (t, i) {
          pr.specimenPrices[t] = pr.specimenPrices[t] || {};
          var sp = pr.specimenPrices[t];
          var card = el('div', { class: 'toggle-box' });
          var tps = timepointNames();
          var reps = collectionCount((draft.specimenDetail || {})[t], tps);
          var head = el('div', { class: 'cohort-card-head' }, [
            el('span', { class: 'sec-num', text: '05.' + (i + 1) }),
            el('span', { class: 'cohort-card-title', text: t })
          ]);
          if (tps.length > 1) {
            head.appendChild(el('span', { class: 'hint', style: 'margin:0 0 0 auto',
              text: reps + (reps === 1 ? ' collection' : ' collections') + ' per subject' }));
          }
          card.appendChild(head);
          card.appendChild(el('div', { class: 'grid' }, [
            field('Price to quote ($ per collection)', { placeholder: '1225.00', inputmode: 'decimal',
              get: function () { return sp.price; },
              set: function (v) { sp.price = v; }, then: recalc }),
            field('Site cost + stipend', { placeholder: 'context only', inputmode: 'decimal',
              hint: 'Reference only — not added to the total.',
              get: function () { return sp.siteCost; }, set: function (v) { sp.siteCost = v; } }),
            field('Source', { placeholder: 'who quoted it, and when',
              get: function () { return sp.source; }, set: function (v) { sp.source = v; } }),
            field('Pricing notes (internal)', { type: 'textarea', rows: 2,
              hint: 'Internal draft only — never reaches the sponsor document.',
              placeholder: 'e.g. already floated $1,600, sponsor pushed back',
              get: function () { return sp.notes; }, set: function (v) { sp.notes = v; } })
          ]));
          mainBox.appendChild(card);
        });
      }

      // ---- screenfail ----------------------------------------------------
      var sfBox = el('div');
      function paintScreenfail() {
        sfBox.replaceChildren();
        if (!pr.screenfail.enabled) return;
        var cohortNames = draft.cohorts.map(function (c, i) { return c.name || 'Cohort ' + (i + 1); });
        var box = el('div', { class: 'toggle-box' });
        box.appendChild(el('div', { class: 'grid' }, [
          field('Screenfail rate ($ per subject)', { inputmode: 'decimal',
            get: function () { return pr.screenfail.perSubject; },
            set: function (v) { pr.screenfail.perSubject = v; }, then: recalc }),
          field('Cap (%)', { inputmode: 'decimal',
            get: function () { return pr.screenfail.capPercent; },
            set: function (v) { pr.screenfail.capPercent = v; }, then: recalc })
        ]));
        if (cohortNames.length) {
          var fs = el('fieldset', {}, [el('legend', { text: 'Applies to' })]);
          pr.screenfail.cohorts = pr.screenfail.cohorts || [];
          fs.appendChild(el('div', { class: 'check-row' }, cohortNames.map(function (n) {
            return checkbox(n,
              function () { return pr.screenfail.cohorts.indexOf(n) > -1; },
              function (on) {
                var k = pr.screenfail.cohorts.indexOf(n);
                if (on && k === -1) pr.screenfail.cohorts.push(n);
                if (!on && k > -1) pr.screenfail.cohorts.splice(k, 1);
              }, recalc);
          })));
          box.appendChild(fs);
        }
        box.appendChild(field('How it is applied', { type: 'textarea', rows: 2, full: true,
          get: function () { return pr.screenfail.explanation; },
          set: function (v) { pr.screenfail.explanation = v; } }));
        // Only meaningful inside the screenfail block (spec §10).
        box.appendChild(checkbox('Screenfails are shipped',
          function () { return pr.screenfail.shipped; },
          function (v) { pr.screenfail.shipped = v; }));
        sfBox.appendChild(box);
      }

      // ---- other costs ------------------------------------------------------
      var otherBox = el('div');
      // A cost line is often a rate times a count, not a lump: Medrio entry at
      // $100 a subject is $53,200 of a real $948,425 quote, and shipping kits
      // out to sites is $50 a stool. Leave the count blank and the rate is the
      // whole line, which is the old behaviour.
      function paintOther() {
        otherBox.replaceChildren();
        var rows = el('div', { class: 'cohorts' });
        rows.appendChild(el('div', { class: 'cohort-row cost cohort-head' }, [
          el('span', { text: 'Cost' }),
          el('span', { class: 'ca', text: 'Rate' }),
          el('span', { class: 'ca', text: '×' }),
          el('span', { text: 'Unit' }),
          el('span', { class: 'ca', text: 'Amount' }),
          el('span', {})]));
        pr.otherCosts.forEach(function (o, i) {
          var lab = el('input', { type: 'text', 'aria-label': 'Cost line ' + (i + 1) + ' label',
            placeholder: 'e.g. Medrio entry',
            oninput: function () { pr.otherCosts[i].label = lab.value; } });
          lab.value = o.label || '';

          var sub = el('span', { class: 'ca dim' });
          function retotal() {
            sub.textContent = money(otherCostAmount(pr.otherCosts[i]));
            recalc();
          }

          var amt = el('input', { type: 'text', inputmode: 'decimal',
            'aria-label': 'Cost line ' + (i + 1) + ' rate',
            oninput: function () { pr.otherCosts[i].amount = amt.value; retotal(); } });
          amt.value = o.amount || '';

          var qty = el('input', { type: 'text', inputmode: 'numeric', placeholder: '—',
            'aria-label': 'Cost line ' + (i + 1) + ' count',
            oninput: function () { pr.otherCosts[i].count = qty.value; retotal(); } });
          qty.value = o.count == null ? '' : String(o.count);

          var unit = el('input', { type: 'text', placeholder: 'subjects, reports…',
            'aria-label': 'Cost line ' + (i + 1) + ' unit',
            oninput: function () { pr.otherCosts[i].unit = unit.value; } });
          unit.value = o.unit || '';

          var x = el('button', { class: 'row-x', type: 'button',
            'aria-label': 'Remove cost line ' + (i + 1),
            onclick: function () { pr.otherCosts.splice(i, 1); paintOther(); recalc(); } }, ['×']);

          sub.textContent = money(otherCostAmount(o));
          rows.appendChild(el('div', { class: 'cohort-row cost' },
            [lab, el('span', { class: 'ca' }, [amt]), el('span', { class: 'ca' }, [qty]),
             unit, sub, x]));
        });
        otherBox.appendChild(rows);
        otherBox.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
          pr.otherCosts.push({ label: '', amount: '', count: '', unit: '' }); paintOther();
        } }, ['+ Add cost line']));
      }

      // ---- totals -----------------------------------------------------------
      function recalc() {
        var subjects = subjectCount();
        var lines = [];

        var specimenTotal = 0;
        if (ext) {
          if (pr.extMode !== 'flat') {          // undefined defaults to per-cohort
            draft.cohorts.forEach(function (c, i) {
              var key = c.name || ('cohort-' + i);
              specimenTotal += extAdditional(c) * num(pr.cohortPrices[key]);
            });
            lines.push(['Biospecimens & data, by cohort', specimenTotal]);
          } else {
            specimenTotal = subjects * num(draft.header.perSubject);
            lines.push([subjects + ' subjects × ' + money(num(draft.header.perSubject)), specimenTotal]);
          }
        } else if (pr.fullMode !== 'specimen') {
          // Per cohort, priced in whatever unit the cohort is counted in.
          pr.cohortUnits = pr.cohortUnits || {};
          draft.cohorts.forEach(function (c, i) {
            var key = c.name || ('cohort-' + i);
            var p = num(pr.cohortPrices[key]);
            if (!p) return;
            var n = cohortUnitCount(c, key, pr);
            var unit = pr.cohortUnits[key] || 'subject';
            var per = num((pr.cohortPer || {})[key]) || 1;
            var line = n * p;
            specimenTotal += line;
            lines.push([(c.name || 'Cohort ' + (i + 1)) + ' — ' +
              (per > 1 ? cohortSubjects(c) + ' subjects × ' + per + ' ' : '') +
              (per > 1 ? '' : n + ' ') + unit + (n === 1 ? '' : 's') +
              ' × ' + money(p), line]);
          });
          if (!lines.length) lines.push(['Biospecimens & data', 0]);
        } else {
          var tpNames = timepointNames();
          pickedSpecimens().forEach(function (t) {
            var p = num((pr.specimenPrices[t] || {}).price);
            if (!p) return;
            var reps = collectionCount((draft.specimenDetail || {})[t], tpNames);
            var line = subjects * reps * p;
            specimenTotal += line;
            lines.push([
              t + ' — ' + subjects + (reps > 1 ? ' × ' + reps + ' collections' : '') +
              ' × ' + money(p), line]);
          });
          if (!lines.length) lines.push(['Biospecimens & data', 0]);
        }

        var sfTotal = 0;
        if (pr.screenfail.enabled) {
          var cap = num(pr.screenfail.capPercent) / 100;
          var sfSubjects = cap ? Math.round(subjects * cap) : 0;
          sfTotal = sfSubjects * num(pr.screenfail.perSubject);
          if (sfTotal) lines.push(['Screenfails — ' + sfSubjects + ' × ' + money(num(pr.screenfail.perSubject)), sfTotal]);
        }

        var outcomeTotal = 0;
        if (draft.clinicalData && draft.clinicalData.outcomeData) {
          outcomeTotal = subjects * num(pr.outcomeFee);
          if (outcomeTotal) lines.push(['Outcome data — ' + subjects + ' × ' + money(num(pr.outcomeFee)), outcomeTotal]);
        }

        var otherTotal = 0;
        pr.otherCosts.forEach(function (o) {
          var a = otherCostAmount(o);
          if (!a) return;
          otherTotal += a;
          var c = String(o.count == null ? '' : o.count).trim();
          lines.push([(o.label || 'Other cost') + (c
            ? ' — ' + c + ' ' + (o.unit || '') + ' × ' + money(num(o.amount))
            : ''), a]);
        });

        var shipTotal = shippingTotal();
        if (shipTotal) lines.push(['Shipping and handling', shipTotal]);

        var grand = specimenTotal + sfTotal + outcomeTotal + otherTotal + shipTotal;

        totalsBox.replaceChildren();
        lines.forEach(function (l) {
          totalsBox.appendChild(el('div', { class: 'calc-row' }, [
            el('span', { text: l[0] }), el('span', { class: 'v', text: money(l[1]) })]));
        });
        totalsBox.appendChild(el('div', { class: 'calc-row calc-total' }, [
          el('span', { text: 'Total study costs' }),
          el('span', { class: 'v', text: money(grand) })]));

        draft.totalCost = grand ? grand.toFixed(2) : '';
      }
      pricingRefresh = function () { paintMain(); recalc(); };

      paintMain();
      sec.appendChild(mainBox);

      sec.appendChild(subHead('Screenfails'));
      var sfToggle = checkbox('This quote includes a screenfail rate',
        function () { return pr.screenfail.enabled; },
        function (v) { pr.screenfail.enabled = v; },
        function () { paintScreenfail(); recalc(); });
      sec.appendChild(sfToggle);
      sec.appendChild(sfBox);
      paintScreenfail();

      if (draft.clinicalData && draft.clinicalData.outcomeData) {
        sec.appendChild(subHead('Outcome data'));
        sec.appendChild(el('div', { class: 'grid' }, [
          field('Outcome data fee ($ per subject)', { inputmode: 'decimal',
            hint: 'Turned on in §07. The description lives there; the fee lives here.',
            get: function () { return pr.outcomeFee; },
            set: function (v) { pr.outcomeFee = v; }, then: recalc })
        ]));
      }

      sec.appendChild(subHead('Other costs'));
      paintOther();
      sec.appendChild(otherBox);

      sec.appendChild(field('What the total assumes', { full: true,
        placeholder: 'e.g. estimating that 100% of subjects provide two stools',
        hint: 'Printed beside the total. A real quote reads '
            + '"$180,000 (estimating that 100% of subjects provide two stools)".',
        get: function () { return pr.totalAssumption; },
        set: function (v) { pr.totalAssumption = v; } }));

      sec.appendChild(subHead('Total'));
      sec.appendChild(totalsBox);
      recalc();

      return sec;
    }

    function subHead(text) {
      return el('div', { class: 'sub-head', text: text });
    }

    // ---- 06 summary + quote name (after pricing) -----------------------

    var summaryInput = null, nameInput = null;

    function refreshDrafts() {
      if (!draft.summaryEdited && summaryInput) {
        var s = draftSummary(draft);
        if (s) { draft.summary = s; summaryInput.value = s; }
      }
      if (!draft.nameEdited && nameInput) {
        var n = draftQuoteName(draft);
        if (n) { draft.quoteName = n; nameInput.value = n; refreshNumber(); }
      }
    }

    function sectionSummary() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('06', 'Study summary'));

      var sFld = field('Study summary', { type: 'textarea', rows: 4, full: true,
        autofilled: true,
        hint: 'Drafts itself from the entries above. Once you edit it, it stops rewriting itself.',
        get: function () { return draft.summary; },
        set: function (v) { draft.summary = v; draft.summaryEdited = true; } });
      summaryInput = sFld._input;
      sec.appendChild(sFld);
      refreshDrafts();
      return sec;
    }

    // The quote name is the quote number — there is only one, and it comes last,
    // once everything it draws on has been filled in.
    function sectionQuoteName() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('', 'Quote name'));

      var nFld = field('Quote name', { required: true, full: true, autofilled: true,
        placeholder: 'CRC - plasma & buffy',
        hint: 'Drafts itself from the cohorts and specimens above, and is the quote number too. Editing it stops the rewriting.',
        get: function () { return draft.quoteName; },
        set: function (v) { draft.quoteName = v; draft.nameEdited = true; } });
      nameInput = nFld._input;
      sec.appendChild(nFld);

      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.summaryEdited = false; draft.nameEdited = false;
        var sm = draftSummary(draft), n = draftQuoteName(draft);
        draft.summary = sm; if (summaryInput) summaryInput.value = sm;
        draft.quoteName = n; nameInput.value = n;
        toast('Redrafted from your entries');
      } }, ['↻ Redraft the name and summary']));

      refreshDrafts();
      return sec;
    }

    // ---- 11 notes ------------------------------------------------------

    function sectionNotes() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('12', 'Additional quote details'));

      draft.conditions = draft.conditions || {};
      var condBox = el('div');

      function sponsorName() {
        return String(draft.client || '').trim() || 'the sponsor';
      }

      function paintConditions() {
        condBox.replaceChildren();
        STUDY_CONDITIONS.forEach(function (cl) {
          var on = Object.prototype.hasOwnProperty.call(draft.conditions, cl.id);
          var row = el('div', { class: 'cond' });
          var box = el('input', { type: 'checkbox', onchange: function () {
            if (box.checked) {
              draft.conditions[cl.id] = cl.text.replace(/\{S\}/g, sponsorName());
            } else {
              delete draft.conditions[cl.id];
            }
            paintConditions();
          } });
          box.checked = on;
          row.appendChild(el('label', { class: 'check' }, [box,
            el('span', { text: cl.label })]));
          if (on) {
            var ta = el('textarea', { rows: 2, class: 'cond-text',
              'aria-label': cl.label + ' — wording',
              oninput: function () { draft.conditions[cl.id] = ta.value; } });
            ta.value = draft.conditions[cl.id];
            row.appendChild(ta);
          }
          condBox.appendChild(row);
        });
      }

      sec.appendChild(subHead('Study conditions'));
      sec.appendChild(el('div', { class: 'hint',
        text: 'The terms most likely to be argued about later. Tick the ones that '
            + 'apply and edit the wording — these are not the standard Terms & '
            + 'Conditions, which every quote carries unchanged.' }));
      sec.appendChild(condBox);
      paintConditions();

      sec.appendChild(subHead('Anything else'));
      sec.appendChild(field('Notes', { type: 'textarea', rows: 4, full: true,
        placeholder: 'Delivery expectations, sponsor-specific terms, anything the sections above did not cover.',
        hint: 'Appears on both the internal draft and the sponsor quote.',
        get: function () { return draft.notes; }, set: function (v) { draft.notes = v; } }));
      return sec;
    }

    // ---- actions -------------------------------------------------------

    renderExtBox();
    renderBody();

    var actions = el('div', { class: 'actions' });
    actions.style.marginTop = '30px';
    actions.appendChild(el('button', { class: 'btn btn-primary', type: 'button',
      onclick: function () { submit(); } }, [existing ? 'Save changes' : 'Create quote']));
    actions.appendChild(el('button', { class: 'btn', type: 'button',
      onclick: function () { go('register'); } }, ['Cancel']));

    if (existing) {
      actions.appendChild(el('button', { class: 'btn btn-danger spacer', type: 'button', onclick: function () {
        if (!confirm('Delete this quote? This cannot be undone.')) return;
        quotes = quotes.filter(function (q) { return q.id !== existing.id; });
        save(); go('register'); toast('Quote deleted');
      } }, ['Delete quote']));
    }
    actions.insertBefore(field('Status', { type: 'select', options: STATUSES,
      get: function () { return draft.status; },
      set: function (v) { draft.status = v; } }), actions.firstChild);
    wrap.appendChild(actions);

    function submit() {
      var errs = [];
      if (!String(draft.client).trim()) errs.push('Client / sponsor is required (§01).');
      if (!String(draft.quoteName).trim()) errs.push('Quote name is required (§06).');
      if (!String(draft.quoteDate).trim()) errs.push('Quote date is required (§01).');
      if (String(draft.totalCost).trim() !== '' && isNaN(Number(String(draft.totalCost).replace(/[$,]/g, '')))) {
        errs.push('Total cost must be a number (§11).');
      } else if (num(draft.totalCost) < 0) {
        errs.push('Total cost cannot be negative (§11).');
      }

      errorBox.replaceChildren();
      if (errs.length) {
        errorBox.appendChild(el('div', { class: 'errors', role: 'alert' }, [
          el('p', { text: 'This quote can’t be saved yet:' }),
          el('ul', {}, errs.map(function (e) { return el('li', { text: e }); }))
        ]));
        errorBox.scrollIntoView({ block: 'nearest' });
        return;
      }

      finalize(draft);
      if (existing) {
        for (var i = 0; i < quotes.length; i++) if (quotes[i].id === existing.id) quotes[i] = draft;
        save(); go('edit', existing.id); toast('Changes saved');
      } else {
        draft.id = uid();
        quotes.push(draft);
        save(); go('edit', draft.id); toast('Quote created');
      }
    }

    return frag;
  }

  // An empty state, not an unbuilt one. Every section of the form exists; this
  // says what to fill in above to make a block appear here.
  function emptyNote(text) {
    return el('div', { class: 'empty-note' }, [el('span', { text: text })]);
  }

  function secHead(num, title, note) {
    return el('div', { class: 'sec-head' }, [
      num ? el('span', { class: 'sec-num', text: num }) : null,
      el('span', { class: 'sec-title', text: title }),
      note ? el('span', { class: 'sec-note', text: note }) : null
    ]);
  }

  // ---------------------------------------------------------------- boot

  load();
  go('register');
})();
</script>
