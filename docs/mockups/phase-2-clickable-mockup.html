<title>MT Group Quote Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground: #FAFAF8;
    --surface: #FFFFFF;
    --surface-sunk: #F3F4F2;
    --ink: #16211F;
    --ink-soft: #5F6E6B;
    --ink-faint: #8D9995;
    --rule: #E2E6E3;
    --rule-strong: #CBD2CF;
    --accent: #0E5B57;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EFEC;

    --st-draft-fg: #5F6E6B;   --st-draft-bg: #ECEEEC;
    --st-review-fg: #8A5606;  --st-review-bg: #FBF0DC;
    --st-sent-fg: #1B4F8C;    --st-sent-bg: #E4EDF8;
    --st-won-fg: #16613B;     --st-won-bg: #E0F0E7;
    --st-lost-fg: #8E3039;    --st-lost-bg: #FAE6E7;

    --danger: #A33A44;
    --needed: #9A6B10;
    --needed-bg: #FBF2DF;
    --danger-bg: #FBEBEC;

    --shadow: 0 1px 2px rgba(22, 33, 31, .05), 0 6px 20px -12px rgba(22, 33, 31, .18);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1312;
      --surface: #151B1A;
      --surface-sunk: #1B2322;
      --ink: #E9EEEC;
      --ink-soft: #97A5A1;
      --ink-faint: #6E7C79;
      --rule: #25302E;
      --rule-strong: #35423F;
      --accent: #57BAAE;
      --accent-ink: #06201E;
      --accent-soft: #14302D;

      --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
      --st-review-fg: #E0B366;  --st-review-bg: #332915;
      --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
      --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
      --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

      --danger: #E0949B;
      --needed: #D9A85A;
      --needed-bg: #2B2114;
      --danger-bg: #2A1A1C;

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1312;
    --surface: #151B1A;
    --surface-sunk: #1B2322;
    --ink: #E9EEEC;
    --ink-soft: #97A5A1;
    --ink-faint: #6E7C79;
    --rule: #25302E;
    --rule-strong: #35423F;
    --accent: #57BAAE;
    --accent-ink: #06201E;
    --accent-soft: #14302D;

    --st-draft-fg: #9AA8A4;   --st-draft-bg: #222A29;
    --st-review-fg: #E0B366;  --st-review-bg: #332915;
    --st-sent-fg: #8FB8E6;    --st-sent-bg: #162434;
    --st-won-fg: #7BC79B;     --st-won-bg: #13291E;
    --st-lost-fg: #E0949B;    --st-lost-bg: #2E191B;

    --danger: #E0949B;
    --danger-bg: #2A1A1C;

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- shell ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }

  .mark {
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.15;
  }

  .brand-org {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .13em;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  .nav { display: flex; gap: 4px; }

  .nav button {
    font: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav button:hover { background: var(--surface-sunk); color: var(--ink); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .banner {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 28px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    border-bottom: 1px solid var(--rule);
  }
  .banner strong { font-weight: 600; }
  .banner span { color: var(--ink-soft); }

  main { padding: 34px 28px 90px; max-width: 1120px; margin: 0 auto; }

  /* ---------- page heading ---------- */

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }

  .sub { color: var(--ink-soft); font-size: 14px; margin: 5px 0 0; }

  /* ---------- buttons ---------- */

  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }

  .btn-danger {
    border-color: transparent;
    background: none;
    color: var(--danger);
    padding-inline: 6px;
  }
  .btn-danger:hover { background: var(--danger-bg); border-color: transparent; }

  /* ---------- register table ---------- */

  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 11px;
    box-shadow: var(--shadow);
  }

  table { width: 100%; min-width: 860px; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .11em;
    color: var(--ink-faint);
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  th.num { text-align: right; }

  td {
    padding: 15px 18px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-sunk); }

  .q-name {
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  .q-name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .q-number {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 4px;
    word-break: break-word;
  }

  .q-specimens { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  .nowrap { white-space: nowrap; }

  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .chip-draft { background: var(--st-draft-bg); color: var(--st-draft-fg); }
  .chip-internal_reviewed { background: var(--st-review-bg); color: var(--st-review-fg); }
  .chip-sent { background: var(--st-sent-bg); color: var(--st-sent-fg); }
  .chip-won { background: var(--st-won-bg); color: var(--st-won-fg); }
  .chip-lost { background: var(--st-lost-bg); color: var(--st-lost-fg); }

  .tag-ext {
    display: inline-block;
    margin-left: 7px;
    padding: 1px 7px;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .03em;
    vertical-align: 1px;
  }

  .table-foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--rule-strong);
    border-radius: 11px;
    padding: 62px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .link-btn {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: inherit;
    color: var(--accent); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---------- form ---------- */

  .form-wrap { max-width: 760px; }

  .back {
    background: none; border: 0; padding: 0;
    font: inherit; font-size: 13.5px;
    color: var(--ink-soft); cursor: pointer;
    margin-bottom: 18px;
  }
  .back:hover { color: var(--accent); }

  .quote-no-preview {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 12px 15px;
    margin-bottom: 26px;
  }
  .quote-no-preview .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--ink-faint); display: block; margin-bottom: 4px;
  }
  .quote-no-input {
    font-family: var(--mono) !important; font-size: 13.5px !important;
    background: var(--surface) !important;
  }
  .quote-no-foot {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-top: 6px;
  }
  .quote-no-foot .link-btn { font-size: 12px; }

  section.sec { margin-bottom: 24px; }

  .sec-head {
    display: flex; align-items: baseline; gap: 11px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 13px;
  }
  .sec-num {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); font-weight: 500;
  }
  .sec-title { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .sec-note { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

  .sec-pending {
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--rule);
    color: var(--ink-faint);
    font-size: 13.5px;
  }
  .sec-pending .sec-num { color: var(--ink-faint); }
  .sec-pending .phase {
    margin-left: auto; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .grid .full { grid-column: 1 / -1; }

  .fld { display: flex; flex-direction: column; }
  .fld > label {
    font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--ink);
  }
  .req { color: var(--needed); font-weight: 600; }
  .req-fld.is-empty > label { color: var(--needed); }
  .req-fld.is-empty input,
  .req-fld.is-empty select,
  .req-fld.is-empty textarea {
    border-color: var(--needed);
    background: var(--needed-bg);
  }

  .needed-key {
    font-size: 12.5px; color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .needed-key .req { margin-right: 4px; }

  .export { margin-top: 18px; }
  .export-note {
    font-size: 12.5px; color: var(--ink-soft);
    margin: 10px 0; max-width: 62ch; line-height: 1.55;
  }
  .export-csv {
    width: 100%; font-family: var(--mono); font-size: 11.5px;
    line-height: 1.5; white-space: pre; overflow-x: auto;
  }
  .export-actions { display: flex; align-items: center; gap: 14px; margin-top: 10px; }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    font: inherit; font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  ::placeholder { color: var(--ink-faint); opacity: 1; }

  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 3px; line-height: 1.45; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; }
  .check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }

  .check-row { display: flex; flex-wrap: wrap; gap: 7px 22px; }

  .specimen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 10px 18px;
  }

  .toggle-box {
    background: var(--surface-sunk);
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 13px 14px;
    margin-bottom: 12px;
  }

  fieldset { border: 0; padding: 0; margin: 12px 0 0; }
  legend { font-size: 13px; font-weight: 500; margin-bottom: 6px; padding: 0; }

  /* ---------- empty-state note ---------- */

  .empty-note {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    background: var(--surface-sunk);
    border-left: 3px solid var(--rule-strong);
    border-radius: 0 7px 7px 0;
    padding: 8px 12px;
    margin-bottom: 11px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  /* ---------- lookup / carried-over detail ---------- */

  .carried {
    background: var(--accent-soft);
    border-radius: 9px;
    padding: 15px 17px;
    margin-bottom: 18px;
  }
  .carried-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); font-weight: 600; margin-bottom: 11px;
  }
  .carried-list {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 16px;
    margin: 0 0 10px;
  }
  .carried-list dt { font-size: 12.5px; color: var(--ink-soft); }
  .carried-list dd { margin: 0; font-size: 13.5px; }
  .carried .hint { margin-top: 0; }

  .lookup-idle {
    border: 1px dashed var(--rule-strong);
    border-radius: 9px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .autofilled {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 7px;
    vertical-align: 1px;
  }

  /* ---------- cohort rows ---------- */

  .cohorts { display: flex; flex-direction: column; }

  .cohort-row {
    display: grid;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-row.full   { grid-template-columns: 1fr 120px 40px; }
  .cohort-row.ext    { grid-template-columns: 1fr 110px 110px 80px 40px; }

  .cohort-row .ca { text-align: right; font-variant-numeric: tabular-nums; }
  .cohort-row input[type="text"] { padding: 7px 9px; }
  .cohort-row .ca input { text-align: right; }

  .cohort-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); padding-bottom: 7px;
  }
  .cohort-row .dim { color: var(--ink-soft); }
  .cohort-total { border-bottom: 0; font-weight: 600; padding-top: 12px; }
  .cohort-total .strong { font-size: 15px; }

  .row-x {
    background: none; border: 0; cursor: pointer;
    color: var(--ink-faint); font-size: 17px; line-height: 1;
    padding: 4px 6px; border-radius: 6px;
  }
  .row-x:hover { color: var(--danger); background: var(--danger-bg); }

  .add-row {
    align-self: flex-start;
    margin-top: 12px;
    font: inherit; font-size: 13px;
    background: none; border: 1px dashed var(--rule-strong);
    border-radius: 7px; padding: 7px 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  .add-row:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 620px) {
    .cohort-row.ext  { grid-template-columns: 1fr 64px 78px 60px 32px; gap: 6px; font-size: 12.5px; }
    .cohort-row.full { grid-template-columns: 1fr 84px 32px; }
  }

  .cohort-card-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 7px; margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .cohort-card-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600;
    margin-right: auto;
  }
  .sub-label {
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }

  .ie-note {
    background: var(--surface-sunk);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    padding: 11px 14px;
    margin: 22px 0 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .ie-note strong { color: var(--ink); font-weight: 600; }

  /* ---------- biospecimen columns ---------- */

  .cohort-row.ship {
    grid-template-columns: 1.4fr 1.4fr 90px 110px 100px 34px;
    align-items: center;
  }
  .ship-intl {
    margin: -4px 0 12px;
    padding-left: 2px;
  }
  .ship-intl span { font-size: 12.5px; color: var(--ink-soft); }
  .ship-intl input:disabled + span { color: var(--ink-faint); }

  .cohort-row.sub-ext {
    grid-template-columns: 26px 1fr 84px 32px;
    align-items: center;
    padding-left: 14px;
  }
  .cohort-row.sub-add { grid-template-columns: 1fr; padding-left: 14px; }
  .data-rows { display: flex; flex-direction: column; }
  .data-row {
    display: grid; grid-template-columns: 1fr 92px 92px 96px;
    align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid var(--rule);
  }
  .data-row.head {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-faint);
    border-bottom-color: var(--rule-strong); padding-bottom: 6px;
  }
  .data-row.head span { text-align: center; }
  .data-row.head span:first-child { text-align: left; }
  .data-row .lbl { font-size: 14px; }
  .data-opt {
    display: flex; justify-content: center; cursor: pointer; padding: 3px 0;
  }
  .data-opt input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  @media (max-width: 560px) {
    .data-row { grid-template-columns: 1fr 56px 56px 60px; }
    .data-row .lbl { font-size: 13px; }
  }

  .suggested {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .suggested-tag {
    flex: none; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .11em;
    color: var(--accent);
  }

  .confirm-wrap { display: inline-flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .confirm-q { font-size: 12.5px; color: var(--ink-soft); }
  .link-btn.danger { color: var(--danger); font-weight: 600; }

    var hit = CONTACTS.filter(function (c) {
      return c.name.toLowerCase() === k && (!client || c.client === client);
    })[0] || CONTACTS.filter(function (c) { return c.name.toLowerCase() === k; })[0];
    return hit ? hit.email : '';
  }

  /**
   * Finds the parent study from a PO number and/or MT number.
   * Looks at quotes already in the register first, then the stand-in index.
   * An MT number alone can be ambiguous under an umbrella number like MT9920,
   * so a PO number wins and a bare MT match only counts when it is unique.
   */
  /**
   * Match on the original-study-quote text a rep types. Quote numbers carry the
   * sponsor acronym and date — "QTE NTA20260826 Pan-cancer - blood" — so an
   * exact match works, and failing that the acronym alone identifies the client.
   * OneDrive becomes the real source for this; the register stands in for now.
   */
  function findStudyByQuoteRef(ref, quotesList) {
    var t = String(ref || '').trim();
    if (t.length < 4) return null;

    var low = t.toLowerCase();

    var exact = (quotesList || []).filter(function (q) {
      return q.quoteNumber && q.quoteNumber.toLowerCase() === low;
    })[0];
    if (exact) return { quote: exact, via: 'quote reference' };

    var idx = STUDY_INDEX.filter(function (st) { return st.quote.toLowerCase() === low; })[0];
    if (idx) return { study: idx, via: 'quote reference' };

    // Partial is enough — reps paste fragments, and a unique containment match
    // is far more useful than nothing.
    var partial = (quotesList || []).filter(function (q) {
      var n = (q.quoteNumber || '').toLowerCase();
      return n && (n.indexOf(low) > -1 || low.indexOf(n) > -1);
    });
    if (partial.length === 1) return { quote: partial[0], via: 'quote reference' };

    var partialIdx = STUDY_INDEX.filter(function (st) {
      var n = st.quote.toLowerCase();
      return n.indexOf(low) > -1 || low.indexOf(n) > -1;
    });
    if (partialIdx.length === 1) return { study: partialIdx[0], via: 'quote reference' };

    // Fall back to the acronym embedded in the number.
    var m = t.match(/QTE\s*([A-Z0-9]{2,6})\d{6,8}/i);
    if (m) {
      var ac = m[1].toUpperCase();
      var byAc = STUDY_INDEX.filter(function (st) { return st.acronym === ac; });
      if (byAc.length === 1) return { study: byAc[0], via: 'sponsor acronym in the quote number' };
      var q = (quotesList || []).filter(function (x) { return x.sponsorAcronym === ac; })[0];
      if (q) return { acronymOnly: ac, client: q.client, via: 'sponsor acronym in the quote number' };
      if (byAc.length > 1) return { acronymOnly: ac, client: byAc[0].client, via: 'sponsor acronym in the quote number' };
    }
    return null;
  }

  /** A deal name is the thing a rep pastes out of HubSpot, so it works as a
   *  lookup key like the PO and the MT number do. */
  function findStudyByDealName(name) {
    // Reps retype these as often as they paste them, so punctuation, casing and
    // whether the MT number is in brackets must not decide whether it matches.
    function norm(t) {
      return String(t || '')
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[()\[\]]/g, ' ')
        .replace(/[^a-z0-9']+/gi, ' ')
        .trim().toLowerCase();
    }
    var n = norm(name);
    if (n.length < 6) return null;
    var hit = HUBSPOT_DEALS.filter(function (d) { return norm(d[1]) === n; })[0]
           || HUBSPOT_DEALS.filter(function (d) {
                var dn = norm(d[1]);
                return dn.indexOf(n) > -1 || n.indexOf(dn) > -1;
              })[0];
    if (!hit) return null;
    var base = hit[0].split('-')[0];
    return {
      study: {
        po: '', mt: hit[0], quote: '',
        client: 'Merck', acronym: 'MRK', preparedBy: '',
        contactName: (HUBSPOT_CONTACTS[base] || {}).name || '',
        contactEmail: (HUBSPOT_CONTACTS[base] || {}).email || '',
        dealName: hit[1],
        specimens: [], perSubject: '', cohorts: [],
        fromHubspot: true,
        priorExtensions: (HUBSPOT_BY_MT[base] || []).filter(function (d) {
          return !!d.ext; }).length
      },
      via: 'HubSpot deal name'
    };
  }

  function findStudy(po, mt) {
    po = String(po || '').trim().toLowerCase();
    mt = String(mt || '').trim().toUpperCase();

    if (po) {
      var regPo = (quotes || []).filter(function (q) {
        return String((q.header || {}).originalStudyPo || '').toLowerCase() === po;
      });
      if (regPo.length === 1) return { registerQuote: regPo[0], via: 'PO number' };

      var byPo = STUDY_INDEX.filter(function (s) { return s.po.toLowerCase() === po; });
      if (byPo.length === 1) return { study: byPo[0], via: 'PO number' };
      if (byPo.length > 1) return { ambiguous: byPo.length, via: 'PO number' };
    }
    if (mt) {
      // The register is checked first — a study quoted in this tool is the best
      // answer available, and MT9920 aside an MT number identifies one study.
      var regMt = (quotes || []).filter(function (q) {
        return !q.isExtension && String(q.mtNumber || '').toUpperCase() === mt;
      });
      if (regMt.length === 1) return { registerQuote: regMt[0], via: 'MT number' };

      var byMt = STUDY_INDEX.filter(function (s) { return s.mt.toUpperCase() === mt; });
      if (byMt.length === 1) return { study: byMt[0], via: 'MT number' };
      if (byMt.length > 1) return { ambiguous: byMt.length, via: 'MT number', mt: mt };

      // Nothing quoted in this tool. Fall back to HubSpot, which knows the
      // sponsor and the deal name and nothing else about the study.
      var base = mt.split('-')[0];
      if (UMBRELLA_MT.indexOf(base) > -1 && (HUBSPOT_BY_MT[base] || []).length > 1) {
        return { umbrella: base, count: HUBSPOT_BY_MT[base].length, via: 'MT number' };
      }
      var deals = HUBSPOT_BY_MT[base] || [];
      if (deals.length) {
        var bases = deals.filter(function (d) { return !d.ext; });
        var pick = bases[0] || deals[0];
        return {
          study: {
            po: '', mt: pick.mt, quote: '',
            client: 'Merck', acronym: 'MRK', preparedBy: '',
            contactName: (HUBSPOT_CONTACTS[base] || {}).name || '',
            contactEmail: (HUBSPOT_CONTACTS[base] || {}).email || '',
            dealName: pick.deal,
            specimens: [], perSubject: '', cohorts: [],
            fromHubspot: true,
            priorExtensions: deals.filter(function (d) { return !!d.ext; }).length
          },
          via: 'MT number in HubSpot'
        };
      }
    }
    return null;
  }

  /** Quote name drafts from the cohorts and specimens (spec §06). */
  function draftQuoteName(d) {
    var indication = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean)[0] || '';
    var specs = orderedSpecimens(d).map(function (t) {
      return specimenLabel(d, t).toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' & ' + specs[specs.length - 1]
      : specs.join(' & ');
    var base = [indication, specPart].filter(Boolean).join(' - ');
    if (!base) return '';
    if (d.isExtension && d.header.parentMtNumber) {
      base += ' (' + d.header.parentMtNumber + ' extension #' +
        (d.header.extensionNumber || '?') + ')';
    }
    return base;
  }

  /** Section numbering is load-bearing: §10's pricing blocks are numbered to
   *  match §05's specimen order, and the drafted name and summary list them the
   *  same way. Everything reads this rather than the order they were ticked. */
  function orderedSpecimens(d) {
    return ALL_SPECIMENS.filter(function (t) {
      return (d.specimenTypes || []).indexOf(t) > -1;
    });
  }

  /** What to call a specimen in prose. An "other" that has been named reads as
   *  its name; everything else reads as itself. Without this the summary says
   *  "other", which tells a sponsor nothing. */
  function specimenLabel(d, t) {
    var name = String((((d || {}).specimenDetail || {})[t] || {}).otherName || '').trim();
    return name || t;
  }

  /** Priced units in a cohort: subjects times units per subject, which is one
   *  unless the quote says otherwise. */
  function cohortUnitCount(c, key, pr) {
    var per = num(((pr || {}).cohortPer || {})[key]) || 1;
    return cohortSubjects(c) * per;
  }

  /** Subjects in a cohort. Subcohorts win when present. Module scope because
   *  §03 counts them, §11 prices them and the export reads them. */
  function cohortSubjects(c) {
    if (c.subcohorts && c.subcohorts.length) {
      return c.subcohorts.reduce(function (s, sc) { return s + num(sc.subjects); }, 0);
    }
    return num(c.subjects);
  }

  /** A specimen with no explicit list is collected at every timepoint — the
   *  common case, and the one a rep should not have to tick. */
  function collectedAt(detail, name, tps) {
    if (!detail || !detail.atTimepoints) return true;
    return detail.atTimepoints.indexOf(name) > -1;
  }

  /** Collections per subject for one specimen. Never below 1: a single
   *  collection study still collects it once. */
  function collectionCount(detail, tps) {
    if (!tps || tps.length < 2) return 1;
    if (!detail || !detail.atTimepoints) return tps.length;
    return tps.filter(function (name) {
      return detail.atTimepoints.indexOf(name) > -1;
    }).length;
  }

  /** Study summary drafts in the real quotes' phrasing (spec §06). */
  function draftSummary(d) {
    var specs = orderedSpecimens(d).map(function (t) {
      return specimenLabel(d, t).toLowerCase(); });
    var specPart = specs.length > 2
      ? specs.slice(0, -1).join(', ') + ' and ' + specs[specs.length - 1]
      : specs.join(' and ');
    var pop = (d.cohorts || [])
      .map(function (c) { return String(c.name || '').trim(); })
      .filter(Boolean).join(', ');

    if (d.isExtension && d.header.designChanged === false) {
      var q = d.header.originalStudyQuote || 'the original quote';
      var po = String(d.header.originalStudyPo || '').trim();
      var mt = String(d.header.parentMtNumber || '').trim();
      return 'This study is an extension to ' + (mt || 'the original study') +
        ' that was quoted under "' + q + '"' +
        (po ? ' and ordered under "' + po + '"' : '') +
        '. All study design elements remain the same except as noted below ' +
        '(pricing repeated for clarity).';
    }
    if (!specPart && !pop) return '';
    var out = 'The goal of this study is to collect and evaluate ' +
      (specPart || 'biospecimens') + ' from ' + (pop || 'study') + ' subjects.';

    // A processing protocol decides whether a site can take part at all, so it
    // is carried into the summary rather than left in §05 for someone to find.
    var detail = d.specimenDetail || {};
    var protocols = orderedSpecimens(d).map(function (t) {
      var note = String((detail[t] || {}).processing || '').trim();
      return note ? specimenLabel(d, t).toLowerCase() +
        ' requires ' + note.replace(/\.$/, '') : '';
    }).filter(Boolean);
    if (protocols.length) {
      out += ' Processing is not standard: ' + protocols.join('; ') + '.';
    }
    return out;
  }

  // ---------------------------------------------------------------- routing

  var view = document.getElementById('view');
  var route = { name: 'register', id: null };
  var statusFilter = 'all';

  // The internal draft previews what is on the form, not what was last saved —
  // a rep wants to see the document before committing to it. `resumeDraft`
  // carries the half-filled form across the round trip so nothing is retyped.
  var previewDraft = null;
  var resumeDraft = null;

  function go(name, id) {
    route = { name: name, id: id || null };
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      var current = (b.dataset.nav === 'register' && name === 'register') ||
                    (b.dataset.nav === 'new' && name === 'new');
      if (current) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  document.querySelectorAll('[data-nav]').forEach(function (b) {
    // Leaving by the top nav abandons whatever was on the form, so the
    // half-filled draft must not reappear on the next quote.
    b.addEventListener('click', function () {
      previewDraft = null; resumeDraft = null;
      go(b.dataset.nav);
    });
  });

  function render() {
    view.replaceChildren();
    if (route.name === 'register') { view.appendChild(renderRegister()); return; }
    if (route.name === 'draft') { view.appendChild(renderInternalDraft(route.id)); return; }
    view.appendChild(renderForm(route.id));
  }

  // ---------------------------------------------------------------- internal draft
  // A preview of the internal draft, laid out as the document will read. Not
  // the .docx — that is Phase 6 and has formatting rules of its own (spec §3).
  // This shows what the document will *contain*, including the pricing workings
  // and the internal notes, which is the half a rep needs to check before the
  // sponsor version is generated.

  /** The eight standard clauses, verbatim from the issued quotes. Identical on
   *  every one of the five; only the payment terms and the preparer vary, so
   *  those two are fields rather than text. */
  /** Four of the five real quotes are net 30 and one is net 45, so this is the
   *  default rather than fixed text. */
  var PAYMENT_TERMS_DEFAULT = 'net 30 days';

  var TERMS = [
    ['IRB & HIPAA', 'The protocol is IRB approved. All patient samples and clinical '
      + 'data elements provided to client will be de-identified and all protected '
      + 'health information will be removed in accordance with the Health Insurance '
      + 'Portability and Accountability Act (“HIPAA”). Client will not receive '
      + 'any personal identifiers and will not be able to link any samples or data '
      + 'back to any individual.'],
    ['Research Use', 'Biospecimens will be used solely for research and specifically '
      + 'not be used in a commercial clinical diagnostic product, in genetic cloning, '
      + 'or in humans (transplantation or otherwise).'],
    ['Deliveries', 'When MT Group notifies Client that biospecimens are ready for '
      + 'shipment, Client must be ready to accept those deliveries within two weeks '
      + 'of said notification or execute an alternative arrangement with MT Group.'],
    ['Applicable Laws', 'Client will comply with the applicable legal and regulatory '
      + 'requirements, principles, guidelines and standards governing the sourcing, '
      + 'handling, preparation, storage, banking, use, disposal, transfer, transport, '
      + 'import or export of biospecimens and associated data including without '
      + 'limitation the Code of Federal Regulations Title 45 Public Welfare CFR 46 '
      + 'Protection of Human Subjects.'],
    ['Quality Guarantee', 'MT Group will replace or refund any out-of-specification '
      + 'biospecimens delivered hereunder when Client communicates its claimed '
      + 'specification deficiency within 3 months of biospecimen delivery. MT '
      + 'Group’s liability for out-of-specification biospecimens will be capped '
      + 'at the purchase order value.'],
    ['Publications', 'Client will reference MT Group in any publication of data using '
      + 'biospecimens and/or clinical data collected by the MT Group study network by: '
      + 'a) authorship of MT Group employee(s) if criteria established by ICMJE are '
      + 'met, including but not limited to participation in study design, subject '
      + 'inclusion, center participation and selection, and biospecimen collection '
      + 'strategies; and/or b) reference in the Methods section as a partner or '
      + 'vendor; and/or c) reference in the Acknowledgments section.'],
    ['Unknown Elements', 'Client acknowledges and agrees that the biospecimens may '
      + 'have unknown characteristics and may potentially carry infectious diseases.'],
    ['Taxes', 'There are none.']
  ];

  /** The ticked conditions belonging to one section, as one run of prose. */
  function condText(q, sec) {
    var picked = q.conditions || {};
    return STUDY_CONDITIONS.filter(function (c) {
      return c.sec === sec && Object.prototype.hasOwnProperty.call(picked, c.id);
    }).map(function (c) { return picked[c.id]; }).join(' ');
  }

  function renderInternalDraft(id) {
    var q = previewDraft ||
      quotes.filter(function (x) { return x.id === id; })[0];
    var frag = document.createDocumentFragment();
    if (!q) { frag.appendChild(el('p', { text: 'Quote not found.' })); return frag; }

    frag.appendChild(el('button', { class: 'back', type: 'button',
      onclick: function () {
        previewDraft = null;
        go(id ? 'edit' : 'new', id);
      } }, ['← Back to the form']));

    var doc = el('div', { class: 'draft' });
    var isExt = !!q.isExtension && (q.header || {}).designChanged === false;

    doc.appendChild(el('div', { class: 'draft-stamp' }, [
      el('strong', { text: 'Internal draft' }),
      el('span', { text: 'The sponsor quote is this document with the green '
        + 'internal notes removed.' })
    ]));

    // Letterhead, left-justified as on the issued quotes.
    doc.appendChild(el('div', { class: 'draft-head' }, [
      el('div', { text: 'The MT Group' }),
      el('div', { text: '7120 Hayvenhurst Avenue, Suite 317' }),
      el('div', { text: 'Los Angeles, CA 91406' })
    ]));
    doc.appendChild(el('div', { class: 'draft-rule' }));

    function row(label, value, cls) {
      if (!value) return null;
      return el('div', { class: 'draft-row' + (cls ? ' ' + cls : '') }, [
        el('div', { class: 'draft-label', text: label ? label + ':' : '' }),
        el('div', { class: 'draft-value' }, [].concat(
          String(value).split('\n').map(function (line) {
            return el('div', { text: line });
          })))
      ]);
    }
    function add(node) { if (node) doc.appendChild(node); }

    var h = q.header || {}, pr = q.pricing || {};
    var sh = q.shipping || {};

    add(row('Requestor', [h.sponsorContactName, h.sponsorContactEmail]
      .filter(Boolean).join('\n')));
    add(row('Client', q.client));
    add(row('Quote Date', docDate(q.quoteDate) +
      (h.validity ? ' (' + h.validity + ')' : '')));
    add(row('Quote Number', q.quoteNumber || quoteNumber(q)));
    doc.appendChild(el('div', { class: 'draft-rule' }));

    add(row('Summary', q.summary));
    add(row('Service Type', (h.serviceTypes || []).length
      ? (h.serviceTypes || []).join(' and ') + ' collection' : ''));

    // ---- cohorts -------------------------------------------------------
    var cohorts = q.cohorts || [];
    if (cohorts.length) {
      // An extension only lists the cohorts it actually adds subjects to.
      var shown = cohorts.filter(function (c) {
        return !isExt || extAdditionalOf(c) > 0; });
      var sizeLines = shown.map(function (c, i) {
        var n = isExt ? extAdditionalOf(c) : cohortSubjects(c);
        var basis = c.upTo ? 'up to ' : c.estimated ? 'estimating ' : '';
        var name = c.name || 'Cohort ' + (i + 1);
        var head = shown.length > 1 ? 'Cohort ' + (i + 1) + '. ' : '';
        return head + name + (n ? ' (' + basis + n +
          (isExt ? ' additional subjects' : ' subjects') + ')' : '');
      });
      cohorts.forEach(function (c, i) {
        (c.subcohorts || []).forEach(function (sc, j) {
          var n = isExt ? num(sc.additionalSubjects) : num(sc.subjects);
          sizeLines.push('    ' + (i + 1) + String.fromCharCode(97 + j) + '. ' +
            (sc.note || '') + (n ? ' (' + n + ')' : ''));
        });
      });
      // A pooled extension population reads as prose, then the total, then
      // the types as bullets — the shape MT2234 extension #2 uses.
      var note = String(q.populationNote || '').trim();
      var types = String(q.populationTypes || '').split('\n')
        .map(function (l) { return l.trim(); }).filter(Boolean);
      if (isExt && (note || types.length)) {
        var total = (q.cohorts || []).reduce(function (t, c) {
          return t + extAdditionalOf(c); }, 0);
        var body = el('div', { class: 'draft-value' });
        var noun = String(((q.cohorts || [])[0] || {}).name || '').trim().toLowerCase();
        if (noun && !/s$/.test(noun)) noun += 's';
        var lead = (q.extUpTo ? 'Up to ' : '') + total + ' total subjects' +
          (types.length
            ? ' with the following ' + (noun ? noun + ' ' : '') + 'will be enrolled.'
            : ' will be enrolled.');
        body.appendChild(el('div', { text: total ? lead : '' }));
        if (note) body.appendChild(el('div', { text: note }));
        if (types.length) {
          body.appendChild(el('ul', {}, types.map(function (t) {
            return el('li', { text: t }); })));
        }
        doc.appendChild(el('div', { class: 'draft-row' }, [
          el('div', { class: 'draft-label', text: 'Populations and Size:' }), body]));
      } else {
        add(row(isExt ? 'Additional Subjects' : 'Size', sizeLines.join('\n')));
      }
    }

    // I/E criteria print per cohort, as they do on the multi-cohort quotes.
    if (!isExt) {
      cohorts.forEach(function (c, i) {
        if (!c.inclusion && !c.exclusion) return;
        var label = cohorts.length > 1
          ? 'Cohort ' + (i + 1) + ' I/E Criteria' : 'Inclusions / Exclusions';
        var body = el('div', { class: 'draft-value' });
        function bulletBlock(head, text) {
          var lines = String(text || '').split('\n')
            .map(function (l) { return l.trim(); }).filter(Boolean);
          if (!lines.length) return;
          body.appendChild(el('div', { class: 'draft-ie-head', text: head }));
          body.appendChild(el('ul', {}, lines.map(function (l) {
            return el('li', { text: l }); })));
        }
        bulletBlock('Inclusions', c.inclusion);
        bulletBlock('Exclusions', c.exclusion);
        body.appendChild(el('div', {}, [
          el('u', { text: 'No additional inclusions or exclusions' })]));
        doc.appendChild(el('div', { class: 'draft-row' }, [
          el('div', { class: 'draft-label', text: label + ':' }), body]));
      });
    }

    // ---- biospecimens --------------------------------------------------
    var specs = orderedSpecimens(q);
    if (specs.length) {
      add(row('Biospecimens', specs.map(function (t) {
        var d = (q.specimenDetail || {})[t] || {};
        var spec = SPECIMEN_SPEC[t] || {};
        var bits = [specimenLabel(q, t)];
        if (d.tubeCount) bits.push(d.tubeCount + ' tubes per subject');
        else if (d.amount) bits.push(d.amount);
        if (d.freeform) bits.push(d.freeform);
        if (spec.says) bits.push(spec.says.replace(/\.$/, ''));
        return bits.join(' — ');
      }).join('\n')));
      var processing = specs.map(function (t) {
        return ((q.specimenDetail || {})[t] || {}).processing; }).filter(Boolean);
      if (processing.length) add(row('Processing', processing.join('\n')));
    }
    add(row('Collection conditions', condText(q, '05')));
    add(row('Provided by sponsor', q.sponsorProvides));

    var cd = q.clinicalData || {};
    add(row('Clinical Data', [
      (cd.required || []).join(', '),
      (cd.ifAvailable || []).length
        ? 'If available: ' + cd.ifAvailable.join(', ') : '',
      cd.detail].filter(Boolean).join('\n')));
    add(row('Population conditions',
      [condText(q, '03'), condText(q, '04')].filter(Boolean).join(' ')));

    var addrText = String(sh.addresses || '');
    var usLine = sh.usDestination &&
      addrText.indexOf(usDestinationSentenceFor(q)) === -1
        ? usDestinationSentenceFor(q) : '';
    add(row('Shipping & Handling', [usLine, addrText, sh.detail,
      condText(q, '10')].filter(Boolean).join('\n')));

    var tl = q.timeline || {};
    add(row('Study Timeline', [
      tl.kickoffCall ? 'A study kick off call will be scheduled.' : '',
      tl.initiation ? 'Study initiation ' + tl.initiation + '.' : '',
      tl.enrollmentCompletion ? 'Enrollment complete ' + tl.enrollmentCompletion + '.' : '',
      tl.delivery ? 'Delivery ' + tl.delivery + '.' : '',
      condText(q, '09')
    ].filter(Boolean).join(' ')));

    // ---- costs ---------------------------------------------------------
    // Printed as labelled lines, the way the quotes read — not as a table.
    // The internal figures hang off the right of each line in the accent
    // colour, and are the only part the sponsor version drops.
    var lines = draftCostLines(q);

    // The rate block: one labelled group per kind of cost, each listing its
    // unit rates. Only the first line of a group carries the label, exactly as
    // the quotes read.
    var groups = [];
    lines.rows.forEach(function (r) {
      var g = groups.filter(function (x) { return x.name === r.group; })[0];
      if (!g) { g = { name: r.group, rows: [] }; groups.push(g); }
      g.rows.push(r);
    });

    groups.forEach(function (g) {
      var body = el('div', { class: 'draft-value' });
      g.rows.forEach(function (r) {
        var line = el('div', { class: 'draft-rate' }, [
          el('span', { text: r.rate + (g.rows.length > 1 && r.desc
            ? ' (' + r.desc + ')' : '') })
        ]);
        if (r.siteCost || r.note) {
          line.appendChild(el('span', { class: 'draft-internal', text:
            [r.siteCost ? 'site ' + docMoney(num(r.siteCost)) : '', r.note || '']
              .filter(Boolean).join(' \u00b7 ') }));
        }
        body.appendChild(line);
      });
      doc.appendChild(el('div', { class: 'draft-row' }, [
        el('div', { class: 'draft-label', text: g.name + ':' }), body]));
    });

    // The Total Study Cost breakdown: the extended amount for every line, then
    // the total. A single-line quote just states the total.
    var totalBody = el('div', { class: 'draft-value' });
    var showBreakdown = pr.totalBreakdown == null
      ? lines.rows.length > 2 : !!pr.totalBreakdown;
    if (showBreakdown && lines.rows.length > 1) {
      lines.rows.forEach(function (r) {
        totalBody.appendChild(el('div', { class: 'draft-rate' }, [
          el('span', { class: 'draft-amt', text: docMoney(r.amount) }),
          el('span', { text: '(' + (r.desc || r.group) +
            (r.sub ? ' \u2014 ' + r.sub : '') + ')' })]));
      });
    }
    var capped = !!q.extUpTo ||
      (q.cohorts || []).some(function (c) { return c.upTo; });
    var brokeDown = totalBody.childNodes.length > 0;
    totalBody.appendChild(el('div', { class: 'draft-rate draft-grand' }, [
      el('span', { class: 'draft-amt',
        text: (capped ? 'Up to ' : '') + docMoney(lines.total) }),
      el('span', { text: pr.totalAssumption && !isExt
        ? '(' + pr.totalAssumption + ')'
        : (brokeDown ? '(Total)' : '') })]));
    doc.appendChild(el('div', { class: 'draft-row' }, [
      el('div', { class: 'draft-label', text: 'Total Study Cost:' }), totalBody]));

    // Only the clauses with no home section — everything else has already
    // been printed in the paragraph it qualifies.
    var placed = {};
    STUDY_CONDITIONS.forEach(function (c) { if (c.sec) placed[c.id] = 1; });
    add(row('Pricing conditions', condText(q, '11')));

    var conds = Object.keys(q.conditions || {})
      .filter(function (k) { return !placed[k]; })
      .map(function (k) { return q.conditions[k]; });
    if (conds.length) add(row('Study conditions', conds.join('\n')));
    add(row('Notes', q.notes));

    // ---- terms ---------------------------------------------------------
    doc.appendChild(el('div', { class: 'draft-tc-head', text: 'TERMS AND CONDITIONS' }));
    TERMS.forEach(function (t) { add(row(t[0], t[1])); });
    add(row('Issue Purchase Orders to', 'THE MT GROUP, INC.'));

    var who = q.preparedBy || 'John Kibler';
    var email = q.preparedByEmail || 'jkibler@mtgroupbio.com';
    doc.appendChild(el('div', { class: 'draft-close' }, [
      el('div', { text: 'This Quote is prepared and approved by ' + who +
        ' (' + email + '). By issuing a Purchase Order and signing this Quote, '
        + 'you are accepting this Quote’s terms and conditions.' }),
      el('div', { text: 'Payment terms are ' +
        (String(h.paymentTerms || '').trim() || PAYMENT_TERMS_DEFAULT)
        + '. Invoices will be submitted the month after biospecimen deliveries.' }),
      el('div', { class: 'draft-sig' }, [
        el('div', { text: '_______________________' }),
        el('div', { text: 'Authorized Signature' })
      ])
    ]));

    frag.appendChild(doc);
    return frag;
  }

  function usDestinationSentenceFor(q) {
    var who = String(q.client || '').trim() || 'the sponsor';
    return 'Shipped to a US-based destination designated by ' + who + '.';
  }

  /** The cost lines as the document prints them, each carrying the internal
   *  figures alongside so the draft can show both.
   *
   *  Extension-aware: an extension prices the *additional* subjects, at either
   *  one rate for every cohort or a rate per cohort per biospecimen. Reading
   *  the full-quote cohort counts here priced an extension against the parent
   *  study's whole population, which is what made the preview wrong.
   */
  function draftCostLines(q) {
    var pr = q.pricing || {}, rows = [], total = 0;
    var isExt = !!q.isExtension && (q.header || {}).designChanged === false;

    // rate = the unit rate as printed ("$1,650 / subject"); desc = what it is
    // for ("Cancer"); amount = the extended figure. The quotes print the rates
    // in one block and the amounts in the Total Study Cost breakdown below.
    function push(rate, desc, amount, siteCost, note, group, sub) {
      rows.push({ rate: rate, desc: desc, amount: amount, sub: sub || '',
        siteCost: siteCost, note: note, group: group || 'Biospecimen Costs' });
      total += amount;
    }

    if (isExt) {
      var addl = (q.cohorts || []).reduce(function (t, c) {
        return t + extAdditionalOf(c); }, 0);
      if (pr.extMode === 'flat') {
        var flat = num((q.header || {}).perSubject);
        if (flat) push(docMoney(flat) + ' / subject', 'Biospecimens & Data', addl * flat);
      } else {
        var types = orderedSpecimens(q);
        (q.cohorts || []).forEach(function (c, i) {
          var key = c.name || ('cohort-' + i);
          var n = extAdditionalOf(c);
          if (!n) return;
          var byType = (pr.cohortSpecimenPrices || {})[key] || {};
          var ic = (pr.cohortInternal || {})[key] || {};
          var priced = types.filter(function (t) { return num(byType[t]); });
          if (priced.length) {
            priced.forEach(function (t, j) {
              var p = num(byType[t]);
              push(docMoney(p) + ' / ' + specimenLabel(q, t).toLowerCase(),
                c.name || 'Cohort ' + (i + 1), n * p,
                j === 0 ? ic.siteCost : '', j === 0 ? ic.notes : '', '',
                priced.length > 1 ? specimenLabel(q, t).toLowerCase() : '');
            });
          } else {
            var p2 = num((pr.cohortPrices || {})[key]);
            if (p2) push(docMoney(p2) + ' / subject', c.name || 'Cohort ' + (i + 1),
              n * p2, ic.siteCost, ic.notes);
          }
        });
      }
    } else if (pr.fullMode !== 'specimen') {
      (q.cohorts || []).forEach(function (c, i) {
        var key = c.name || ('cohort-' + i);
        var p = num((pr.cohortPrices || {})[key]);
        if (!p) return;
        var per = num((pr.cohortPer || {})[key]) || 1;
        var n = cohortSubjects(c) * per;
        var unit = (pr.cohortUnits || {})[key] || 'subject';
        var ic = (pr.cohortInternal || {})[key] || {};
        push(docMoney(p) + ' / ' + unit, c.name || 'Cohort ' + (i + 1),
          n * p, ic.siteCost, ic.notes);
      });
    } else {
      orderedSpecimens(q).forEach(function (t) {
        var sp = (pr.specimenPrices || {})[t] || {};
        var p = num(sp.price);
        if (!p) return;
        var n = (q.cohorts || []).reduce(function (a, c) { return a + cohortSubjects(c); }, 0);
        push(docMoney(p) + ' / subject', specimenLabel(q, t).toLowerCase(), n * p,
          sp.siteCost, sp.notes);
      });
    }

    if ((pr.screenfail || {}).enabled) {
      var sfN = screenfailCases(pr), sfRate = num(pr.screenfail.perSubject);
      if (sfN && sfRate) {
        // The quotes state the rate and let the caveat ride with it —
        // "$600 / subject (capped at 20% of enrollment)".
        var caveat = String(pr.screenfail.explanation || '').trim();
        push(docMoney(sfRate) + ' / subject' + (caveat ? ' (' + caveat + ')' : ''),
          'Screenfails', sfN * sfRate, '', '', 'Screenfail Rate');
      }
    }

    if ((q.clinicalData || {}).outcomeData && num(pr.outcomeFee)) {
      push(docMoney(num(pr.outcomeFee)) + ' / subject', 'Outcome data',
        subjectsOf(q) * num(pr.outcomeFee), '', '', 'Outcome Data');
    }

    (pr.otherCosts || []).forEach(function (o) {
      var a = otherCostAmount(o);
      if (!a) return;
      // The quotes state these as a rate — "$50 / subject stool" — and leave
      // the count to the Total Study Cost breakdown underneath.
      var unit = String(o.unit || '').trim().replace(/s$/, '');
      push(docMoney(num(o.amount)) + (unit ? ' / ' + unit : ''),
        o.label || 'Other cost', a, '', '', o.label || 'Other cost');
    });

    var st = quoteShippingTotal(q);
    if (st) {
      var perSub = (q.shipping || {}).mode === 'perSubject';
      if ((q.shipping || {}).mode === 'perSpecimen') {
        var rates = ((q.shipping || {}).specimenRates) || {};
        var shipN = subjectsOf(q) +
          (((pr.screenfail || {}).shipped) ? screenfailCases(pr) : 0);
        orderedSpecimens(q).forEach(function (ty) {
          var r = num(rates[ty]);
          if (!r) return;
          push(docMoney(r) + ' / ' + specimenLabel(q, ty).toLowerCase(),
            'Shipping', 0, '', '', 'Shipping and Handling',
            specimenLabel(q, ty).toLowerCase());
          rows[rows.length - 1].amount = r * shipN;
        });
        total += st;
      } else {
        push(perSub ? docMoney(st / (subjectsOf(q) || 1)) + ' / subject' : docMoney(st),
          'Shipping', st, '', '', 'Shipping and Handling');
      }
    }

    return { rows: rows, total: total };
  }

  /** Ships site-to-sponsor overnight, so there is nothing to batch. */
  function shipsDirect(t) { return !!(SPECIMEN_SPEC[t] || {}).direct; }

  /** Cannot come out of a bank — it has to be collected from a live subject,
   *  so it cannot appear on a retrospective-only quote. */
  function isRetroImpossible(t) { return !!(SPECIMEN_SPEC[t] || {}).noRetro; }

  /** A quote is retrospective-only when retrospective is the sole service
   *  type — a quote that is also prospective can still collect fresh. */
  function isRetrospectiveOnly(q) {
    var st = ((q.header || {}).serviceTypes) || [];
    return st.indexOf('Retrospective') > -1 && st.indexOf('Prospective') === -1;
  }

  /** What one subject's biospecimens cost to ship on an extension — the sum of
   *  the per-type rates for everything ticked. */
  function extShippingPerSubject(q) {
    var rates = ((q.shipping || {}).specimenRates) || {};
    return orderedSpecimens(q).reduce(function (t, ty) {
      return t + num(rates[ty]); }, 0);
  }

  /** Screenfail cases a quote covers. A stated maximum, not a percentage. */
  function screenfailCases(pr) {
    var sf = (pr || {}).screenfail || {};
    if (!sf.enabled) return 0;
    return num(sf.maxCases);
  }

  /** Subjects a quote is priced against — additional ones on an extension. */
  function subjectsOf(q) {
    var isExt = !!q.isExtension && (q.header || {}).designChanged === false;
    return (q.cohorts || []).reduce(function (a, c) {
      return a + (isExt ? extAdditionalOf(c) : cohortSubjects(c)); }, 0);
  }

  /** Extra subjects on an extension cohort, for a quote that is not the one
   *  being edited. Mirrors extAdditional() inside the form. */
  function extAdditionalOf(c) {
    if (c.subcohorts && c.subcohorts.length) {
      return c.subcohorts.reduce(function (t, sc) {
        return t + num(sc.additionalSubjects); }, 0);
    }
    return num(c.additionalSubjects);
  }

  /** The shipping figure the sponsor is charged, for an arbitrary quote. The
   *  form has its own copy over the draft being edited; this one reads a saved
   *  quote and must agree with it, including counting an untyped sponsor leg
   *  as zero rather than inventing a shipment. */
  function quoteShippingTotal(q) {
    var sh = q.shipping;
    if (!sh) return 0;
    var isExt = !!q.isExtension && (q.header || {}).designChanged === false;
    var subjects = subjectsOf(q) +
      (((q.pricing || {}).screenfail || {}).shipped
        ? screenfailCases(q.pricing) : 0);
    var typed = String(sh.override == null ? '' : sh.override).trim();

    var specs = orderedSpecimens(q);
    var fresh = specs.length > 0 && specs.every(shipsDirect);
    var cost = fresh ? 0 : (sh.legs || []).reduce(function (t, leg) {
      var lc = String(leg.count == null ? '' : leg.count).trim() === ''
        ? (leg.toSponsor && (q.timeline || {}).batching
            ? (/2 batches/.test((q.timeline || {}).batching) ? 2 : 1) : 0)
        : num(leg.count);
      var lr = String(leg.rate == null ? '' : leg.rate).trim() === ''
        ? num(leg.intl && !(leg.toSponsor && sh.usDestination) ? sh.intlRate : sh.usRate)
        : num(leg.rate);
      return t + lc * lr; }, 0) * (num(sh.markup) || 1);

    if (sh.mode === 'perSpecimen') return subjects * extShippingPerSubject(q);
    if (sh.mode === 'perSubject') {
      var per = typed !== '' ? num(typed) : (subjects ? cost / subjects : 0);
      return per * subjects;
    }
    return typed !== '' ? num(typed) : cost;
  }

    return quotes.slice()
      .filter(function (q) { return statusFilter === 'all' || q.status === statusFilter; })
