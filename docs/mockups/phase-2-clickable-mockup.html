    // ---- 09 timeline & logistics ----------------------------------------

    function sectionTimeline() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('09', 'Timeline & logistics'));

      draft.timeline = draft.timeline || {};
      var tl = draft.timeline;

      var kickBox = el('div');
      function paintKick() {
        kickBox.replaceChildren();
        if (!tl.kickoffCall) return;
        kickBox.appendChild(field('Kickoff call trigger', { full: true,
          placeholder: 'What has to happen before the call is scheduled',
          get: function () { return tl.kickoffTrigger; },
          set: function (v) { tl.kickoffTrigger = v; } }));
      }
      sec.appendChild(checkbox('Kickoff call required',
        function () { return tl.kickoffCall; },
        function (v) { tl.kickoffCall = v; }, paintKick));
      sec.appendChild(kickBox);
      paintKick();

      var batchBox = el('div');
      function paintBatching() {
        batchBox.replaceChildren();
        var frozen = (draft.specimenTypes || []).some(function (t) {
          return /frozen|flash/i.test(t);
        });
        if (!frozen) return;
        var months = parseInt(String(tl.enrollmentCompletion || '').replace(/[^0-9].*$/, ''), 10);
        var canSplit = !isNaN(months) && months >= 3;
        var opts = canSplit
          ? ['1 batch (end of study)', '2 batches (midpoint + end)']
          : ['1 batch (end of study)'];
        batchBox.appendChild(field('Delivery batching', { type: 'select', options: opts,
          hint: canSplit
            ? 'Enrollment runs ' + months + ' months or more, so a midpoint batch is available.'
            : 'Under three months of enrollment, so a single end-of-study batch is the only option.',
          get: function () { return opts.indexOf(tl.batching) > -1 ? tl.batching : opts[0]; },
          set: function (v) { tl.batching = v; } }));
      }

      sec.appendChild(el('div', { class: 'grid' }, [
        field('Site / study initiation', { placeholder: 'e.g. 3-4 weeks from PO',
          get: function () { return tl.initiation; }, set: function (v) { tl.initiation = v; } }),
        field('Enrollment completion', { placeholder: 'e.g. 6-9 months',
          hint: 'Free text so ranges work. The leading number drives batching below.',
          get: function () { return tl.enrollmentCompletion; },
          set: function (v) { tl.enrollmentCompletion = v; }, then: paintBatching }),
        field('Data / specimen delivery', { placeholder: 'e.g. within 30 days of collection',
          get: function () { return tl.delivery; }, set: function (v) { tl.delivery = v; } }),
        field('Delivery restrictions', { placeholder: 'e.g. max 10/week, Tues-Fri only',
          get: function () { return tl.restrictions; }, set: function (v) { tl.restrictions = v; } }),
        field('Maximum subjects delivered per day', { placeholder: 'e.g. 4',
          inputmode: 'numeric',
          hint: 'A site enrolling in bursts can overrun a downstream processing limit nobody stated.',
          get: function () { return tl.maxPerDay; }, set: function (v) { tl.maxPerDay = v; } }),
        field('Days fresh cases can be received', { placeholder: 'e.g. Mon-Fri, or any day incl. weekends',
          hint: 'Fresh collection is surgery-driven and surgery does not stop for weekends. A weekday-only receiver silently loses eligible cases.',
          get: function () { return tl.receivingDays; }, set: function (v) { tl.receivingDays = v; } })
      ]));

      sec.appendChild(field('Timeframe blackouts', { full: true,
        placeholder: 'e.g. no subjects in January; lab closed 20 Dec – 2 Jan',
        hint: 'An unstated blackout makes every enrollment projection wrong.',
        get: function () { return tl.blackouts; }, set: function (v) { tl.blackouts = v; } }));

      sec.appendChild(field('Delivery address(es)', { type: 'textarea', rows: 2, full: true,
        placeholder: 'One per line if there is more than one',
        get: function () { return tl.addresses; }, set: function (v) { tl.addresses = v; } }));

      sec.appendChild(batchBox);
      paintBatching();
      return sec;
    }

    // ---- 03 population & cohorts (full quote) ---------------------------

    function sectionPopulation() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('03', 'Population & cohorts'));

      draft.cohorts = draft.cohorts || [];
      var cards = el('div');
      // Declared before paintCards() runs — it calls paintAllocation().
      var allocBox = el('div');

      function cohortSubjects(c) {
        if (c.subcohorts && c.subcohorts.length) {
          return c.subcohorts.reduce(function (s, sc) { return s + num(sc.subjects); }, 0);
        }
        return num(c.subjects);
      }

      function selectedSubpops() {
        return draft.cohorts.reduce(function (a, c) {
          return a.concat(c.subpopulations || []);
        }, []);
      }

      function paintCards() {
        cards.replaceChildren();
        draft.cohorts.forEach(function (c, i) { cards.appendChild(cohortCard(c, i)); });
        // Allocation note appears only once more than one subpopulation is in play.
        paintAllocation();
        refreshDrafts();
      }

      function cohortCard(c, i) {
        c.subpopulations = c.subpopulations || [];
        c.severity = c.severity || [];
        c.subcohorts = c.subcohorts || [];

        var card = el('div', { class: 'toggle-box' });
        var head = el('div', { class: 'cohort-card-head' }, [
          el('span', { class: 'sec-num', text: String(i + 1) }),
          el('span', { class: 'cohort-card-title', text: c.name || 'Untitled cohort' })
        ]);
        if (draft.cohorts.length > 1) {
          head.appendChild(el('button', { class: 'row-x', type: 'button',
            'aria-label': 'Remove cohort ' + (i + 1),
            onclick: function () { draft.cohorts.splice(i, 1); paintCards(); } }, ['×']));
        }
        card.appendChild(head);

        var autoSummed = c.subcohorts.length > 0;

        var subjFld = field('# subjects', {
          inputmode: 'numeric',
          hint: autoSummed ? 'Summed from the subcohorts below.' : '',
          get: function () { return autoSummed ? String(cohortSubjects(c)) : c.subjects; },
          set: function (v) { if (!autoSummed) c.subjects = v; },
          then: function () { refreshDrafts(); } });
        if (autoSummed) {
          subjFld._input.disabled = true;
          subjFld._input.value = String(cohortSubjects(c));
        }

        var top = el('div', { class: 'grid' }, [
          field('Cohort name', { required: true, placeholder: 'e.g. Colorectal cancer',
            get: function () { return c.name; },
            set: function (v) { c.name = v; head.children[1].textContent = v || 'Untitled cohort'; },
            then: function () { refreshDrafts(); } }),
          subjFld
        ]);
        card.appendChild(top);

        var upTo = checkbox('Up to this number (not a firm target)',
          function () { return c.upTo; }, function (v) { c.upTo = v; });
        upTo.style.margin = '2px 0 14px';
        card.appendChild(upTo);

        // --- population group
        var subBox = el('div');
        var sevBox = el('div');

        card.appendChild(el('div', { class: 'grid' }, [
          field('Population group', { type: 'select',
            options: [''].concat(POPULATION_GROUPS),
            get: function () { return c.populationGroup || ''; },
            set: function (v) {
              c.populationGroup = v;
              c.subpopulations = [];
              c.severity = [];
            },
            then: function () { paintSubpops(); paintSeverity(); paintAllocation(); } })
        ]));

        function paintSubpops() {
          subBox.replaceChildren();
          var g = c.populationGroup;
          if (!g) return;

          // "Other" as a group skips the subpopulation list entirely (spec §03).
          if (g === 'Other') {
            subBox.appendChild(field('Population — describe', { full: true,
              get: function () { return c.populationOther; },
              set: function (v) { c.populationOther = v; } }));
            return;
          }

          var list = c.showAllSubpops ? ALL_SUBPOPULATIONS : (SUBPOPULATIONS_BY_GROUP[g] || []);
          var fs = el('fieldset', {}, [el('legend', { text: 'Subpopulation(s)' })]);
          if (!list.length) {
            fs.appendChild(el('div', { class: 'hint', text: 'No subpopulations listed for this group.' }));
          }
          fs.appendChild(el('div', { class: 'spec-cols' }, chunk(list, 3).map(function (col) {
            return el('div', { class: 'spec-col' }, col.map(function (sp) {
              return checkbox(sp,
                function () { return c.subpopulations.indexOf(sp) > -1; },
                function (on) {
                  var k = c.subpopulations.indexOf(sp);
                  if (on && k === -1) c.subpopulations.push(sp);
                  if (!on && k > -1) c.subpopulations.splice(k, 1);
                },
                function () { paintSubpopOther(); paintSeverity(); paintAllocation(); refreshDrafts(); });
            }));
          })));

          // HubSpot has no group→subpopulation mapping; ours can be wrong.
          fs.appendChild(el('label', { class: 'check', style: 'margin-top:10px' }, [
            (function () {
              var b = el('input', { type: 'checkbox', onchange: function () {
                c.showAllSubpops = b.checked; paintSubpops();
              } });
              b.checked = !!c.showAllSubpops;
              return b;
            })(),
            el('span', { class: 'hint', style: 'margin:0',
              text: 'Show all subpopulations, not just this group’s' })
          ]));
          subBox.appendChild(fs);
          paintSubpopOther();
        }

        var otherBox = el('div');
        function paintSubpopOther() {
          otherBox.replaceChildren();
          c.subpopulations.filter(function (sp) { return sp.indexOf('Other') === 0; })
            .forEach(function (sp) {
              c.subpopulationDetail = c.subpopulationDetail || {};
              otherBox.appendChild(field(sp + ' — which', { full: true,
                placeholder: 'e.g. Small intestine',
                get: function () { return c.subpopulationDetail[sp]; },
                set: function (v) { c.subpopulationDetail[sp] = v; } }));
            });
        }

        function paintSeverity() {
          sevBox.replaceChildren();
          var g = c.populationGroup;
          if (!g || g === 'Other') return;

          var opts = ONCOLOGY_GROUPS.indexOf(g) > -1 ? STAGES : SEVERITIES;
          var fs = el('fieldset', {}, [el('legend', { text: 'Severity / stage' })]);
          fs.appendChild(el('div', { class: 'check-row' }, opts.map(function (o) {
            return checkbox(o,
              function () { return c.severity.indexOf(o) > -1; },
              function (on) {
                var k = c.severity.indexOf(o);
                if (on && k === -1) c.severity.push(o);
                if (!on && k > -1) c.severity.splice(k, 1);
              });
          })));
          sevBox.appendChild(fs);

          // Scoring systems attach to the subpopulation, and their thresholds live
          // in the company reference doc — so ask for the requirement as text.
          c.scores = c.scores || {};
          c.subpopulations.forEach(function (sp) {
            var scale = CLINICAL_SCORES[sp];
            if (!scale) return;
            sevBox.appendChild(field(scale + ' requirement (' + sp + ')', { full: true,
              placeholder: 'e.g. ' + scale + ' ≥ 12 at enrollment',
              get: function () { return c.scores[sp]; },
              set: function (v) { c.scores[sp] = v; } }));
          });

          sevBox.appendChild(field('Additional severity detail', { full: true,
            placeholder: 'Precision the checkboxes cannot hold — e.g. "Stage Ia only"',
            get: function () { return c.severityDetail; },
            set: function (v) { c.severityDetail = v; } }));
        }

        card.appendChild(subBox);
        card.appendChild(otherBox);
        card.appendChild(sevBox);
        paintSubpops();
        paintSeverity();

        // --- subcohorts
        var scBox = el('div');
        function paintSub() {
          scBox.replaceChildren();
          if (!c.subcohorts.length) return;
          var rows = el('div', { class: 'cohorts' });
          rows.appendChild(el('div', { class: 'cohort-row ext cohort-head' }, [
            el('span', { text: 'Subcohort' }), el('span', { class: 'ca', text: '# subjects' }),
            el('span', {}), el('span', {}), el('span', {})]));
          c.subcohorts.forEach(function (sc, j) {
            var label = (i + 1) + String.fromCharCode(97 + j);
            var noteIn = el('input', { type: 'text', 'aria-label': 'Subcohort ' + label + ' note',
              placeholder: 'What distinguishes this subcohort',
              oninput: function () { sc.note = noteIn.value; } });
            noteIn.value = sc.note || '';
            var nIn = el('input', { type: 'text', inputmode: 'numeric',
              'aria-label': 'Subjects for subcohort ' + label,
              oninput: function () {
                sc.subjects = nIn.value;
                subjFld._input.value = String(cohortSubjects(c));
                refreshDrafts();
              } });
            nIn.value = sc.subjects == null ? '' : String(sc.subjects);
            var x = el('button', { class: 'row-x', type: 'button',
              'aria-label': 'Remove subcohort ' + label,
              onclick: function () {
                c.subcohorts.splice(j, 1); paintSub();
                subjFld._input.disabled = c.subcohorts.length > 0;
                subjFld._input.value = c.subcohorts.length ? String(cohortSubjects(c)) : (c.subjects || '');
                refreshDrafts();
              } }, ['×']);
            rows.appendChild(el('div', { class: 'cohort-row ext' }, [
              el('span', { class: 'sub-label' }, [label]), el('span', { class: 'ca' }, [nIn]),
              noteIn, el('span', {}), x]));
          });
          scBox.appendChild(rows);
        }
        paintSub();
        card.appendChild(scBox);
        card.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
          c.subcohorts.push({ subjects: '', note: '' });
          paintSub();
          subjFld._input.disabled = true;
          subjFld._input.value = String(cohortSubjects(c));
          subjFld._input.nextSibling && null;
          refreshDrafts();
        } }, ['+ Add subcohort']));

        return card;
      }

      paintCards();
      sec.appendChild(cards);
      sec.appendChild(el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.cohorts.push({ name: '', subjects: '', subpopulations: [], severity: [], subcohorts: [] });
        paintCards();
      } }, ['+ Add cohort']));

      // --- inclusion / exclusion
      sec.appendChild(el('div', { class: 'ie-note' }, [
        el('strong', { text: 'Keep these as prose, one criterion per line. ' }),
        el('span', { text: 'They carry geography, treatment history, washout periods and severity — detail no dropdown holds.' })
      ]));

      sec.appendChild(field('Inclusion criteria', { type: 'textarea', rows: 5, full: true,
        placeholder: 'One per line. Include where you are collecting, any lab value gates (which assay, how recent a result counts), and treatment status.',
        get: function () { return draft.inclusion; }, set: function (v) { draft.inclusion = v; } }));

      sec.appendChild(field('Exclusion criteria', { type: 'textarea', rows: 5, full: true,
        placeholder: 'One per line. Name excluded therapies individually, and say whether any become acceptable after a washout — and how long.',
        get: function () { return draft.exclusion; }, set: function (v) { draft.exclusion = v; } }));

      function paintAllocation() {
        allocBox.replaceChildren();
        if (selectedSubpops().length <= 1) return;
        allocBox.appendChild(field('Allocation note', { type: 'textarea', rows: 2, full: true,
          placeholder: 'e.g. MT Group and the sponsor will mutually agree in writing on enrollment allocations per cancer type',
          hint: 'Shown because more than one subpopulation is in play.',
          get: function () { return draft.allocationNote; },
          set: function (v) { draft.allocationNote = v; } }));
      }
      sec.appendChild(allocBox);
      paintAllocation();

      return sec;
    }

    function chunk(arr, n) {
      var per = Math.ceil(arr.length / n), out = [];
      for (var i = 0; i < arr.length; i += per) out.push(arr.slice(i, i + per));
      return out;
    }

    // ---- 05 biospecimens ----------------------------------------------

    function sectionSpecimens() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('05', 'Biospecimens'));
      sec.appendChild(partialNote(
        'Which specimen types this quote covers. Storage state, media, tube type, ' +
        'volumes, aliquots and FFPE specs are still to come.'));

      sec.appendChild(el('div', { class: 'spec-cols' }, SPECIMEN_GROUPS.map(function (g) {
        return el('div', { class: 'spec-col' }, [
          el('div', { class: 'spec-col-title', text: g.title })
        ].concat(g.items.map(function (t) {
          return checkbox(t,
            function () { return draft.specimenTypes.indexOf(t) > -1; },
            function (on) {
              var i = draft.specimenTypes.indexOf(t);
              if (on && i === -1) draft.specimenTypes.push(t);
              if (!on && i > -1) draft.specimenTypes.splice(i, 1);
            },
            function () { refreshDrafts(); });
        })));
      })));
      return sec;
    }

    // ---- 10 pricing ----------------------------------------------------

    var pricingRefresh = null;

    function sectionPricing() {
      var ext = isMinimal();
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('10', 'Pricing'));
      sec.appendChild(partialNote(ext
        ? 'Extensions repeat the original per-subject price. Shipping, screenfails and ' +
          'per-specimen breakdowns are still to come.'
        : 'One total for the whole study. Per-specimen pricing, shipping, screenfails, ' +
          'historical comparables and internal pricing notes are still to come.'));

      if (!ext) {
        sec.appendChild(el('div', { class: 'grid' }, [
          field('Total study cost', { placeholder: '125000.00', inputmode: 'decimal',
            get: function () { return draft.totalCost; }, set: function (v) { draft.totalCost = v; } }),
          field('Status', { type: 'select', options: STATUSES,
            get: function () { return draft.status; }, set: function (v) { draft.status = v; } })
        ]));
        pricingRefresh = null;
        return sec;
      }

      var calc = el('div', { class: 'calc' });
      var subjectsRow = el('span', { class: 'v' });
      var rateRow = el('span', { class: 'v' });
      var totalRow = el('span', { class: 'v' });

      function recalcPricing() {
        var add = draft.cohorts.reduce(function (s, c) { return s + num(c.additionalSubjects); }, 0);
        var rate = num(draft.header.perSubject);
        var total = add * rate;
        subjectsRow.textContent = String(add);
        rateRow.textContent = money(rate);
        totalRow.textContent = money(total);
        draft.totalCost = total ? total.toFixed(2) : '';
      }
      pricingRefresh = recalcPricing;

      sec.appendChild(el('div', { class: 'grid' }, [
        field('Biospecimens & data ($ per subject)', { placeholder: '1225.00', inputmode: 'decimal',
          hint: 'Carried over from the original quote when the lookup finds it.',
          get: function () { return draft.header.perSubject; },
          set: function (v) { draft.header.perSubject = v; },
          then: recalcPricing }),
        field('Status', { type: 'select', options: STATUSES,
          get: function () { return draft.status; }, set: function (v) { draft.status = v; } })
      ]));

      calc.appendChild(el('div', { class: 'calc-row' }, [
        el('span', { text: 'Additional subjects' }), subjectsRow]));
      calc.appendChild(el('div', { class: 'calc-row' }, [
        el('span', { text: 'Per subject' }), rateRow]));
      calc.appendChild(el('div', { class: 'calc-row calc-total' }, [
        el('span', { text: 'Total study cost' }), totalRow]));
      sec.appendChild(calc);
      recalcPricing();
      return sec;
    }

    // ---- 06 summary + quote name (after pricing) -----------------------

    var summaryInput = null, nameInput = null;

    function refreshDrafts() {
      if (!draft.summaryEdited && summaryInput) {
        var s = draftSummary(draft);
        if (s) { draft.summary = s; summaryInput.value = s; }
      }
      if (!draft.nameEdited && nameInput) {
        var n = draftQuoteName(draft);
        if (n) { draft.quoteName = n; nameInput.value = n; refreshNumber(); }
      }
    }

    function sectionSummaryAndName() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('06', 'Study summary & quote name'));

      var sFld = field('Study summary', { type: 'textarea', rows: 4, full: true,
        autofilled: true,
        hint: 'Drafts itself from the entries above. Once you edit it, it stops rewriting itself.',
        get: function () { return draft.summary; },
        set: function (v) { draft.summary = v; draft.summaryEdited = true; } });
      summaryInput = sFld._input;

      var nFld = field('Quote name', { required: true, full: true, autofilled: true,
        placeholder: 'CRC - plasma & buffy',
        hint: 'Drafts itself from the cohorts and specimens. Editing it stops the rewriting.',
        get: function () { return draft.quoteName; },
        set: function (v) { draft.quoteName = v; draft.nameEdited = true; } });
      nameInput = nFld._input;

      sec.appendChild(el('div', { class: 'grid' }, [sFld, nFld]));

      var redo = el('button', { class: 'add-row', type: 'button', onclick: function () {
        draft.summaryEdited = false; draft.nameEdited = false;
        var s = draftSummary(draft), n = draftQuoteName(draft);
        draft.summary = s; summaryInput.value = s;
        draft.quoteName = n; nameInput.value = n;
        refreshNumber();
        toast('Redrafted from your entries');
      } }, ['↻ Redraft both from the entries above']);
      sec.appendChild(redo);

      refreshDrafts();
      return sec;
    }

    // ---- 11 notes ------------------------------------------------------

    function sectionNotes() {
      var sec = el('section', { class: 'sec' });
      sec.appendChild(secHead('11', 'Additional quote details'));
      sec.appendChild(el('div', { class: 'hint',
        text: 'Anything else the quote should say. Appears on both the internal draft and the sponsor quote.' }));
      sec.appendChild(field('Notes', { type: 'textarea', rows: 4, full: true,
        placeholder: 'Delivery expectations, sponsor-specific terms, anything the sections above did not cover.',
        get: function () { return draft.notes; }, set: function (v) { draft.notes = v; } }));
      return sec;
    }

    // ---- actions -------------------------------------------------------

    renderExtBox();
    renderBody();

    var actions = el('div', { class: 'actions' });
    actions.style.marginTop = '30px';
    actions.appendChild(el('button', { class: 'btn btn-primary', type: 'button',
      onclick: function () { submit(); } }, [existing ? 'Save changes' : 'Create quote']));
    actions.appendChild(el('button', { class: 'btn', type: 'button',
      onclick: function () { go('register'); } }, ['Cancel']));

    if (existing) {
      actions.appendChild(el('button', { class: 'btn btn-danger spacer', type: 'button', onclick: function () {
        if (!confirm('Delete this quote? This cannot be undone.')) return;
        quotes = quotes.filter(function (q) { return q.id !== existing.id; });
        save(); go('register'); toast('Quote deleted');
      } }, ['Delete quote']));
    }
    wrap.appendChild(actions);

    function submit() {
      var errs = [];
      if (!String(draft.client).trim()) errs.push('Client / sponsor is required (§01).');
      if (!String(draft.quoteName).trim()) errs.push('Quote name is required (§06).');
      if (!String(draft.quoteDate).trim()) errs.push('Quote date is required (§01).');
      if (String(draft.totalCost).trim() !== '' && isNaN(Number(String(draft.totalCost).replace(/[$,]/g, '')))) {
        errs.push('Total cost must be a number (§10).');
      } else if (num(draft.totalCost) < 0) {
        errs.push('Total cost cannot be negative (§10).');
      }

      errorBox.replaceChildren();
      if (errs.length) {
        errorBox.appendChild(el('div', { class: 'errors', role: 'alert' }, [
          el('p', { text: 'This quote can’t be saved yet:' }),
          el('ul', {}, errs.map(function (e) { return el('li', { text: e }); }))
        ]));
        errorBox.scrollIntoView({ block: 'nearest' });
        return;
      }

      finalize(draft);
      if (existing) {
        for (var i = 0; i < quotes.length; i++) if (quotes[i].id === existing.id) quotes[i] = draft;
        save(); go('edit', existing.id); toast('Changes saved');
      } else {
        draft.id = uid();
        quotes.push(draft);
        save(); go('edit', draft.id); toast('Quote created');
      }
    }

    return frag;
  }

  function partialNote(text) {
    return el('div', { class: 'partial-note' }, [
      el('span', { class: 'partial-tag', text: 'Partial' }),
      el('span', { text: text })
    ]);
  }

  function secHead(num, title, note) {
    return el('div', { class: 'sec-head' }, [
      el('span', { class: 'sec-num', text: num }),
      el('span', { class: 'sec-title', text: title }),
      note ? el('span', { class: 'sec-note', text: note }) : null
    ]);
  }

  // ---------------------------------------------------------------- boot

  load();
  go('register');
})();
</script>
